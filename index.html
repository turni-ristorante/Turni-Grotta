<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turni Ristorante</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;font-size:13px;color:#1a1a1a;background:#f5f5f0;}
:root{
  --bg:#f5f5f0;--bg2:#fff;--bg3:#f0efea;--bg4:#e8e7e2;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --border:#d8d7d2;--border2:#c0bfba;
  --blue-bg:#e8f0fe;--blue-text:#1a56db;--blue-border:#93b4f7;
  --green-bg:#e6f4ea;--green-text:#1e7e34;--green-border:#86c98e;
  --red-bg:#fce8e6;--red-text:#c5221f;--red-border:#f5a8a4;
  --yellow-bg:#fef9e7;--yellow-text:#7a5c00;--yellow-border:#f5d76e;
  --orange-bg:#fff3e0;--orange-text:#e65100;--orange-border:#ffb74d;
  --radius:8px;--radius-lg:12px;
}
.app{max-width:1200px;margin:0 auto;padding:1rem;}
#loading-screen{position:fixed;inset:0;background:#f5f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1000;}
.spinner{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#1a56db;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;gap:1.5rem;min-height:80vh;}
.login-card{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
.login-card h3{font-size:16px;font-weight:500;}
.login-card p{font-size:12px;color:var(--text2);}
.login-card input{padding:8px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);background:#fff;color:var(--text);font-size:13px;width:100%;font-family:inherit;}
.login-or{text-align:center;font-size:12px;color:var(--text3);margin:2px 0;}
.err{font-size:12px;color:var(--red-text);}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;padding:8px 12px;background:#fff;border-radius:var(--radius);border:0.5px solid var(--border);}
.role-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;}
.role-badge.manager{background:var(--blue-bg);color:var(--blue-text);}
.role-badge.dipendente{background:var(--bg3);color:var(--text2);border:0.5px solid var(--border);}
.sync-status{font-size:11px;color:var(--text3);}
.sync-status.ok{color:var(--green-text);}
.sync-status.err{color:var(--red-text);}
nav{display:flex;gap:3px;background:var(--bg3);border-radius:var(--radius);padding:3px;margin-bottom:1rem;width:fit-content;flex-wrap:wrap;}
.nav-btn{padding:5px 13px;border-radius:6px;cursor:pointer;font-size:12px;border:none;background:transparent;color:var(--text2);font-family:inherit;}
.nav-btn.active{background:#fff;color:var(--text);font-weight:500;border:0.5px solid var(--border);}
.sec{display:none;}.sec.active{display:block;}
.main-with-sidebar{display:flex;gap:14px;align-items:flex-start;}
.main-content{flex:1;min-width:0;overflow:hidden;}
.leg-sidebar{width:195px;flex-shrink:0;background:#fff;border-radius:var(--radius);padding:10px;border:0.5px solid var(--border);}
.leg-sidebar h4{font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.leg-sidebar-item{margin-bottom:5px;padding-bottom:5px;border-bottom:0.5px solid var(--border);}
.leg-sidebar-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.leg-code{font-weight:600;font-size:11px;display:inline-block;padding:1px 7px;border-radius:4px;margin-bottom:2px;}
.leg-time{font-size:10px;color:var(--text2);line-height:1.5;}
.wrap{overflow-x:auto;}
table{border-collapse:collapse;font-size:12px;}
th,td{border:0.5px solid var(--border);padding:0;text-align:center;}
th{background:var(--bg3);font-weight:500;padding:5px 7px;white-space:nowrap;}
.scol{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:4px 8px;min-width:105px;font-weight:500;}
th.scol{background:var(--bg3);z-index:3;}
.fp{background:#fff8dd;color:#7a5c00;font-size:11px;font-weight:600;padding:5px 7px;white-space:nowrap;}
.fc{background:#ddeeff;color:#0a3d6e;font-size:11px;font-weight:600;padding:5px 7px;white-space:nowrap;}
.xc{background:var(--bg3);color:var(--text3);font-size:12px;padding:4px 6px;}
.rc{padding:2px 3px;min-width:95px;}
.rc select{width:100%;font-size:11px;padding:2px 3px;border:none;background:transparent;cursor:pointer;color:var(--text);font-family:inherit;}
.rc-ro{font-size:11px;padding:4px 6px;color:var(--text);}
.role-name-td{text-align:left;font-size:11px;padding:3px 8px;white-space:nowrap;background:var(--bg3);font-weight:500;position:sticky;left:0;z-index:2;}
.auto-td{font-size:11px;padding:3px 6px;color:var(--text2);}
.count-row td{background:var(--bg3);font-size:11px;font-weight:500;padding:4px 6px;color:var(--text2);}
.day-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem;}
.day-btn{padding:4px 11px;border-radius:var(--radius);border:0.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;font-size:12px;font-family:inherit;}
.day-btn.active{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-border);font-weight:500;}
.day-btn.pc{border-color:var(--yellow-border);}
.day-btn.pc.active{background:var(--yellow-bg);color:var(--yellow-text);border-color:var(--yellow-border);}
.sec-label{font-size:11px;font-weight:500;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin:1.25rem 0 6px;}
.btn{padding:5px 13px;border-radius:var(--radius);border:0.5px solid var(--border2);background:#fff;color:var(--text);cursor:pointer;font-size:12px;font-family:inherit;}
.btn:hover{background:var(--bg3);}
.btn.primary{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-border);}
.btn.danger{background:var(--red-bg);color:var(--red-text);border-color:var(--red-border);}
.btn.warn{background:var(--orange-bg);color:var(--orange-text);border-color:var(--orange-border);}
.btn.success{background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);}
td.shift-cell{padding:3px 4px;}
/* Fix: select text color in colored cells */
td.shift-cell select{width:66px;font-size:11px;padding:2px 3px;border:none;background:transparent;color:inherit;font-family:inherit;}
td.shift-cell-ro{padding:4px 8px;font-size:11px;font-weight:500;}
.leg-table{border-collapse:collapse;width:100%;font-size:12px;}
.leg-table th{background:var(--bg3);padding:5px 8px;border:0.5px solid var(--border);text-align:left;font-weight:500;white-space:nowrap;}
.leg-table td{border:0.5px solid var(--border);padding:3px 5px;text-align:center;}
.leg-table td input[type=text]{width:100%;border:none;background:transparent;font-size:12px;padding:2px 3px;color:var(--text);font-family:inherit;}
.cb-th{font-size:10px;max-width:52px;padding:3px 4px;line-height:1.3;}
.staff-list{display:flex;flex-direction:column;gap:4px;margin-bottom:1rem;}
.staff-row{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);cursor:grab;user-select:none;}
.staff-row.dragging{opacity:0.4;}
.staff-row.drag-over{border-color:var(--blue-border);background:var(--blue-bg);}
.drag-handle{color:var(--text3);font-size:16px;cursor:grab;padding:0 4px;}
.staff-add{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
.staff-add input{padding:6px 9px;border-radius:var(--radius);border:0.5px solid var(--border2);background:#fff;color:var(--text);font-size:12px;font-family:inherit;}
.config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:1rem;}
.config-card{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.config-card .dn{font-weight:500;margin-bottom:6px;font-size:13px;}
.config-card label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;margin-top:3px;}
.week-list{display:flex;flex-direction:column;gap:6px;}
.week-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);flex-wrap:wrap;}
.week-item.current{border-color:var(--blue-border);}
.week-selector{font-size:13px;padding:5px 9px;border-radius:var(--radius);border:0.5px solid var(--border2);background:#fff;color:var(--text);max-width:220px;font-family:inherit;}
.pub-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.pub-badge.yes{background:var(--green-bg);color:var(--green-text);}
.pub-badge.no{background:var(--bg3);color:var(--text3);border:0.5px solid var(--border);}
.color-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;padding:8px 12px;background:#fff;border-radius:var(--radius);border:0.5px solid var(--border);align-items:center;}
.color-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.color-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.staff-detail{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem;}
.staff-detail h4{font-size:14px;font-weight:500;margin-bottom:1rem;}
.cb-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem;}
.cb-pill{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;border:0.5px solid var(--border);background:var(--bg3);cursor:pointer;font-size:12px;}
.cb-pill.checked{border-color:var(--blue-border);}
.day-check-grid{display:flex;flex-wrap:wrap;gap:6px;}
.fab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:1rem;}
.fab-card{background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);padding:12px;}
.fab-card h4{font-size:13px;font-weight:500;margin-bottom:8px;}
.fab-slots{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
.fab-slot{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 8px;background:var(--bg3);border-radius:var(--radius);font-size:11px;}
.fab-slot-codes{display:flex;gap:3px;flex-wrap:wrap;align-items:center;}
.fab-shift-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600;}
.alert-box{background:var(--red-bg);border:0.5px solid var(--red-border);border-radius:var(--radius);padding:12px 16px;margin-bottom:1rem;}
.alert-box h4{font-size:13px;font-weight:500;color:var(--red-text);margin-bottom:6px;}
.alert-box ul{list-style:disc;padding-left:16px;font-size:12px;color:var(--red-text);}
.warn-box{background:var(--orange-bg);border:0.5px solid var(--orange-border);border-radius:var(--radius);padding:12px 16px;margin-bottom:1rem;}
.warn-box h4{font-size:13px;font-weight:500;color:var(--orange-text);margin-bottom:6px;}
.warn-box ul{list-style:disc;padding-left:16px;font-size:12px;color:var(--orange-text);}
.eq-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.eq-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);flex-wrap:wrap;}
.eq-tags{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.rules-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.rule-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);flex-wrap:wrap;}
.extra-badge{font-size:10px;padding:1px 7px;border-radius:20px;background:#fef3c7;color:#92400e;border:0.5px solid #fcd34d;margin-left:4px;}

.draft-panel{background:#f3e8ff;border:0.5px solid #c4b5fd;border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.draft-panel span{font-size:12px;color:#7e22ce;flex:1;}
.role-rule-row{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);flex-wrap:wrap;margin-bottom:6px;}
.day-pills{display:flex;gap:3px;flex-wrap:wrap;}
.day-pill{padding:2px 8px;border-radius:20px;font-size:10px;cursor:pointer;border:0.5px solid var(--border);background:var(--bg3);color:var(--text2);}
.day-pill.active{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue-border);}
.pref-roles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-bottom:1rem;}
.pref-role-item{display:flex;flex-direction:column;gap:3px;}
.pref-role-item label{font-size:11px;color:var(--text2);}
.btn.purple{background:#f3e8ff;color:#7e22ce;border-color:#c4b5fd;}

/* Compare panel */
.compare-panel{position:fixed;top:0;right:-600px;width:580px;height:100vh;background:#fff;border-left:2px solid var(--blue-border);box-shadow:-4px 0 20px rgba(0,0,0,0.15);z-index:500;transition:right 0.3s ease;display:flex;flex-direction:column;}
.compare-panel.open{right:0;}
.compare-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--blue-bg);border-bottom:0.5px solid var(--blue-border);flex-shrink:0;}
.compare-header h3{font-size:13px;font-weight:500;color:var(--blue-text);flex:1;}
.compare-body{flex:1;overflow:auto;padding:12px;}
.compare-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.2);z-index:499;display:none;}
.compare-overlay.open{display:block;}

/* Menu di navigazione a gruppi */
.nav-group{position:relative;}
.nav-group-btn{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;border:none;background:transparent;color:var(--text2);font-family:inherit;display:flex;align-items:center;gap:5px;}
.nav-group-btn:hover{background:#fff;}
.nav-group-btn.active{background:#fff;color:var(--text);font-weight:500;border:0.5px solid var(--border);}
.nav-group-btn .caret{font-size:8px;opacity:.6;}
.nav-dropdown{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 20px rgba(0,0,0,0.12);padding:4px;min-width:190px;z-index:400;display:none;}
.nav-dropdown.open{display:block;}
.nav-item{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit;white-space:nowrap;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--blue-bg);color:var(--blue-text);font-weight:500;}
.nav-sep{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 4px;border-top:0.5px solid var(--border);margin-top:4px;}
.nav-dot{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:#dc2626;color:#fff;font-size:9px;font-weight:700;}

/* ===== SCHERMI PICCOLI ===== */
@media (max-width:860px){
  .app{padding:.6rem;}
  /* la legenda va sotto la griglia, non di fianco */
  .main-with-sidebar{flex-direction:column;}
  .main-content{width:100%;overflow:visible;}
  .leg-sidebar{width:100%;order:2;}
  #leg-sidebar-turni,#leg-sidebar-giorno{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;}
  #leg-sidebar-turni>div:first-child,#leg-sidebar-giorno>div:first-child{grid-column:1/-1;}
  .leg-sidebar-item{border-bottom:none;padding-bottom:0;margin-bottom:0;}

  /* la tabella scorre dentro il suo riquadro: cosi' nomi e intestazioni restano fermi */
  .wrap{max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch;}
  .wrap thead th{position:sticky;top:0;z-index:3;}
  .wrap thead tr:first-child th{height:28px;}
  .wrap thead tr:nth-child(2) th{top:28px;}
  .wrap th.scol{left:0;z-index:6;}
  .wrap td.scol{z-index:2;}
  .scol{min-width:86px;padding:4px 6px;}
  td.shift-cell select{width:58px;}
  td.shift-cell-ro,td.rc-ro{font-size:11px;padding:4px 5px;}

  /* barra e menu piu' compatti */
  .topbar{gap:6px;padding:7px 9px;}
  .week-selector{max-width:145px;font-size:12px;}
  .nav-dropdown{min-width:170px;}
  .nav-group-btn{padding:6px 10px;}

  /* pannello di confronto a tutta larghezza */
  .compare-panel{width:100%;right:-100%;}
  .compare-panel.open{right:0;}

  /* calendari: celle piu' strette ma leggibili */
  .fab-grid-wrap{grid-template-columns:1fr;}
  .config-grid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}
  .pref-roles-grid{grid-template-columns:1fr;}
}
@media (max-width:430px){
  .scol{min-width:74px;font-size:11px;}
  .wrap thead th{font-size:10px;padding:4px 5px;}
  td.shift-cell select{width:52px;font-size:10px;}
  .role-badge{font-size:10px;padding:2px 8px;}
  .leg-sidebar{padding:8px;}
}
</style>
</head><body>
<!-- Compare panel overlay -->
<div class="compare-overlay" id="compare-overlay" onclick="closeCompare()"></div>
<!-- Compare panel -->
<div class="compare-panel" id="compare-panel">
  <div class="compare-header">
    <h3>👁 Confronto settimana</h3>
    <select id="compare-week-sel" onchange="loadCompare()" style="font-size:12px;padding:4px 8px;border-radius:var(--radius);border:0.5px solid var(--blue-border);background:#fff;font-family:inherit;max-width:200px;"></select>
    <button onclick="closeCompare()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--blue-text);padding:0 4px;">×</button>
  </div>
  <div class="compare-body" id="compare-body">
    <p style="color:var(--text3);font-size:12px;">Seleziona una settimana per confrontare.</p>
  </div>
</div>
<div id="loading-screen"><div class="spinner"></div><p style="font-size:14px;color:#555;">Connessione al database...</p></div>
<div class="app" id="app" style="display:none;"></div>
<script>
// ============================================================
// INTERRUTTORE: modulo ferie visibile agli operatori
// false = gli operatori non vedono la voce "Le mie ferie"
// true  = la vedono e possono inviare richieste
// I manager vedono la scheda Ferie in ogni caso.
// ============================================================
const FERIE_OPERATORI = false;

const SUPABASE_URL='https://nesezvoaammltxdkfvda.supabase.co';
const SUPABASE_KEY='sb_publishable_9qJpOrCPymeRQuwrxtgFCA_aTwUsiKy';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const DAY_NAMES=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
// ===== REPARTI =====
// Fasce e postazioni non sono piu' globali: ogni reparto ha le proprie.
// ATTENZIONE: gli id delle fasce devono essere 0,1,2... nell'ordine
// dell'array, perche' altrove si indicizza ALL_FASCE per id.
const REPARTI={
  sala:{
    id:'sala',
    label:'Sala & Bar',
    roles:['DEHOOR','PASS BEV FUORI','RECEPTION','BAR FUORI','PASS FOOD','GROTTA','BAR DENTRO','PASS BEV DENTRO','SPOSE','G.ALTA SX','G.ALTA DX'],
    fasce:[
      {id:0,label:'MATTINA',orario:'10:30/12:00',tipo:'pranzo'},
      {id:1,label:'PRANZO',orario:'12:00/15:30',tipo:'pranzo'},
      {id:2,label:'DOPO PRANZO',orario:'15:30/16:30',tipo:'pranzo'},
      {id:3,label:'APERITIVO',orario:'16:30/19:00',tipo:'cena'},
      {id:4,label:'CENA',orario:'19:00/00:30',tipo:'cena'},
      {id:5,label:'DOPO CENA',orario:'00:30/C',tipo:'cena'},
    ]
  },
  cucina:{
    id:'cucina',
    label:'Cucina & Pizzeria',
    roles:['TAPAS / DESSERT','PRIMI','SECONDI','IMPIATTAMENTO','PASS','PIZZERIA','PLONGE','SCARICHI'],
    // In cucina i codici turno hanno sfondo chiaro e scritta nera
    textColor:'#111',
    // Il colore non dipende dal codice ma dalla FORMA del turno:
    // due blocchi = spezzato, solo il primo = mattina, solo il
    // secondo = sera. Un colore scritto sul singolo turno vince
    // comunque su questa regola.
    colorByShape:{doppio:'#fcd34d',mattina:'#86efac',sera:'#93c5fd'},
    shapeLabels:{doppio:'Spezzato',mattina:'Mattina',sera:'Sera'},
    // ATTENZIONE: "tipo" non indica l'ora, indica in quali giornate
    // la fascia compare. Le fasce 'pranzo' spariscono nei giorni di
    // sola cena; quelle 'cena' compaiono sempre.
    // Scarichi e Pomeriggio sono marcati 'cena' proprio per questo:

function repDef(r){return REPARTI[r||REP]||REPARTI[REP_DEFAULT];}
// Le fasce si cercano SEMPRE per id, mai per posizione nell'array.
// Cosi' aggiungere o togliere una fascia non rinumera le altre e non
// richiede di rimappare i turni gia' salvati nel database.
function fascia(id){return ALL_FASCE.find(f=>f.id===id)||null;}
// doppio = ha entrambi i blocchi orari; mattina = solo il primo;
// sera = solo il secondo. OFF e FERIE non hanno orari: null.
function shiftShape(sh){
  if(!sh)return null;
  const primo=!!(sh.s1&&sh.e1), secondo=!!(sh.s2&&sh.e2);
  if(primo&&secondo)return'doppio';
  if(primo)return'mattina';
  if(secondo)return'sera';
  return null;
}
function repLabel(r){return repDef(r).label;}
function repOf(x){return (x&&x.reparto)?x.reparto:REP_DEFAULT;}
// Le config di sala restano sulle chiavi storiche: nessuna migrazione
// dei dati esistenti. Gli altri reparti usano una chiave suffissata.
function configKey(base,r){const rr=r||REP;return rr===REP_DEFAULT?base:base+'__'+rr;}

// Colore del testo di un codice turno. Ordine di priorita':
// 1) textColor scritto sul turno, 2) textColor del reparto,
// 3) bianco sui fondi scuri predefiniti della sala.
function shiftTextColor(code){
  const u=(code||'').toUpperCase();
  if(u==='OFF'||u==='FERIE'||u==='MALATTIA')return'#fff';
  const sh=getShift(code);
  if(sh&&sh.textColor)return sh.textColor;
  const def=repDef();
  if(def.textColor)return def.textColor;
  if(sh&&sh.color)return'#fff';
  const l=u[0];
  if(l==='B'||l==='D'||l==='M'||l==='A'||l==='E')return'#fff';
  return'var(--text)';
}
function shiftColorStyle(code){
  if(!code)return'';
  const u=code.toUpperCase();
  if(u==='OFF'||u==='FERIE'||u==='MALATTIA')return'background:#111;color:#fff;';
  const txt=shiftTextColor(code);
  // 1) colore scritto sul turno, 2) colore per forma del reparto,
  // 3) colore dedotto dalla lettera iniziale
  const sh=getShift(code);
  if(sh&&sh.color)return'background:'+sh.color+';color:'+txt+';';
  const byShape=repDef().colorByShape;
  if(sh&&byShape){
    const forma=shiftShape(sh);
    if(forma&&byShape[forma])return'background:'+byShape[forma]+';color:'+txt+';';
  }
  const l=u[0];
  if(l==='B')return'background:#1a56db;color:'+txt+';';
  if(l==='D')return'background:#e65100;color:'+txt+';';
  if(l==='M')return'background:#6b7280;color:'+txt+';';
  if(l==='A')return'background:#c026d3;color:'+txt+';';
  if(l==='E')return'background:#dc2626;color:'+txt+';';
  return'background:var(--bg3);color:'+txt+';';
}

function applyReparto(r){
  if(r)REP=r;
  const def=repDef();
  ROLES=def.roles;
  ALL_FASCE=def.fasce;
  IDX_PC=def.fasce.map(f=>f.id);

  G.staff=G.allStaff.filter(s=>repOf(s)===REP&&s.attivo!==false);
  G.shifts=G.allShifts.filter(s=>repOf(s)===REP);
  if(!G.shifts.length&&REP==='cucina'){
    // Set iniziale in memoria: diventa definitivo solo quando salvi
    G.shifts=JSON.parse(JSON.stringify(DEF_SHIFTS_CUCINA));
  }
  const raw=b=>{const k=configKey(b);const row=G.rawConfig.find(x=>x.key===k);return row?row.value:null;};
  const asJson=(b,fb)=>{const v=raw(b);if(!v)return fb;try{return JSON.parse(v);}catch(e){return fb;}};
  G.fabbisogno=asJson('fabbisogno',{});
  G.equivalenze=asJson('equivalenze',[]);
  G.regole=asJson('regole',[]);

}

// Restituisce l'id dipendente da una chiave di shift_assign (pid, pid_P, pid_C)
function pidFromKey(k){return String(k).replace(/_(P|C)$/,'');}

// Campi della settimana che valgono per tutto il locale. Su questi vince
// SEMPRE il valore del server, tranne per la funzione che lo sta
// cambiando di proposito (che lo dichiara in opts.changes). Serve perche'
// ogni salvataggio riscrive l'intera riga: senza questo, un manager con
// una copia vecchia in memoria riporterebbe indietro il nome, la
// pubblicazione o i giorni di apertura cambiati da qualcun altro.
// "published" NON e' qui: la pubblicazione e' per reparto e viene unita
// come le assegnazioni. L'apertura invece resta condivisa di proposito:
// se il locale e' aperto lo e' per tutti i reparti.
const WEEK_SHARED_FIELDS=['name','startDate','day_config'];

// Tiene le assegnazioni del mio reparto dalla copia locale e quelle
// degli altri reparti dalla versione del server.
function mergeShiftAssign(local,server,mine){
  const L=local||{},S=server||{},out={};
  Object.keys(L).forEach(di=>Object.keys(L[di]||{}).forEach(k=>{
    if(mine.has(pidFromKey(k)))(out[di]=out[di]||{})[k]=L[di][k];
  }));
  Object.keys(S).forEach(di=>Object.keys(S[di]||{}).forEach(k=>{
    if(!mine.has(pidFromKey(k)))(out[di]=out[di]||{})[k]=S[di][k];
  }));
  return out;
}
function mergeRoleAssign(local,server,mine){
  const L=local||{},S=server||{},out={};
  Object.keys(L).forEach(k=>{const p=k.split('_');if(p.length!==3||mine.has(p[2]))out[k]=L[k];});
  Object.keys(S).forEach(k=>{const p=k.split('_');if(p.length===3&&!mine.has(p[2]))out[k]=S[k];});
  return out;
}

    // e' mio, cosi' il salvataggio di un reparto non tocca l'altro.
    const {data:serverData}=await sb.from('weeks')
      .select('last_saved,shift_assign,role_assign,draft_assign,draft_role_assign,name,published,published_rep,startDate,day_config')
      .eq('id',w.id).single();
    if(serverData){
      const mine=new Set(G.allStaff.filter(s=>repOf(s)===REP).map(s=>s.id));
      w.shift_assign=mergeShiftAssign(w.shift_assign,serverData.shift_assign,mine);
      w.role_assign=mergeRoleAssign(w.role_assign,serverData.role_assign,mine);
      // Anche le bozze sono condivise e vanno unite allo stesso modo
      if(w.draft_assign||serverData.draft_assign){
        w.draft_assign=mergeShiftAssign(w.draft_assign,serverData.draft_assign,mine);
        w.draft_role_assign=mergeRoleAssign(w.draft_role_assign,serverData.draft_role_assign,mine);
      }
      // Pubblicazione: tengo la mia, dal server prendo quella degli altri
      const srvPub=(serverData.published_rep&&typeof serverData.published_rep==='object')?serverData.published_rep:{};
      const myPub=(w.published_rep&&typeof w.published_rep==='object')?w.published_rep:{};
      const merged=Object.assign({},srvPub);
      if(Object.prototype.hasOwnProperty.call(myPub,REP))merged[REP]=!!myPub[REP];
      if(!Object.prototype.hasOwnProperty.call(merged,REP_DEFAULT)){
        merged[REP_DEFAULT]=(REP===REP_DEFAULT)?!!w.published:!!serverData.published;
      }
      w.published_rep=merged;
      w.published=!!merged[REP_DEFAULT];
      // Metadati condivisi: vince il server, salvo dichiarazione esplicita
      WEEK_SHARED_FIELDS.forEach(f=>{
        if(changes.indexOf(f)===-1&&serverData[f]!==undefined&&serverData[f]!==null)w[f]=serverData[f];
      });
    }
    if(serverData&&serverData.last_saved&&w.last_saved){
      const serverTime=new Date(serverData.last_saved).getTime();
      const localTime=new Date(w.last_saved).getTime();
      if(serverTime>localTime+5000){// server is more than 5 seconds newer
        const serverTimeStr=new Date(serverData.last_saved).toLocaleString('it-IT');
        const ok=confirm(`⚠️ Attenzione: qualcun altro ha salvato questa settimana alle ${serverTimeStr}.\n\nLe assegnazioni degli altri reparti sono gia' state preservate.\nSe continui sovrascriverai eventuali modifiche fatte su ${repLabel()}.\n\nVuoi sovrascrivere?`);
        if(!ok){setSyncStatus('err');return;}
      }
    }
    const data=weekToDb(w);
    const ts=data.last_saved;
    const roleCount=Object.keys(data.role_assign||{}).filter(k=>data.role_assign[k]).length;
    const shiftDays=Object.keys(data.shift_assign||{}).length;
    console.log('Saving week:', w.id, '| giorni turni:', shiftDays, '| ruoli:', roleCount, '| by:', data.last_saved_by);
    const {error}=await sb.from('weeks').upsert(data);
    if(error){
      console.error('dbSaveWeek error:',error);
      setSyncStatus('err');
    } else {
      console.log('Week saved OK — turni:', shiftDays, 'ruoli:', roleCount);
      w.last_saved=ts;
      setSyncStatus('ok');
    }
  }catch(e){console.error('dbSaveWeek exception:',e);setSyncStatus('err');}
}
async function dbSaveShifts(){
  try{
    // La cancellazione e' SEMPRE ristretta al reparto corrente: senza
    // .eq('reparto',REP) salvare la cucina cancellerebbe i turni di sala.
    const rows=G.shifts.map((s,i)=>({...s,reparto:REP,sort_order:i}));
    if(rows.length){
      await sb.from('shifts').upsert(rows,{onConflict:'reparto,code'});
      const codes=rows.map(s=>s.code);
      await sb.from('shifts').delete().eq('reparto',REP).not('code','in',`(${codes.map(c=>`"${c}"`).join(',')})`);
    } else {
      await sb.from('shifts').delete().eq('reparto',REP);
    }
    G.shifts=rows;
    G.allShifts=G.allShifts.filter(s=>repOf(s)!==REP).concat(rows);
    setSyncStatus('ok');
  }catch(e){console.error('dbSaveShifts error:',e);setSyncStatus('err');}
}
async function dbSaveStaff(){
  try{
    // NEVER delete staff — use attivo:false to preserve history
    const rows=G.staff.map((s,i)=>({id:s.id,name:s.name,role:s.role,reparto:REP,canDo:s.canDo||[],offRequests:s.offRequests||[],workDaysPerWeek:s.workDaysPerWeek||5,accessCode:s.accessCode||'',preferredRoles:s.preferredRoles||{},secondaryRoles:s.secondaryRoles||{},sort_order:i,attivo:true}));
    if(rows.length)await sb.from('staff').upsert(rows,{onConflict:'id'});
    setSyncStatus('ok');
  }catch(e){console.error('dbSaveStaff error:',e);setSyncStatus('err');}
}

async function dbSaveConfig(k,v){try{const val=typeof v==='string'?v:JSON.stringify(v);await sb.from('config').upsert({key:k,value:val});const row=G.rawConfig.find(x=>x.key===k);if(row)row.value=val;else G.rawConfig.push({key:k,value:val});setSyncStatus('ok');}catch(e){setSyncStatus('err');}}
function setSyncStatus(s){syncStatus=s;const el=document.getElementById('sync-status');if(el){el.textContent=s==='ok'?'● Sincronizzato':'● Errore';el.className='sync-status '+(s==='ok'?'ok':'err');}}
function emptyWeek(name){return{id:'w'+Date.now()+Math.random().toString(36).slice(2,6),name:name||'Nuova settimana',published:false,published_rep:{},day_config:['cena','cena','cena','cena','cena','cena','cena'],shift_assign:{},role_assign:{},selected_day:0};}
function curWeek(){return G.weeks.find(w=>w.id===G.currentWeekId)||G.weeks[0];}
function getShift(code){return G.shifts.find(s=>s.code===code)||null;}
function isFuoriServizio(code){if(!code)return true;const u=code.toUpperCase();if(u==='MALATTIA')return true;const s=getShift(code);return !s||s.is_off||s.is_ferie;}
function shiftInFascia(code,fid){if(isFuoriServizio(code))return false;const s=getShift(code);if(!s)return false;return s.fasce&&s.fasce.includes(fid);}
const isManager=()=>role==='manager'||role==='responsabile';
const isResponsabile=()=>role==='responsabile';
// La pubblicazione e' per reparto: sala puo' pubblicare i suoi turni
// anche se la cucina sta ancora lavorando, e viceversa.
// published_rep = {"sala":true,"cucina":false}
// Il vecchio campo booleano "published" resta come stato storico della
// sala, per le settimane create prima di questa modifica.
function isPublished(w,r){
  const rr=r||REP;
  const m=(w&&w.published_rep&&typeof w.published_rep==='object')?w.published_rep:null;
  if(m&&Object.prototype.hasOwnProperty.call(m,rr))return !!m[rr];
  return rr===REP_DEFAULT?!!(w&&w.published):false;
}
function setPublished(w,r,v){
  w.published_rep=Object.assign({},w.published_rep||{});
  w.published_rep[r]=!!v;
  if(r===REP_DEFAULT)w.published=!!v;
}
function pubSummary(w){
  return Object.keys(REPARTI).map(k=>REPARTI[k].label+': '+(isPublished(w,k)?'pubblicata':'bozza')).join(' — ');
}
function getVisibleWeeks(){return isManager()?G.weeks:G.weeks.filter(w=>isPublished(w));}
function getDepWeek(){const vw=getVisibleWeeks();return vw.find(w=>w.id===G.currentWeekId)||vw[0]||null;}
function staffName(id){const p=G.staff.find(s=>s.id===id);return p?p.name:id;}
function isWorking(assign,pid){const c=assign[pid]||'';return c&&!isFuoriServizio(c);}

function contaRichiestePendenti(){
  let n=0;
  (G.richieste||[]).forEach(r=>{
    if(r.stato!=='in_attesa')return;
    const s=G.allStaff.find(s=>s.id===r.staff_id);
    if(s&&repOf(s)===REP)n++;
  });
  (G.ferieRichieste||[]).forEach(r=>{
    if(r.stato!=='in_attesa')return;
    const s=G.allStaff.find(s=>s.id===r.staff_id);
    if(s&&repOf(s)===REP)n++;
  });
  return n;
}

    const tabs=[['turni','Turni'],['giornaliero','Giornaliero']];
    if(isExtraDip)tabs.push(['disponibilita','La mia disponibilità']);
    else{
      tabs.push(['richieste','Le mie richieste']);
      // La voce Ferie per gli operatori si accende da FERIE_OPERATORI, in cima al file
      if(FERIE_OPERATORI)tabs.push(['ferie','Le mie ferie']);
    }
    nav.innerHTML=tabs.map(([id,label])=>
      `<button class="nav-btn ${id===currentTab?'active':''}" onclick="goTab('${id}')">${label}</button>`).join('');
    return;
  }
  const gruppi=navGruppi();
  nav.innerHTML=gruppi.map(g=>{
    const contieneAttivo=g.items.some(it=>Array.isArray(it)&&it[0]===currentTab);
    const voci=g.items.map(it=>{
      if(!Array.isArray(it))return `<div class="nav-sep">${it.sep}</div>`;
      const [id,label]=it;
      return `<button class="nav-item ${id===currentTab?'active':''}" onclick="goTab('${id}')">${label}</button>`;
    }).join('');
    const dot=g.badge?`<span class="nav-dot">${g.badge}</span>`:'';
    return `<div class="nav-group">
      <button class="nav-group-btn ${contieneAttivo?'active':''}" onclick="toggleNavGroup(event,'${g.id}')">
        ${g.label}${dot}<span class="caret">&#9660;</span>
      </button>
      <div class="nav-dropdown" id="navdd-${g.id}">${voci}</div>
    </div>`;
  }).join('');
}

// ===== DATE HELPERS =====
const MONTHS_IT=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function mondayOfWeek(dateStr){
  // Parse date parts directly to avoid timezone shifting
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);// local time, no timezone shift
  const day=dt.getDay();
  const diff=(day===0)?-6:1-day;
  dt.setDate(dt.getDate()+diff);
  return dt;
}
function weekNameFromMonday(mon){
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const d1=mon.getDate();const d2=sun.getDate();
  const m1=MONTHS_IT[mon.getMonth()];const m2=MONTHS_IT[sun.getMonth()];
  const y=sun.getFullYear();
  if(mon.getMonth()===sun.getMonth())return`${d1}–${d2} ${m1} ${y}`;
  return`${d1} ${m1} – ${d2} ${m2} ${y}`;
}
function updateWeekNameFromDate(){
  const dateEl=document.getElementById('new-week-date');
  const nameEl=document.getElementById('new-week-name');
  if(!dateEl||!dateEl.value)return;
  const mon=mondayOfWeek(dateEl.value);
  nameEl.value=weekNameFromMonday(mon);
}
// Returns array of 7 date strings (Mon-Sun) for a week given its name/startDate stored in week
function getWeekDates(w){
  if(!w.startDate)return null;
  try{
    const parts=w.startDate.split('-');
    const y=parseInt(parts[0]),m=parseInt(parts[1])-1,d=parseInt(parts[2]);
    return Array.from({length:7},(_,i)=>new Date(y,m,d+i));
  }catch(e){return null;}
}

async function createWeek(dup){
  const dateEl=document.getElementById('new-week-date');
  const nameEl=document.getElementById('new-week-name');
  let startDate='';
  let name='';
  if(dateEl&&dateEl.value){
    const mon=mondayOfWeek(dateEl.value);
    // Format as YYYY-MM-DD in local time (avoid UTC shift)
    const y=mon.getFullYear();
    const m=String(mon.getMonth()+1).padStart(2,'0');
    const d=String(mon.getDate()).padStart(2,'0');
    startDate=`${y}-${m}-${d}`;
    name=nameEl&&nameEl.value.trim()?nameEl.value.trim():weekNameFromMonday(mon);
  } else {
    name=(nameEl&&nameEl.value.trim())||'Nuova settimana';
  }
  // Auto-version if name already exists
  const baseName=name;
  let ver=0;
  while(G.weeks.find(w=>w.name===name)){ver++;name=`${baseName} (${ver})`;}
  let w=emptyWeek(name);
  w.startDate=startDate;
  if(dup){const c=curWeek();w.day_config=JSON.parse(JSON.stringify(c.day_config));w.shift_assign=JSON.parse(JSON.stringify(c.shift_assign));w.role_assign=JSON.parse(JSON.stringify(c.role_assign));}
  G.weeks.push(w);G.currentWeekId=w.id;
  if(dateEl)dateEl.value='';
  if(nameEl)nameEl.value='';
  await sb.from('weeks').insert(weekToDb(w));await dbSaveConfig('currentWeekId',w.id);
  renderWeekSelector();renderWeekList();renderTurni();
}

async function copyTurniSu(srcId){
  // Let user pick a destination week (excluding the source)
  const src=G.weeks.find(w=>w.id===srcId);if(!src)return;
  const others=G.weeks.filter(w=>w.id!==srcId);
  if(!others.length){alert('Non ci sono altre settimane su cui copiare.');return;}
  const msg='Copia i turni '+REP+' di "'+src.name+'" su quale settimana?\n\n'+
    others.map((w,i)=>`${i+1}. ${w.name}`).join('\n')+'\n\nInserisci il numero:';
  const ans=prompt(msg);if(!ans)return;
  const idx=parseInt(ans)-1;
  if(isNaN(idx)||idx<0||idx>=others.length){alert('Numero non valido.');return;}
  const dest=others[idx];
  if(!confirm('Copiare i turni '+REP+' da "'+src.name+'" a "'+dest.name+'"?\nI turni '+REP+' esistenti in quella settimana verranno sovrascritti.'))return;

  // Copy only the keys belonging to this reparto's staff
  const myStaffIds=new Set(G.staff.map(s=>s.id));

  // Merge shift_assign: copy only my staff's keys
  const newShiftAssign=JSON.parse(JSON.stringify(dest.shift_assign||{}));
  Object.entries(src.shift_assign||{}).forEach(([di,assigns])=>{
    if(!newShiftAssign[di])newShiftAssign[di]={};
    Object.entries(assigns).forEach(([key,val])=>{
      // key is pid, pid_P or pid_C
      const pid=key.replace(/_P$/,'').replace(/_C$/,'');
      if(myStaffIds.has(pid))newShiftAssign[di][key]=val;
    });
  });
  // Also remove my staff's old keys that aren't in the source
  Object.keys(dest.shift_assign||{}).forEach(di=>{
    Object.keys(dest.shift_assign[di]||{}).forEach(key=>{
      const pid=key.replace(/_P$/,'').replace(/_C$/,'');
      if(myStaffIds.has(pid)&&!(src.shift_assign[di]&&src.shift_assign[di][key]!==undefined))
        delete newShiftAssign[di][key];
    });
  });

  // Merge role_assign: copy only my staff's keys
  const newRoleAssign=JSON.parse(JSON.stringify(dest.role_assign||{}));
  Object.entries(src.role_assign||{}).forEach(([key,val])=>{
    // key is dayIdx_fasciaId_staffId
    const parts=key.split('_');
    const pid=parts[parts.length-1];
    if(myStaffIds.has(pid))newRoleAssign[key]=val;
  });
  // Remove my staff's old role keys not in source
  Object.keys(dest.role_assign||{}).forEach(key=>{
    const parts=key.split('_');
    const pid=parts[parts.length-1];
    if(myStaffIds.has(pid)&&src.role_assign[key]===undefined)
      delete newRoleAssign[key];
  });

  dest.shift_assign=newShiftAssign;
  dest.role_assign=newRoleAssign;
  await dbSaveWeek(dest);
  alert('Turni '+REP+' copiati su "'+dest.name+'" con successo!');
  renderWeekList();
}
let weekListOrder=null;// manual order (array of ids), null = auto chronological
function getWeeksSorted(){
  if(weekListOrder&&weekListOrder.length){
    // Manual order: sort by weekListOrder, append any new weeks at end
    const ordered=[];
    weekListOrder.forEach(id=>{const w=G.weeks.find(w=>w.id===id);if(w)ordered.push(w);});
    G.weeks.forEach(w=>{if(!ordered.find(o=>o.id===w.id))ordered.push(w);});
    return ordered;
  }
  // Default: chronological descending by startDate, then by creation order
  return [...G.weeks].sort((a,b)=>{
    if(a.startDate&&b.startDate)return b.startDate.localeCompare(a.startDate);
    if(a.startDate)return -1;if(b.startDate)return 1;
    return 0;
  });
}
let weekDragSrc=null;
function weekDragStart(e,id){weekDragSrc=id;}
function weekDragOver(e){e.preventDefault();}
function weekDrop(e,id){
  e.preventDefault();if(!weekDragSrc||weekDragSrc===id)return;
  const sorted=getWeeksSorted();
  const fromIdx=sorted.findIndex(w=>w.id===weekDragSrc);
  const toIdx=sorted.findIndex(w=>w.id===id);
  if(fromIdx<0||toIdx<0)return;
  const moved=sorted.splice(fromIdx,1)[0];
  sorted.splice(toIdx,0,moved);
  weekListOrder=sorted.map(w=>w.id);
  weekDragSrc=null;
  renderWeekList();
}

}

// Trova la settimana che contiene una data (stringa YYYY-MM-DD)
function settimanaDelGiorno(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return G.weeks.find(w=>{
    if(!w.startDate)return false;
    const start=new Date(w.startDate+'T12:00:00');
    const end=new Date(start);end.setDate(end.getDate()+6);
    return d>=start&&d<=end;
  })||null;
}

function renderWeekCalendar(){
  const el=document.getElementById('week-calendar');if(!el)return;
  const oggi=new Date();
  if(window._wkCalMese===undefined)window._wkCalMese=oggi.getMonth();
  if(window._wkCalAnno===undefined)window._wkCalAnno=oggi.getFullYear();
  const mese=window._wkCalMese,anno=window._wkCalAnno;

  let html=`<div style="background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn" style="font-size:11px;padding:4px 10px;" onclick="cambiaMeseCal(-1)">&#8249;</button>
      <span style="font-size:13px;font-weight:500;flex:1;text-align:center;min-width:140px;">${MONTHS_IT[mese]} ${anno}</span>
      <button class="btn" style="font-size:11px;padding:4px 10px;" onclick="cambiaMeseCal(1)">&#8250;</button>
      <button class="btn" style="font-size:11px;padding:4px 10px;" onclick="window._wkCalMese=${oggi.getMonth()};window._wkCalAnno=${oggi.getFullYear()};renderWeekCalendar()">Oggi</button>
    </div>
    <p style="font-size:11px;color:var(--text2);margin-bottom:8px;">Clicca una settimana per aprirla. Le righe grigie non hanno ancora una settimana creata.</p>`;

  const giorniMese=new Date(anno,mese+1,0).getDate();
  // Raggruppa i giorni del mese per settimana (lunedi -> domenica)
  const righe=[];
  let cur=null;
  for(let g=1;g<=giorniMese;g++){
    const d=new Date(anno,mese,g);
    const dow=d.getDay()===0?6:d.getDay()-1;
    if(dow===0||cur===null){
      if(cur)righe.push(cur);
      cur={giorni:[null,null,null,null,null,null,null]};
    }
    cur.giorni[dow]={n:g,dateStr:dateToStr(d)};
  }
  if(cur)righe.push(cur);

  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">';
  ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].forEach(d=>{
    html+=`<div style="text-align:center;font-size:10px;font-weight:600;color:var(--text3);">${d}</div>`;
  });
  html+='</div>';

  const oggiStr=dateToStr(oggi);
  righe.forEach(r=>{
    const primo=r.giorni.find(x=>x);
    const wk=primo?settimanaDelGiorno(primo.dateStr):null;
    const attiva=wk&&wk.id===G.currentWeekId;
    const pubbl=wk&&isPublished(wk);
    let bg='var(--bg3)',border='var(--border)';
    if(attiva){bg='var(--blue-bg)';border='var(--blue-border)';}
    else if(pubbl){bg='var(--green-bg)';border='var(--green-border)';}
    else if(wk){bg='#fff';border='var(--border2)';}
    const azione=wk?`onclick="switchWeek('${wk.id}');goTab('turni')"`:'';
    const etichetta=wk?(wk.name+(attiva?' • attiva':pubbl?' • pubblicata':' • bozza')):'nessuna settimana';
    html+=`<div ${azione} style="display:flex;align-items:center;gap:8px;border:0.5px solid ${border};background:${bg};border-radius:6px;padding:5px 8px;margin-bottom:4px;cursor:${wk?'pointer':'default'};">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1;">
        ${r.giorni.map(x=>x?`<div style="text-align:center;font-size:11px;font-weight:${x.dateStr===oggiStr?'700':'400'};color:${x.dateStr===oggiStr?'var(--blue-text)':'var(--text)'};">${x.n}</div>`:'<div></div>').join('')}
      </div>
      <span style="font-size:10px;color:var(--text2);white-space:nowrap;min-width:130px;text-align:right;">${etichetta}</span>
    </div>`;
  });

  html+='</div>';
  el.innerHTML=html;
}

function cambiaMeseCal(delta){
  let m=window._wkCalMese+delta,a=window._wkCalAnno;
  if(m<0){m=11;a--;}else if(m>11){m=0;a++;}
  window._wkCalMese=m;window._wkCalAnno=a;
  renderWeekCalendar();
}

// ===== UNDO =====
let undoStack=[];
function pushUndo(wk){
  undoStack.push({wkId:wk.id,shift_assign:JSON.parse(JSON.stringify(wk.shift_assign)),role_assign:JSON.parse(JSON.stringify(wk.role_assign))});
  if(undoStack.length>20)undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){alert('Nessuna modifica da annullare.');return;}
  const wk=curWeek();
  const snap=undoStack[undoStack.length-1];
  if(snap.wkId!==wk.id){alert('Nessuna modifica disponibile per questa settimana.');undoStack=[];return;}
  undoStack.pop();
  wk.shift_assign=snap.shift_assign;
  wk.role_assign=snap.role_assign;
  markDirty();renderTurni();renderDayContent();
}

async function clearWeek(){
  if(!confirm('Svuotare tutti i turni e i ruoli della settimana attiva? Questa azione non può essere annullata.'))return;
  const wk=curWeek();
  wk.shift_assign={};
  wk.role_assign={};
  await dbSaveWeek(wk);
  const alertEl=document.getElementById('draft-alerts');
  if(alertEl)alertEl.innerHTML='';
  renderTurni();renderDayContent();
}

// Helper: get shift code considering P+C split
// servizio: 'pranzo'|'cena'|null
function getShiftCode(wk,di,pid,servizio){
  const d=wk.shift_assign[di]||{};
  if(servizio==='pranzo') return d[pid+'_P']||'';
  if(servizio==='cena') return d[pid+'_C']||'';
  return d[pid]||'';
}

// Returns true if person is working in a given fascia
function personInFascia(wk,di,pid,fasciaObj,tipo){
  if(tipo==='pranzo_cena'){
    const cp=getShiftCode(wk,di,pid,'pranzo');
    const cc=getShiftCode(wk,di,pid,'cena');
    if(fasciaObj.tipo==='pranzo') return shiftInFascia(cp,fasciaObj.id)||shiftInFascia(cc,fasciaObj.id);
    if(fasciaObj.tipo==='cena') return shiftInFascia(cc,fasciaObj.id)||shiftInFascia(cp,fasciaObj.id);
    return false;
  } else {
    return shiftInFascia(getShiftCode(wk,di,pid,null),fasciaObj.id);
  }
}

// ===== TURNI =====
function renderTurni(){
  const wk=isManager()?curWeek():getDepWeek();
  const wrap=document.getElementById('turni-wrap');
  if(!wk){wrap.innerHTML='<p style="color:var(--text2);padding:1rem;">Nessuna settimana disponibile.</p>';return;}
  if(!isManager()){const el=document.getElementById('dep-week-label');if(el)el.textContent=wk.name;}
  const days=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  const weekDates=getWeekDates(wk);
  // Build columns
  let cols=[];
  days.forEach(d=>{
    const dateStr=weekDates?weekDates[d.idx].getDate():'';
    const label=dateStr?`${d.name} ${dateStr}`:d.name;
    if(d.tipo==='pranzo_cena'){
      cols.push({...d,label,servizio:'pranzo',colLabel:'Pranzo'});
      cols.push({...d,label,servizio:'cena',colLabel:'Cena'});
    } else {
      cols.push({...d,label,servizio:null,colLabel:null});
    }
  });
  let h='<table><thead>';
  // Row 1: day names (spanning 2 for P+C)
  h+='<tr><th class="scol">Operatore</th>';
  let lastDi=-1;
  cols.forEach(c=>{
    if(c.idx===lastDi)return;lastDi=c.idx;
    const span=c.tipo==='pranzo_cena'?2:1;
    const bg=c.tipo==='pranzo_cena'?'#fff8dd':'var(--bg3)';
    const col=c.tipo==='pranzo_cena'?'#7a5c00':'var(--text)';
    h+=`<th colspan="${span}" style="background:${bg};color:${col};padding:5px 8px;font-size:11px;white-space:nowrap;">${c.label}</th>`;
  });
  h+='</tr>';
  // Row 2: Pranzo/Cena sub-headers
  h+='<tr><th class="scol"></th>';
  cols.forEach(c=>{
    if(c.tipo==='pranzo_cena'){
      const bg=c.servizio==='pranzo'?'#fff8dd':'#ddeeff';
      const col=c.servizio==='pranzo'?'#7a5c00':'#0a3d6e';
      h+=`<th style="background:${bg};color:${col};font-size:10px;font-weight:500;padding:3px 6px;">${c.colLabel}</th>`;
    } else {
      h+='<th style="background:var(--bg3);padding:3px 6px;"></th>';
    }
  });
  h+='</tr></thead><tbody>';
  // Use allStaff (includes inactive) to show historical shifts correctly
  const staffPerTurni=G.allStaff.filter(s=>repOf(s)===REP);
  staffPerTurni.forEach(p=>{
    // Check if this person has any shift in this week — if inactive and no shifts, skip
    const hasShift=!cols.every(c=>!getShiftCode(wk,c.idx,p.id,c.servizio));
    const isInactive=p.attivo===false;
    if(isInactive&&!hasShift)return;// hide inactive with no shifts
    const extra=isExtra(p);
    h+=`<tr${isInactive?' style="opacity:0.6;"':''}><td class="scol">${p.name}${isInactive?'<span style="font-size:9px;color:var(--text3);margin-left:4px;">(archiviato)</span>':''}${isManager()&&p.role?`<br><span style="font-size:10px;font-weight:400;color:var(--text2);">${p.role}</span>`:''}${isManager()&&!extra&&!isInactive?` <br><span style="font-size:10px;color:var(--text3);">${p.workDaysPerWeek||5}gg/sett</span>`:''}</td>`;
    cols.forEach(c=>{
      const val=getShiftCode(wk,c.idx,p.id,c.servizio);
      const cs=val?shiftColorStyle(val):'';
      const hasOffReq=!extra&&c.servizio!=='cena'&&(p.offRequests||[]).includes(c.idx);
      const sKey=c.servizio==='pranzo'?`${c.idx},'${p.id}','pranzo'`:c.servizio==='cena'?`${c.idx},'${p.id}','cena'`:`${c.idx},'${p.id}',null`;
      if(isManager()){
        // Green for extra availability
        const wkDates=getWeekDates(wk);
        const dStr=wkDates?dateToStr(wkDates[c.idx]):null;
        const fIds=c.servizio==='pranzo'?ALL_FASCE.filter(f=>f.tipo==='pranzo').map(f=>f.id):c.servizio==='cena'?ALL_FASCE.filter(f=>f.tipo==='cena').map(f=>f.id):ALL_FASCE.map(f=>f.id);
        const disp=dStr&&extra?G.disponibilita[p.id+'_'+dStr]:null;
        const isAvail=!val&&disp&&(!disp.fasce||!disp.fasce.length||fIds.some(fid=>disp.fasce.includes(fid)));
        // Check for pending richiesta turno
        const richPending=dStr&&!extra?G.richieste.find(r=>r.staff_id===p.id&&r.data===dStr&&r.stato==='in_attesa'):null;
        const cellBg=isAvail?'background:#dcfce7;':(!val&&hasOffReq?'background:#fff8dd;':'');
        const cellBorder=richPending?'outline:2px solid #f5d76e;outline-offset:-2px;':'';
        const cellTitle=isAvail?'Disponibile':richPending?'Richiesta: '+richPending.turno_richiesto:hasOffReq?'Richiesta giorno libero':'';
        h+=`<td class="shift-cell" style="${cs}${cellBg}${cellBorder}" title="${cellTitle}">
          <select onchange="setShift(${sKey},this.value)" style="width:66px;font-size:11px;padding:2px 3px;border:none;background:transparent;color:${val?shiftTextColor(val):'var(--text)'};font-family:inherit;font-weight:${val?'600':'400'};">
            <option value="" style="background:#fff;color:#1a1a1a;"></option>
            ${G.shifts.map(sh=>`<option value="${sh.code}" style="background:#fff;color:#1a1a1a;"${sh.code===val?' selected':''}>${sh.code}</option>`).join('')}
          </select></td>`;
      } else {
        h+=`<td class="shift-cell-ro" style="${cs}">${val}</td>`;
      }
    });
    h+='</tr>';
  });
  if(isManager()){
    if(REP==='cucina'){
      // Three separate count rows for cucina/pizzeria/plonge
      const groups=[
        {label:'N. cucina', prefix:'C'},
        {label:'N. pizzeria', prefix:'P'},
        {label:'N. plonge', prefix:'L'},
      ];
      groups.forEach(g=>{
        h+=`<tr class="count-row"><td class="scol" style="background:var(--bg3);">${g.label}</td>`;
        cols.forEach(c=>{
          const n=G.staff.filter(p=>{
            const code=getShiftCode(wk,c.idx,p.id,c.servizio);
            return code&&!isFuoriServizio(code)&&code.toUpperCase().startsWith(g.prefix);
          }).length;
          h+=`<td>${n||''}</td>`;
        });
        h+='</tr>';
      });
    } else {
      h+='<tr class="count-row"><td class="scol" style="background:var(--bg3);">N. operatori</td>';
      cols.forEach(c=>{
        const n=G.staff.filter(p=>{const code=getShiftCode(wk,c.idx,p.id,c.servizio);return code&&!isFuoriServizio(code);}).length;
        h+=`<td>${n||''}</td>`;
      });
      h+='</tr>';
    }
  }
  h+='</tbody></table>';
  wrap.innerHTML=h;
}
let shiftTimer=null;
function setShift(di,pid,servizio,val){
  const wk=curWeek();pushUndo(wk);
  if(!wk.shift_assign[di])wk.shift_assign[di]={};
  const key=servizio==='pranzo'?pid+'_P':servizio==='cena'?pid+'_C':pid;
  wk.shift_assign[di][key]=val;
  if(wk.role_assign){
    Object.keys(wk.role_assign).forEach(k=>{
      const parts=k.split('_');
      if(parts.length===3&&parts[0]==String(di)&&parts[2]===pid) delete wk.role_assign[k];
    });
  }
  markDirty();
  renderTurni();
}

// ===== GIORNALIERO =====
function renderDayNav(){
  const wk=isManager()?curWeek():getDepWeek();
  if(!wk){document.getElementById('day-nav').innerHTML='';document.getElementById('day-content').innerHTML='<p style="color:var(--text2);padding:1rem;">Nessuna settimana disponibile.</p>';return;}
  const days=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  if(!days.find(d=>d.idx===wk.selected_day))wk.selected_day=days[0]?.idx||0;
  document.getElementById('day-nav').innerHTML=days.map(d=>`
    <button class="day-btn ${d.tipo==='pranzo_cena'?'pc':''} ${d.idx===wk.selected_day?'active':''}" onclick="selDay(${d.idx})">${d.name}</button>`).join('');
  renderDayContent();
}
async function selDay(i){const wk=isManager()?curWeek():getDepWeek();if(!wk)return;wk.selected_day=i;renderDayNav();}

function renderDayContent(){
  const wk=isManager()?curWeek():getDepWeek();if(!wk)return;
  const di=wk.selected_day;const tipo=wk.day_config[di];
  const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
  const fasce=fasciaIdxs.map(i=>fascia(i)).filter(Boolean);
  function fHead(f){const cls=f.tipo==='pranzo'?'fp':'fc';return`<th class="${cls}">${f.label}<br><span style="font-size:10px;font-weight:400;">${f.orario}</span></th>`;}
  let h=`<p style="font-size:14px;font-weight:500;margin-bottom:.75rem;">${DAY_NAMES[di]}</p>`;
  h+='<div class="wrap"><table><thead><tr><th class="scol"></th>';
  fasce.forEach(f=>{h+=fHead(f);});
  if(tipo==='pranzo_cena'){
    h+='<th style="background:#fff8dd;color:#7a5c00;font-size:11px;padding:5px 8px;min-width:60px;">PRANZO</th>';
    h+='<th style="background:#ddeeff;color:#0a3d6e;font-size:11px;padding:5px 8px;min-width:60px;">CENA</th>';
  } else {
    h+='<th style="background:var(--bg3);font-size:11px;padding:5px 8px;min-width:60px;">TURNO</th>';
  }
  h+='<th style="background:var(--bg3);font-size:11px;padding:5px 8px;min-width:110px;">ORARI</th>';
  h+='</tr></thead><tbody>';
  const staffPerGiorno=G.allStaff.filter(s=>repOf(s)===REP);
  staffPerGiorno.forEach(p=>{
    const cp=tipo==='pranzo_cena'?getShiftCode(wk,di,p.id,'pranzo'):'';
    const cc=tipo==='pranzo_cena'?getShiftCode(wk,di,p.id,'cena'):getShiftCode(wk,di,p.id,null);
    // Skip inactive staff with no shifts today
    const isInactive=p.attivo===false;
    const hasShiftToday=cp||cc;
    if(isInactive&&!hasShiftToday)return;
    h+=`<tr${isInactive?' style="opacity:0.6;"':''}><td class="scol" style="font-size:12px;">${p.name}${isInactive?'<span style="font-size:9px;color:var(--text3);margin-left:4px;">(arch.)</span>':''}${isManager()&&isExtra(p)?'<span class="extra-badge">Extra</span>':''}</td>`;
    fasce.forEach(f=>{
      const working=personInFascia(wk,di,p.id,f,tipo);
      if(!working){h+=`<td class="xc">X</td>`;}
      else{
        const key=`${di}_${f.id}_${p.id}`;const val=(wk.role_assign[key])||'';
        if(isManager()){h+=`<td class="rc"><select onchange="setRole('${key}',this.value)"><option value=""></option>${ROLES.map(r=>`<option value="${r}"${r===val?' selected':''}>${r}</option>`).join('')}</select></td>`;}
        else{h+=`<td class="rc-ro">${val}</td>`;}
      }
    });
    if(tipo==='pranzo_cena'){
      h+=`<td style="padding:4px 8px;font-size:11px;font-weight:600;${cp?shiftColorStyle(cp):''}">${cp}</td>`;
      h+=`<td style="padding:4px 8px;font-size:11px;font-weight:600;${cc?shiftColorStyle(cc):''}">${cc}</td>`;
      const pts=[];
      const sp=getShift(cp);const sc=getShift(cc);
      if(sp&&!sp.is_off&&!sp.is_ferie){if(sp.s1&&sp.e1)pts.push(`${sp.s1}-${sp.e1}`);}
      if(sc&&!sc.is_off&&!sc.is_ferie){if(sc.s2&&sc.e2)pts.push(`${sc.s2}-${sc.e2}`);}
      h+=`<td style="padding:4px 8px;font-size:11px;color:var(--text2);">${pts.join(' / ')}</td>`;
    } else {
      const s=getShift(cc);
      let oLabel='';if(s&&!s.is_off&&!s.is_ferie){const pts=[];if(s.s1&&s.e1)pts.push(`${s.s1}-${s.e1}`);if(s.s2&&s.e2)pts.push(`${s.s2}-${s.e2}`);oLabel=pts.join(' / ');}
      h+=`<td style="padding:4px 8px;font-size:11px;font-weight:600;${cc?shiftColorStyle(cc):''}">${cc}</td>`;
      h+=`<td style="padding:4px 8px;font-size:11px;color:var(--text2);">${oLabel}</td>`;
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<p class="sec-label" style="margin-top:1.25rem;">Riepilogo ruoli per fascia</p>';
  h+='<div class="wrap"><table><thead><tr><th class="scol" style="min-width:130px;background:var(--bg3);"></th>';
  fasce.forEach(f=>{h+=fHead(f);});
  h+='</tr></thead><tbody>';
  ROLES.forEach(r=>{
    h+=`<tr><td class="role-name-td">${r}</td>`;
    fasce.forEach(f=>{
      const names=G.staff.filter(p=>{
        const key=`${di}_${f.id}_${p.id}`;
        if((wk.role_assign[key])!==r)return false;
        return personInFascia(wk,di,p.id,f,tipo);
      }).map(p=>p.name);
      h+=`<td class="auto-td">${names.join(', ')}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('day-content').innerHTML=h;
  if(isManager())updateIncompleteAlert();
}
function setRole(key,val){
  const wk=curWeek();pushUndo(wk);
  wk.role_assign[key]=val;
  markDirty();
  renderDayContent();
}

async function addStaff(){
  const n=document.getElementById('sname').value.trim();if(!n)return;
  G.staff.push({id:'s'+Date.now(),name:n,role:document.getElementById('srole').value.trim(),reparto:REP,canDo:[],offRequests:[],workDaysPerWeek:5,accessCode:''});
  document.getElementById('sname').value='';document.getElementById('srole').value='';
  await dbSaveStaff();renderStaff();
}
async function removeStaff(id){
  if(!confirm('Rimuovere questo operatore dalla lista attiva?\nResterà visibile nell\'archivio storico dei turni.'))return;
  try{
    const disabledAt=new Date().toISOString();
    await sb.from('staff').update({attivo:false, disabled_at:disabledAt}).eq('id',id);
    // Remove from active list only — keep in allStaff for historical display
    G.staff=G.staff.filter(s=>s.id!==id);
    const inAll=G.allStaff.find(s=>s.id===id);
    if(inAll){inAll.attivo=false;inAll.disabled_at=disabledAt;}
    if(selectedStaffId===id)selectedStaffId=null;
    renderStaff();
    setSyncStatus('ok');
  }catch(e){console.error('removeStaff error:',e);setSyncStatus('err');}
}

function getFab(fabKey){if(!G.fabbisogno[fabKey])G.fabbisogno[fabKey]={slots:[],maxRiposi:0};return G.fabbisogno[fabKey];}
function renderFabbisogno(){
  const el=document.getElementById('fab-grid');if(!el)return;
  const wk=curWeek();
  const workShifts=G.shifts.filter(s=>!s.is_off&&!s.is_ferie);
  function renderCard(name,fabKey,servizio,dayIdx){
    const fab=G.fabbisogno[fabKey]||{slots:[],maxRiposi:0,roleReqs:{}};
    if(!fab.roleReqs)fab.roleReqs={};
    const slotsHtml=(fab.slots||[]).map((slot,si)=>{
      const tags=slot.codes.map(c=>`<span class="fab-shift-tag" style="${shiftColorStyle(c)}">${c}</span>`).join('<span style="font-size:10px;color:var(--text3);padding:0 2px;">o</span>');
      return`<div class="fab-slot"><div class="fab-slot-codes">${tags}</div><button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;margin-left:auto;" onclick="removeFabSlot('${fabKey}',${si})">×</button></div>`;
    }).join('');
    const border=servizio==='pranzo'?'border-top:2px solid #f5d76e;':servizio==='cena'?'border-top:2px solid #93b4f7;':'';
    const sub=servizio==='pranzo'?' <span style="font-size:10px;font-weight:400;color:#7a5c00;">Pranzo</span>':servizio==='cena'?' <span style="font-size:10px;font-weight:400;color:#0a3d6e;">Cena</span>':'';
    // Fasce to show role reqs for
    const tipo2=wk?wk.day_config[dayIdx]||'cena':'cena';
    const allFasceForCard=(tipo2==='pranzo_cena'?IDX_PC:IDX_CENA).map(i=>fascia(i)).filter(Boolean);
    const fasceForCard=allFasceForCard.filter(f=>{
      if(!servizio)return true;
      if(servizio==='pranzo')return f.tipo==='pranzo';
      return f.tipo==='cena';
    });
    // Role reqs section
    let roleReqsHtml='<div style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border);">';
    roleReqsHtml+=`<p style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px;">Ruoli richiesti per fascia</p>`;
    fasceForCard.forEach(f=>{
      const reqs=(fab.roleReqs[f.id])||{};
      roleReqsHtml+=`<div style="margin-bottom:8px;"><span style="font-size:10px;font-weight:600;color:var(--text2);display:block;margin-bottom:3px;">${f.label}</span>`;
      roleReqsHtml+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:3px;">`;
      ROLES.forEach(r=>{
        const val=reqs[r]||0;
        roleReqsHtml+=`<div style="display:flex;align-items:center;gap:3px;font-size:11px;">
          <input type="number" min="0" max="20" value="${val}" onchange="setRoleReq('${fabKey}',${f.id},'${r}',this.value)"
            style="width:34px;padding:2px 3px;border-radius:4px;border:0.5px solid var(--border2);font-family:inherit;font-size:11px;text-align:center;">
          <span style="color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;" title="${r}">${r}</span>
        </div>`;
      });
      roleReqsHtml+=`</div></div>`;
    });
    roleReqsHtml+='</div>';
    // Dup button
    const dupHtml=`<div style="margin-top:6px;">
      <button class="btn" style="font-size:11px;padding:3px 10px;" onclick="dupFabbisogno('${fabKey}')">📋 Duplica su...</button>
    </div>`;
    return`<div class="fab-card" style="${border}">
      <h4>${name}${sub}</h4>
      <div class="fab-slots">${slotsHtml||'<span style="font-size:11px;color:var(--text3);">Nessuno slot</span>'}</div>
      <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
        <select id="fab-sel-${fabKey}" style="font-size:11px;padding:3px 6px;border-radius:var(--radius);border:0.5px solid var(--border2);background:#fff;font-family:inherit;">
          ${workShifts.map(s=>`<option value="${s.code}">${s.code}</option>`).join('')}
        </select>
        <button class="btn primary" style="font-size:11px;padding:3px 8px;" onclick="addFabSlotSingle('${fabKey}')">+ Singolo</button>
        <button class="btn warn" style="font-size:11px;padding:3px 8px;" onclick="addFabSlotEquiv('${fabKey}')">+ Con equiv.</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <label style="font-size:11px;color:var(--text2);">Max riposi:</label>
        <input type="number" min="0" max="30" value="${fab.maxRiposi||0}" onchange="setFabRiposi('${fabKey}',this.value)"
          style="width:55px;padding:3px 6px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:11px;">
      </div>
      ${dupHtml}
      ${roleReqsHtml}
    </div>`;
  }
  let html='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:1rem;">';
  DAY_NAMES.forEach((name,i)=>{
    const tipo=wk?wk.day_config[i]||'cena':'cena';
    if(tipo==='chiuso')return;
    if(tipo==='pranzo_cena'){
      html+=renderCard(name,`${i}_pranzo`,'pranzo',i);
      html+=renderCard(name,`${i}_cena`,'cena',i);
    } else {
      html+=renderCard(name,String(i),null,i);
    }
  });
  html+='</div>';
  el.innerHTML=html;
}
function addFabSlotSingle(fabKey){const sel=document.getElementById(`fab-sel-${fabKey}`);if(!sel)return;getFab(fabKey).slots.push({codes:[sel.value]});renderFabbisogno();}
function addFabSlotEquiv(fabKey){const sel=document.getElementById(`fab-sel-${fabKey}`);if(!sel)return;getFab(fabKey).slots.push({codes:[...getEquivGroup(sel.value)]});renderFabbisogno();}
function removeFabSlot(fabKey,si){if(!G.fabbisogno[fabKey])return;G.fabbisogno[fabKey].slots.splice(si,1);renderFabbisogno();}
function setFabRiposi(fabKey,val){getFab(fabKey).maxRiposi=parseInt(val)||0;}
function setRoleReq(fabKey,fasciaId,roleName,val){
  const fab=getFab(fabKey);
  if(!fab.roleReqs)fab.roleReqs={};
  if(!fab.roleReqs[fasciaId])fab.roleReqs[fasciaId]={};
  const n=parseInt(val)||0;
  if(n>0)fab.roleReqs[fasciaId][roleName]=n;
  else delete fab.roleReqs[fasciaId][roleName];
}
function dupFabbisogno(srcKey){
  const wk=curWeek();if(!wk)return;
  const allTargets=[];
  DAY_NAMES.forEach((dn,i)=>{
    const t=wk.day_config[i]||'cena';
    if(t==='chiuso')return;
    if(t==='pranzo_cena'){
      allTargets.push({key:`${i}_pranzo`,label:`${dn} Pranzo`});
      allTargets.push({key:`${i}_cena`,label:`${dn} Cena`});
    } else {
      allTargets.push({key:String(i),label:dn});
    }
  });
  const targets=allTargets.filter(t=>t.key!==srcKey);
  const msg='Duplica su quale giorno?\n\n'+targets.map((t,i)=>`${i+1}. ${t.label}`).join('\n')+'\n\nInserisci il numero:';
  const ans=prompt(msg);
  if(!ans)return;
  const idx=parseInt(ans)-1;
  if(isNaN(idx)||idx<0||idx>=targets.length){alert('Numero non valido.');return;}
  const destKey=targets[idx].key;
  const src=G.fabbisogno[srcKey]||{slots:[],maxRiposi:0,roleReqs:{}};
  G.fabbisogno[destKey]=JSON.parse(JSON.stringify(src));
  renderFabbisogno();
  alert(`Copiato su "${targets[idx].label}"! Ricordati di salvare.`);
}
async function saveFabbisogno(){await dbSaveConfig(configKey('fabbisogno'),G.fabbisogno);alert('Fabbisogno salvato!');}

// ===== GENERA BOZZA =====
function generaBozza(){
  const wk=curWeek();
  const errors=[];const warnings=[];
  const eligibleStaff=G.staff.filter(p=>!isExtra(p));

  // Count past shift usage
  const shiftCount={};
  eligibleStaff.forEach(p=>{shiftCount[p.id]={};});
  G.weeks.filter(w=>w.id!==wk.id).forEach(w=>{
    DAY_NAMES.forEach((_,di)=>{
      const assigns=w.shift_assign[di]||{};
      eligibleStaff.forEach(p=>{
        ['_P','_C',''].forEach(suffix=>{
          const code=assigns[p.id+suffix]||'';
          if(code&&code!=='OFF'&&code!=='FERIE'){shiftCount[p.id][code]=(shiftCount[p.id][code]||0)+1;}
        });
      });
    });
  });

  const weekWorkDays={};const weekOffDays={};
  eligibleStaff.forEach(p=>{weekWorkDays[p.id]=0;weekOffDays[p.id]=0;});

  const openDays=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  const newAssign={};
  DAY_NAMES.forEach((_,di)=>{newAssign[di]={};});

  // Build list of "sessions" to process: each session has a fabKey, dayIdx, servizio
  const sessions=[];
  openDays.forEach(d=>{
    if(d.tipo==='pranzo_cena'){
      sessions.push({di:d.idx,fabKey:`${d.idx}_pranzo`,servizio:'pranzo',dayName:DAY_NAMES[d.idx]});
      sessions.push({di:d.idx,fabKey:`${d.idx}_cena`,servizio:'cena',dayName:DAY_NAMES[d.idx]});
    } else {
      sessions.push({di:d.idx,fabKey:String(d.idx),servizio:null,dayName:DAY_NAMES[d.idx]});
    }
  });

  // Sort sessions by difficulty
  function countAvail(fabKey,slots){
    if(!slots||!slots.length)return 999;
    return eligibleStaff.filter(p=>slots.some(slot=>slot.codes.some(c=>(p.canDo||[]).includes(c)))).length-slots.length;
  }
  sessions.sort((a,b)=>{
    const fa=G.fabbisogno[a.fabKey];const fb=G.fabbisogno[b.fabKey];
    return countAvail(a.fabKey,fa?fa.slots:[]) - countAvail(b.fabKey,fb?fb.slots:[]);
  });

  // Track per-day assignments
  const serviceAssigned={};openDays.forEach(d=>{serviceAssigned[d.idx]={};});
  const newRoleAssign={};// pre-assigned roles from roleReqs

  // Helper: get compatible shifts for a role
  function compatShiftsForRole(role){
    return G.shifts.filter(s=>!isFuoriServizio(s.code)&&(s.compatibleRoles||[]).includes(role)).map(s=>s.code);
  }

  // Returns true if a shift covers at least one fascia of the given servizio
  function shiftMatchesServizio(code, servizio){
    if(!servizio)return true;// no filter needed for full-day sessions
    const s=getShift(code);if(!s||isFuoriServizio(code))return false;
    const validFasceIds=servizio==='pranzo'
      ? ALL_FASCE.filter(f=>f.tipo==='pranzo').map(f=>f.id)
      : IDX_CENA;
    return (s.fasce||[]).some(fid=>validFasceIds.includes(fid));
  }

  // PASS 1: assign staff based on roleReqs (primary) + old slots (fallback)
  sessions.forEach(sess=>{
    const{di,fabKey,servizio,dayName}=sess;
    const fab=G.fabbisogno[fabKey];
    if(!fab)return;
    const assignedInSession=new Set();

    // Build role demand: max count per role across fasce for this servizio
    const roleMax={};
    Object.entries(fab.roleReqs||{}).forEach(([fid,reqs])=>{
      const f=ALL_FASCE.find(f=>f.id==fid);if(!f)return;
      if(servizio==='pranzo'&&f.tipo!=='pranzo')return;
      if(servizio==='cena'&&f.tipo!=='cena')return;
      Object.entries(reqs).forEach(([role,count])=>{
        roleMax[role]=Math.max(roleMax[role]||0,count);
      });
    });

    // Assign people for each needed role
    Object.entries(roleMax).forEach(([neededRole,count])=>{
      if(count<=0)return;
      const compatShifts=compatShiftsForRole(neededRole);
      let assigned=0;
      while(assigned<count){
        function findBestForRole(ignoreOffReq){
          const cands=[];
          eligibleStaff.forEach(p=>{
            if(assignedInSession.has(p.id))return;
            const svc=serviceAssigned[di][p.id];
            if(svc===servizio)return;
            if(svc&&svc!==servizio)return;
            if(weekWorkDays[p.id]>=(p.workDaysPerWeek||5))return;
            if(!ignoreOffReq&&(p.offRequests||[]).includes(di))return;
            const doable=compatShifts.length>0
              ?compatShifts.filter(c=>(p.canDo||[]).includes(c)&&shiftMatchesServizio(c,servizio))
              :(p.canDo||[]).filter(c=>!isFuoriServizio(c)&&shiftMatchesServizio(c,servizio));
            if(!doable.length)return;
            doable.sort((a,b)=>(shiftCount[p.id][a]||0)-(shiftCount[p.id][b]||0));
            const pref=(p.preferredRoles||{})[String(servizio==='pranzo'?1:4)]||'';
            const bonus=pref===neededRole?-0.5:0;
            cands.push({p,bestCode:doable[0],score:(shiftCount[p.id][doable[0]]||0)+(weekWorkDays[p.id]*0.4)+bonus});
          });
          cands.sort((a,b)=>a.score-b.score);return cands[0]||null;
        }
        let best=findBestForRole(false);let usedFallback=false;
        if(!best){best=findBestForRole(true);usedFallback=!!best;}
        if(!best){errors.push(`${dayName}${servizio?' ('+servizio+')':''}: nessuno per ruolo ${neededRole}`);break;}
        const storeKey=servizio==='pranzo'?best.p.id+'_P':servizio==='cena'?best.p.id+'_C':best.p.id;
        newAssign[di][storeKey]=best.bestCode;
        assignedInSession.add(best.p.id);
        if(!serviceAssigned[di][best.p.id]){serviceAssigned[di][best.p.id]=servizio||'any';weekWorkDays[best.p.id]++;}
        shiftCount[best.p.id][best.bestCode]=(shiftCount[best.p.id][best.bestCode]||0)+1;
        // Pre-assign role
        ALL_FASCE.forEach(f=>{
          if(servizio==='pranzo'&&f.tipo!=='pranzo')return;
          if(servizio==='cena'&&f.tipo!=='cena')return;
          if(!shiftInFascia(best.bestCode,f.id))return;
          const rk=`${di}_${f.id}_${best.p.id}`;
          if(!newRoleAssign[rk])newRoleAssign[rk]=neededRole;
        });
        if(usedFallback)warnings.push(`${dayName}: ${best.p.name} → ${neededRole} nonostante giorno libero`);
        assigned++;
      }
    });

    // Fallback: old-style slots for remaining needed people
    (fab.slots||[]).forEach(slot=>{
      const acceptableCodes=slot.codes;
      function findBestSlot(ignoreOffReq){
        const cands=[];
        eligibleStaff.forEach(p=>{
          if(assignedInSession.has(p.id))return;
          const svc=serviceAssigned[di][p.id];
          if(svc===servizio)return;
          if(svc&&svc!==servizio)return;
          if(weekWorkDays[p.id]>=(p.workDaysPerWeek||5))return;
          if(!ignoreOffReq&&(p.offRequests||[]).includes(di))return;
          const doable=acceptableCodes.filter(c=>(p.canDo||[]).includes(c)&&shiftMatchesServizio(c,servizio));
          if(!doable.length)return;
          doable.sort((a,b)=>(shiftCount[p.id][a]||0)-(shiftCount[p.id][b]||0));
          cands.push({p,bestCode:doable[0],score:(shiftCount[p.id][doable[0]]||0)+(weekWorkDays[p.id]*0.4)});
        });
        cands.sort((a,b)=>a.score-b.score);return cands[0]||null;
      }
      let best=findBestSlot(false);let usedFallback=false;
      if(!best){best=findBestSlot(true);usedFallback=!!best;}
      if(best){
        const storeKey=servizio==='pranzo'?best.p.id+'_P':servizio==='cena'?best.p.id+'_C':best.p.id;
        newAssign[di][storeKey]=best.bestCode;
        assignedInSession.add(best.p.id);
        if(!serviceAssigned[di][best.p.id]){serviceAssigned[di][best.p.id]=servizio||'any';weekWorkDays[best.p.id]++;}
        shiftCount[best.p.id][best.bestCode]=(shiftCount[best.p.id][best.bestCode]||0)+1;
        if(usedFallback)warnings.push(`${dayName}: ${best.p.name} assegnato nonostante giorno libero`);
      } else {
        errors.push(`${dayName}${servizio?' ('+servizio+')':''}: nessuno per slot [${acceptableCodes.join('/')}]`);
      }
    });
  });

  // PASS 2: assign OFF — use first fab of each day for maxRiposi
  openDays.forEach(d=>{
    const di=d.idx;
    const fabKey=d.tipo==='pranzo_cena'?`${di}_cena`:String(di);
    const fab=G.fabbisogno[fabKey];
    const riposiMax=fab?fab.maxRiposi||0:0;
    if(riposiMax<=0)return;
    // Person already assigned = any of their keys for this day
    const alreadyHasShift=p=>{
      return !!(newAssign[di][p.id]||newAssign[di][p.id+'_P']||newAssign[di][p.id+'_C']);
    };
    let riposiCount=0;
    eligibleStaff
      .filter(p=>!alreadyHasShift(p)&&weekOffDays[p.id]===0)
      .sort((a,b)=>weekWorkDays[a.id]-weekWorkDays[b.id])
      .forEach(p=>{
        if(riposiCount>=riposiMax)return;
        newAssign[di][p.id]='OFF';weekOffDays[p.id]++;riposiCount++;
      });
  });

  // PASS 3: apply regole
  G.regole.forEach(regola=>{
    if(!regola.absentId||!regola.requiredId)return;
    openDays.forEach(d=>{
      const di=d.idx;
      const absentWorking=isWorking(newAssign[di],regola.absentId);
      if(absentWorking)return;
      const requiredWorking=isWorking(newAssign[di],regola.requiredId);
      if(requiredWorking)return;
      const reqP=eligibleStaff.find(s=>s.id===regola.requiredId);
      if(!reqP){return;}
      if(newAssign[di][regola.requiredId])return;
      const doable=(reqP.canDo||[]).filter(c=>c!=='OFF'&&c!=='FERIE');
      if(!doable.length){warnings.push(`${DAY_NAMES[di]}: regola non rispettata — ${reqP.name} non ha turni abilitati`);return;}
      doable.sort((a,b)=>(shiftCount[reqP.id]?.[a]||0)-(shiftCount[reqP.id]?.[b]||0));
      if(weekWorkDays[reqP.id]>=(reqP.workDaysPerWeek||5)){
        warnings.push(`${DAY_NAMES[di]}: regola applicata — ${reqP.name} supera i giorni settimanali previsti`);
      }
      newAssign[di][reqP.id]=doable[0];
      weekWorkDays[reqP.id]++;
    });
  });

  wk.shift_assign=newAssign;
  // Merge pre-assigned roles (from roleReqs) into role_assign
  Object.assign(wk.role_assign,newRoleAssign);
  dbSaveWeek(wk);
  renderTurni();

  const alertEl=document.getElementById('draft-alerts');
  let html='';
  if(errors.length)html+=`<div class="alert-box"><h4>⚠ Slot non coperti</h4><ul>${errors.map(e=>`<li>${e}</li>`).join('')}</ul></div>`;
  if(warnings.length)html+=`<div class="warn-box"><h4>Avvisi</h4><ul>${warnings.map(w=>`<li>${w}</li>`).join('')}</ul></div>`;
  if(!errors.length&&!warnings.length){
    html=`<div style="background:var(--green-bg);border:0.5px solid var(--green-border);border-radius:var(--radius);padding:10px 16px;margin-bottom:1rem;font-size:12px;color:var(--green-text);">✓ Bozza generata con successo!</div>`;
    setTimeout(()=>{const el=document.getElementById('draft-alerts');if(el)el.innerHTML='';},4000);
  }
  if(alertEl)alertEl.innerHTML=html;
}
