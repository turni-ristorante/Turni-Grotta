let legDragSrc=null;
function legDragStart(e,i){legDragSrc=i;}
function legDragOver(e,i){e.preventDefault();}
function legDrop(e,i){
  e.preventDefault();
  if(legDragSrc===null||legDragSrc===i)return;
  const moved=G.shifts.splice(legDragSrc,1)[0];
  G.shifts.splice(i,0,moved);
  legDragSrc=null;
  renderLegenda();renderLegSidebar();
}
function renderLegenda(){
  const el=document.getElementById('leg-main-table');if(!el)return;
  const fh=ALL_FASCE.map(f=>`<th class="cb-th ${f.tipo==='pranzo'?'fp':'fc'}">${f.label}</th>`).join('');
  let h=`<thead><tr><th style="width:20px;"></th><th style="text-align:left;padding:5px 8px;">Codice</th><th style="text-align:left;min-width:110px;padding:5px 8px;">Pranzo</th><th style="text-align:left;min-width:110px;padding:5px 8px;">Cena</th>${fh}<th style="text-align:left;min-width:160px;padding:5px 8px;background:#f0e6ff;color:#7e22ce;">Ruoli compatibili</th><th></th></tr></thead><tbody>`;
  G.shifts.forEach((s,i)=>{
    h+=`<tr draggable="true" ondragstart="legDragStart(event,${i})" ondragover="legDragOver(event,${i})" ondrop="legDrop(event,${i})" style="cursor:grab;">
      <td style="padding:3px 5px;color:var(--text3);font-size:16px;cursor:grab;">⠿</td>
      <td><span style="${shiftColorStyle(s.code)}padding:2px 8px;border-radius:4px;font-weight:600;font-size:12px;">${s.code}</span>
          <input type="text" value="${s.code}" onchange="G.shifts[${i}].code=this.value;renderLegSidebar();" style="width:52px;font-weight:600;font-family:inherit;margin-left:4px;"></td>
      <td><input type="text" value="${s.s1||''}" placeholder="inizio" onchange="G.shifts[${i}].s1=this.value" style="width:46px;font-family:inherit;"> <input type="text" value="${s.e1||''}" placeholder="fine" onchange="G.shifts[${i}].e1=this.value" style="width:46px;font-family:inherit;"></td>
      <td><input type="text" value="${s.s2||''}" placeholder="inizio" onchange="G.shifts[${i}].s2=this.value" style="width:46px;font-family:inherit;"> <input type="text" value="${s.e2||''}" placeholder="fine" onchange="G.shifts[${i}].e2=this.value" style="width:46px;font-family:inherit;"></td>`;
    ALL_FASCE.forEach(f=>{h+=`<td><input type="checkbox" ${s.fasce&&s.fasce.includes(f.id)?'checked':''} onchange="toggleFascia(${i},${f.id},this.checked)"></td>`;});
    const compatRoles=s.compatibleRoles||[];
    h+=`<td style="padding:3px 6px;background:#f9f3ff;"><div style="display:flex;flex-wrap:wrap;gap:2px;">${ROLES.map(r=>{const on=compatRoles.includes(r);return`<label style="display:flex;align-items:center;gap:2px;font-size:10px;cursor:pointer;padding:1px 4px;border-radius:3px;background:${on?'#7e22ce':'transparent'};color:${on?'#fff':'var(--text2)'};border:0.5px solid ${on?'#7e22ce':'var(--border)'};"><input type="checkbox" style="display:none;" ${on?'checked':''} onchange="toggleCompatRole(${i},'${r}',this.checked)">${r}</label>`;}).join('')}</div></td>`;    h+=`<td><button style="background:none;border:none;cursor:pointer;color:var(--red-text);font-size:14px;padding:0 4px;" onclick="remShift(${i})">×</button></td></tr>`;
  });
  el.innerHTML=h+'</tbody>';
}
function toggleFascia(i,fid,on){const s=G.shifts[i];if(!s.fasce)s.fasce=[];if(on){if(!s.fasce.includes(fid))s.fasce.push(fid);}else{s.fasce=s.fasce.filter(x=>x!==fid);}renderLegSidebar();}
function toggleCompatRole(i,role,on){const s=G.shifts[i];if(!s.compatibleRoles)s.compatibleRoles=[];if(on){if(!s.compatibleRoles.includes(role))s.compatibleRoles.push(role);}else{s.compatibleRoles=s.compatibleRoles.filter(r=>r!==role);}renderLegenda();}
async function saveShifts(){await dbSaveShifts();renderAll();alert('Legenda salvata!');}
function remShift(i){G.shifts.splice(i,1);renderLegenda();}
function addShift(){
  const newShift={code:'NEW',s1:'',e1:'',s2:'',e2:'',is_off:false,is_ferie:false,fasce:[],compatibleRoles:[]};
  // Insert alphabetically by code — find insertion point
  const idx=G.shifts.findIndex(s=>!s.is_off&&!s.is_ferie&&s.code!=='MALATTIA'&&s.code>'NEW');
  if(idx>=0)G.shifts.splice(idx,0,newShift);
  else G.shifts.push(newShift);
  renderLegenda();
}

// ===== AUTO FILL ROLES =====
function autoFillRoles(){
  const wk=curWeek();if(!wk)return;
  const di=wk.selected_day;const tipo=wk.day_config[di];
  const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
  const fasce=fasciaIdxs.map(i=>fascia(i)).filter(Boolean);
  pushUndo(wk);
  fasce.forEach(f=>{
    const fabKey=tipo==='pranzo_cena'?(f.tipo==='pranzo'?`${di}_pranzo`:`${di}_cena`):String(di);
    const fab=G.fabbisogno[fabKey];
    const roleReqs=(fab&&fab.roleReqs&&fab.roleReqs[f.id])||{};
    const roleCount={};
    G.staff.forEach(p=>{
      if(!personInFascia(wk,di,p.id,f,tipo))return;
      const key=`${di}_${f.id}_${p.id}`;
      if(wk.role_assign[key])return;// skip if already set
      // Check role rules first
      let assignedRole=null;
      for(const rr of (G.roleRules||[])){
        if(!rr.targetPersonId||rr.targetPersonId!==p.id)continue;
        if(rr.excludeDays&&rr.excludeDays.includes(di))continue;
        const condCode=getShiftCode(wk,di,rr.condPersonId,null)||getShiftCode(wk,di,rr.condPersonId,'cena')||getShiftCode(wk,di,rr.condPersonId,'pranzo');
        const condWorking=condCode&&!isFuoriServizio(condCode);
        if(rr.condType==='present'&&condWorking){assignedRole=rr.targetRole;break;}
        if(rr.condType==='absent'&&!condWorking){assignedRole=rr.targetRole;break;}
      }
      if(!assignedRole){
        const pref=(p.preferredRoles||{})[String(f.id)];
        const sec=(p.secondaryRoles||{})[String(f.id)];
        if(pref){
          const req=roleReqs[pref]||0;
          const cur=roleCount[pref]||0;
          assignedRole=(req>0&&cur>=req)?(sec||pref):pref;
        } else if(sec){assignedRole=sec;}
      }
      if(assignedRole){
        wk.role_assign[key]=assignedRole;
        roleCount[assignedRole]=(roleCount[assignedRole]||0)+1;
      }
    });
  });
  applyPosRules(wk,di,tipo,wk.role_assign);
  markDirty();renderDayContent();
}

// ===== INCOMPLETEZZA =====
function checkIncompleteness(wk){
  const issues=[];
  const openDays=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  openDays.forEach(d=>{
    const di=d.idx;const tipo=d.tipo;
    const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
    fasciaIdxs.forEach(fi=>{
      const f=fascia(fi);if(!f)return;
      const fabKey=tipo==='pranzo_cena'?(f.tipo==='pranzo'?`${di}_pranzo`:`${di}_cena`):String(di);
      const fab=G.fabbisogno[fabKey];
      if(!fab||!fab.roleReqs||!fab.roleReqs[f.id])return;
      Object.entries(fab.roleReqs[f.id]).forEach(([roleName,required])=>{
        if(!required||required<=0)return;
        const actual=G.staff.filter(p=>{
          const key=`${di}_${f.id}_${p.id}`;
          return(wk.role_assign[key])===roleName&&personInFascia(wk,di,p.id,f,tipo);
        }).length;
        if(actual<required)issues.push(`${d.name} ${f.label}: ${roleName} ${actual}/${required}`);
      });
    });
  });
  return issues;
}
function updateIncompleteAlert(){
  const el=document.getElementById('incomplete-alert');if(!el)return;
  const wk=curWeek();if(!wk){el.style.display='none';return;}
  const issues=checkIncompleteness(wk);
  if(issues.length>0){el.style.display='block';el.textContent=`⚠ ${issues.length} ruoli non coperti`;el.title=issues.join('\n');}
  else el.style.display='none';
}

  if(idx>=0)arr.splice(idx,1);else arr.push(di);
  renderRoleRules();

function togglePosExclDay(ri,di){
  if(!G.posRules[ri].excludeDays)G.posRules[ri].excludeDays=[];

  if(idx>=0)arr.splice(idx,1);else arr.push(di);
  renderPosRules();
}

// Apply posRules when compiling roles auto
function applyPosRules(wk,di,tipo,roleAssign){
  if(!G.posRules||!G.posRules.length)return;
  // For each pos rule, check if one person has a role and adjust the other
  G.posRules.forEach(rule=>{
    if(!rule.personA||!rule.personB)return;
    if((rule.excludeDays||[]).includes(di))return;
    const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
    fasciaIdxs.forEach(fi=>{
      const f=fascia(fi);if(!f)return;
      const keyA=`${di}_${f.id}_${rule.personA}`;
      const keyB=`${di}_${f.id}_${rule.personB}`;
      const roleA=roleAssign[keyA];
      const roleB=roleAssign[keyB];
      if(!roleA||!roleB)return;// can't check if one is missing
      const zoneA=getRoleZone(roleA);
      const zoneB=getRoleZone(roleB);
      if(rule.type==='different'&&zoneA===zoneB){
        // Violation: try to move person B to their secondary role
        const pB=G.staff.find(s=>s.id===rule.personB);
        if(!pB)return;
        const sec=(pB.secondaryRoles||{})[String(f.id)];
        if(sec&&getRoleZone(sec)!==zoneA){
          roleAssign[keyB]=sec;
        }
      }
    });
  });
}

async function saveAll(){
  // Always save the week currently shown in the selector — not curWeek() which could be stale
  const sel=document.getElementById('week-selector');
  const wkId=sel?sel.value:G.currentWeekId;
  const wk=G.weeks.find(w=>w.id===wkId);

async function restoreVersion(versionId,dateStr){

  const {data:v}=await sb.from('week_versions').select('*').eq('id',versionId).single();
  if(!v)return;
  const wk=G.weeks.find(w=>w.id===v.week_id);
  if(!wk){alert('Settimana non trovata.');return;}
  // Save current as version before restoring
  await saveVersionSnapshot(wk,'Prima del ripristino');
  wk.shift_assign=v.shift_assign||{};
  wk.role_assign=v.role_assign||{};
  await dbSaveWeek(wk);
  if(wk.id===G.currentWeekId)renderTurni();
  alert('Versione ripristinata!');
  loadArchive();
}

  if(!confirm(`Rimuovere il manager "${name}"?`))return;
  await sb.from('managers').delete().eq('id',mid);
  G.managers=G.managers.filter(m=>m.id!==mid);
  renderManagers();
}




// ===== FERIE =====

function dataInFinestra(dateStr,tipo){
  // Returns the finestra of given tipo that contains dateStr, for current reparto
  return G.ferieFinestre.find(f=>
    f.reparto===REP&&f.tipo===tipo&&dateStr>=f.data_inizio&&dateStr<=f.data_fine
  )||null;
}

function puoChiedereFerie(dateStr){
  // Blocked period → cannot request
  if(dataInFinestra(dateStr,'bloccata'))return{ok:false,motivo:'Periodo bloccato'};
  // If there are "aperta" windows defined, the date must fall in one
  const finestreAperte=G.ferieFinestre.filter(f=>f.reparto===REP&&f.tipo==='aperta');
  if(finestreAperte.length>0){
    const oggi=dateToStr(new Date());
    // Check if we're currently inside a request window that covers this date
    const finestraValida=finestreAperte.find(f=>dateStr>=f.data_inizio&&dateStr<=f.data_fine);
    if(!finestraValida)return{ok:false,motivo:'Fuori dai periodi richiedibili'};
  }
  return{ok:true};
}

function conteggioFeriePerGiorno(dateStr,reparto){
  // Quante persone del reparto hanno quel giorno APPROVATO
  let count=0;const nomi=[];
  G.ferieRichieste.forEach(r=>{
    const staff=G.allStaff.find(s=>s.id===r.staff_id);
    if(!staff||repOf(staff)!==reparto)return;
    if((r.giorni_approvati||[]).includes(dateStr)){count++;nomi.push(staff.name);}
  });
  return{count,nomi};
}

// Stato di un singolo giorno dentro una richiesta
function statoGiornoFerie(r,dateStr){
  if((r.giorni_approvati||[]).includes(dateStr))return'approvato';
  if((r.giorni_rifiutati||[]).includes(dateStr))return'rifiutato';
  return'attesa';
}

// Tutte le voci ferie del reparto corrente per un dato giorno
function ferieDelGiorno(dateStr){
  const out=[];
  G.ferieRichieste.forEach(r=>{
    if(!(r.giorni||[]).includes(dateStr))return;
    const staff=G.allStaff.find(s=>s.id===r.staff_id);
    if(!staff||repOf(staff)!==REP)return;
    out.push({r,staff,stato:statoGiornoFerie(r,dateStr)});
  });
  return out;
}

// Ricalcola lo stato complessivo dai singoli giorni
function statoComplessivoFerie(r){
  const tot=(r.giorni||[]).length;
  const app=(r.giorni_approvati||[]).length;
  const rif=(r.giorni_rifiutati||[]).length;
  if(app+rif<tot)return'in_attesa';
  if(rif===0)return'approvata';
  if(app===0)return'rifiutata';
  return'parziale';
}

function renderFerie(){
  const el=document.getElementById('ferie-content');if(!el)return;
  if(isManager()){
    renderFerieManager(el);
  } else if(!FERIE_OPERATORI){
    el.innerHTML='<p style="color:var(--text3);font-size:12px;">Le richieste ferie non sono ancora attive. Verranno abilitate a breve.</p>';
  } else if(currentDipendente&&!isExtra(currentDipendente)){
    renderFerieStaff(el);
  } else {
    el.innerHTML='<p style="color:var(--text3);font-size:12px;">Questa funzione è disponibile solo per lo staff fisso.</p>';
  }
}

      ${MONTHS_IT[m]}</button>`;
  }
  html+='</div>';

  const month=selMonth;

  const offset=firstDay===0?6:firstDay-1;

async function salvaDecisioneFerie(r){
  r.stato=statoComplessivoFerie(r);
  await sb.from('ferie_richieste').update({
    giorni_approvati:r.giorni_approvati||[],
    giorni_rifiutati:r.giorni_rifiutati||[],
    stato:r.stato,
    updated_at:new Date().toISOString()
  }).eq('id',r.id);
}

async function decidiGiornoFerie(id,dateStr,esito){
  const r=G.ferieRichieste.find(x=>x.id===id);if(!r)return;
  r.giorni_approvati=(r.giorni_approvati||[]).filter(g=>g!==dateStr);
  r.giorni_rifiutati=(r.giorni_rifiutati||[]).filter(g=>g!==dateStr);
  if(esito==='approvato')r.giorni_approvati.push(dateStr);
  if(esito==='rifiutato')r.giorni_rifiutati.push(dateStr);
  try{
    await salvaDecisioneFerie(r);
    if(esito==='approvato')await scriviFerieInGriglia(r.staff_id,[dateStr]);
    else await rimuoviFerieDaGriglia(r.staff_id,[dateStr]);
    document.getElementById('ferie-day-popup')?.remove();
    renderFerie();
  }catch(e){alert('Errore: '+e.message);}
}

async function decidiTuttaRichiesta(id,esito){
  const r=G.ferieRichieste.find(x=>x.id===id);if(!r)return;
  const giorni=r.giorni||[];
  const verbo=esito==='approvato'?'Approvare':'Rifiutare';
  if(!confirm(`${verbo} tutti i ${giorni.length} giorni della richiesta?`))return;
  if(esito==='approvato'){r.giorni_approvati=[...giorni];r.giorni_rifiutati=[];}
  else{r.giorni_approvati=[];r.giorni_rifiutati=[...giorni];}
  try{
    await salvaDecisioneFerie(r);
    if(esito==='approvato')await scriviFerieInGriglia(r.staff_id,giorni);
    else await rimuoviFerieDaGriglia(r.staff_id,giorni);
    document.getElementById('ferie-day-popup')?.remove();
    renderFerie();
  }catch(e){alert('Errore: '+e.message);}
}

// Toglie FERIE dalla griglia solo dove c'e' scritto FERIE, senza toccare altri turni
async function rimuoviFerieDaGriglia(staffId,giorni){
  const perSettimana={};
  giorni.forEach(g=>{
    const d=new Date(g+'T12:00:00');
    const wk=G.weeks.find(w=>{
      if(!w.startDate)return false;
      const start=new Date(w.startDate+'T12:00:00');
      const end=new Date(start);end.setDate(end.getDate()+6);
      return d>=start&&d<=end;
    });
    if(!wk)return;
    const di=Math.round((d-new Date(wk.startDate+'T12:00:00'))/(1000*60*60*24));
    if(!perSettimana[wk.id])perSettimana[wk.id]={wk,dis:[]};
    perSettimana[wk.id].dis.push(di);
  });
  for(const key of Object.keys(perSettimana)){
    const{wk,dis}=perSettimana[key];
    let cambiato=false;
    dis.forEach(di=>{
      const giorno=wk.shift_assign[di];if(!giorno)return;
      [staffId,staffId+'_P',staffId+'_C'].forEach(k=>{
        if(giorno[k]==='FERIE'){delete giorno[k];cambiato=true;}
      });
    });
    if(cambiato)await dbSaveWeek(wk);
  }
}

function buildFerieFinestreHtml(){
  const mie=G.ferieFinestre.filter(f=>f.reparto===REP);
  let html=`<p style="font-size:12px;color:var(--text2);margin-bottom:1rem;">Definisci i periodi in cui è possibile o vietato richiedere ferie per ${repLabel()}.</p>`;

  html+=`<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:1rem;">
    <p style="font-size:12px;font-weight:500;margin-bottom:8px;">Nuovo periodo</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
      <div><label style="font-size:10px;color:var(--text2);display:block;">Tipo</label>
        <select id="fin-tipo" style="padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:12px;font-family:inherit;background:#fff;">
          <option value="aperta">Richieste aperte</option>
          <option value="bloccata">Ferie bloccate</option>
        </select></div>
      <div><label style="font-size:10px;color:var(--text2);display:block;">Dal</label>
        <input type="date" id="fin-inizio" style="padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:12px;font-family:inherit;"></div>
      <div><label style="font-size:10px;color:var(--text2);display:block;">Al</label>
        <input type="date" id="fin-fine" style="padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:12px;font-family:inherit;"></div>
      <div><label style="font-size:10px;color:var(--text2);display:block;">Nota</label>
        <input type="text" id="fin-nota" placeholder="opzionale" style="padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:12px;font-family:inherit;width:140px;"></div>
      <button class="btn primary" onclick="aggiungiFinestra()">+ Aggiungi</button>
    </div>
  </div>`;

  if(!mie.length)return html+'<p style="color:var(--text3);font-size:12px;">Nessun periodo definito. Senza periodi aperti, le ferie si possono chiedere sempre (tranne nei periodi bloccati).</p>';

  html+=mie.map(f=>{
    const di=new Date(f.data_inizio+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
    const df=new Date(f.data_fine+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
    const isBlock=f.tipo==='bloccata';
    return `<div style="background:${isBlock?'var(--red-bg)':'var(--green-bg)'};border:0.5px solid ${isBlock?'var(--red-border)':'var(--green-border)'};border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <span style="font-size:11px;font-weight:600;color:${isBlock?'var(--red-text)':'var(--green-text)'};padding:2px 8px;border-radius:20px;background:#fff;">${isBlock?'Bloccato':'Aperto'}</span>
      <span style="flex:1;font-size:12px;">${di} → ${df}</span>
      ${f.nota?`<span style="font-size:11px;color:var(--text2);">${f.nota}</span>`:''}
      <button class="btn danger" style="font-size:10px;padding:3px 8px;" onclick="eliminaFinestra('${f.id}')">Rimuovi</button>
    </div>`;
  }).join('');
  return html;
}

async function aggiungiFinestra(){
  const tipo=document.getElementById('fin-tipo').value;
  const inizio=document.getElementById('fin-inizio').value;
  const fine=document.getElementById('fin-fine').value;
  const nota=document.getElementById('fin-nota').value.trim();
  if(!inizio||!fine){alert('Inserisci data inizio e fine.');return;}
  if(fine<inizio){alert('La data di fine deve essere successiva a quella di inizio.');return;}
  const row={id:'f'+Date.now()+Math.random().toString(36).slice(2,5),
    reparto:REP,tipo,data_inizio:inizio,data_fine:fine,nota:nota||null};
  try{
    const {error}=await sb.from('ferie_finestre').insert(row);
    if(error){alert('Errore: '+error.message);return;}
    G.ferieFinestre.push(row);
    renderFerie();
  }catch(e){alert('Errore: '+e.message);}
}

async function eliminaFinestra(id){
  if(!confirm('Rimuovere questo periodo?'))return;
  try{
    await sb.from('ferie_finestre').delete().eq('id',id);
    G.ferieFinestre=G.ferieFinestre.filter(f=>f.id!==id);
    renderFerie();
  }catch(e){alert('Errore: '+e.message);}
}

// ---------- APPROVAZIONE ----------
async function scriviFerieInGriglia(staffId,giorni){
  // Writes FERIE in the shift grid for the given days, respecting day_config
  const perSettimana={};
  giorni.forEach(g=>{
    const d=new Date(g+'T12:00:00');
    const wk=G.weeks.find(w=>{
      if(!w.startDate)return false;
      const start=new Date(w.startDate+'T12:00:00');
      const end=new Date(start);end.setDate(end.getDate()+6);
      return d>=start&&d<=end;
    });
    if(!wk)return;
    const di=Math.round((d-new Date(wk.startDate+'T12:00:00'))/(1000*60*60*24));
    // Skip closed days
    if(wk.day_config[di]==='chiuso')return;
    if(!perSettimana[wk.id])perSettimana[wk.id]={wk,giorni:[]};
    perSettimana[wk.id].giorni.push(di);
  });
  for(const key of Object.keys(perSettimana)){
    const{wk,giorni:dis}=perSettimana[key];
    dis.forEach(di=>{
      if(!wk.shift_assign[di])wk.shift_assign[di]={};
      const tipo=wk.day_config[di];
      if(tipo==='pranzo_cena'){
        wk.shift_assign[di][staffId+'_P']='FERIE';
        wk.shift_assign[di][staffId+'_C']='FERIE';
      } else {
        wk.shift_assign[di][staffId]='FERIE';
      }
    });
    await dbSaveWeek(wk);
  }
  return Object.keys(perSettimana).length;
}

function approvaFerieParziale(id){
  const r=G.ferieRichieste.find(r=>r.id===id);if(!r)return;
  const staff=G.allStaff.find(s=>s.id===r.staff_id);
  const giorni=r.giorni||[];
  const popup=document.createElement('div');
  popup.id='ferie-parz-popup';
  popup.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:600;display:flex;align-items:center;justify-content:center;';
  popup.innerHTML=`<div style="background:#fff;border-radius:var(--radius-lg);padding:1.5rem;width:380px;max-width:95vw;max-height:85vh;overflow:auto;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <h3 style="font-size:14px;font-weight:500;margin-bottom:4px;">Approvazione parziale</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:1rem;">${staff?staff.name:''} — seleziona i giorni da approvare</p>
    <div style="display:flex;flex-direction:column;gap:4px;">
      ${giorni.map(g=>{
        const d=new Date(g+'T12:00:00');
        const label=d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
        const{count,nomi}=conteggioFeriePerGiorno(g,REP);
        return `<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);background:${count>0?'var(--yellow-bg)':'var(--bg3)'};cursor:pointer;font-size:12px;">
          <input type="checkbox" class="ferie-day-cb" value="${g}" checked>
          <span style="flex:1;">${label}</span>
          ${count>0?`<span style="font-size:10px;color:var(--yellow-text);">${nomi.join(', ')}</span>`:''}
        </label>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:1rem;">
      <button class="btn primary" onclick="confermaFerieParziale('${id}')">Approva selezionati</button>
      <button class="btn" onclick="document.getElementById('ferie-parz-popup').remove()">Annulla</button>
    </div>
  </div>`;
  document.body.appendChild(popup);
  popup.addEventListener('click',e=>{if(e.target===popup)popup.remove();});
}

async function confermaFerieParziale(id){
  const r=G.ferieRichieste.find(r=>r.id===id);if(!r)return;
  const selezionati=[...document.querySelectorAll('.ferie-day-cb:checked')].map(cb=>cb.value);
  if(!selezionati.length){alert('Seleziona almeno un giorno.');return;}
  const scartati=(r.giorni||[]).filter(g=>!selezionati.includes(g));
  r.giorni_approvati=selezionati;
  r.giorni_rifiutati=scartati;
  try{
    await salvaDecisioneFerie(r);
    document.getElementById('ferie-parz-popup')?.remove();
    await scriviFerieInGriglia(r.staff_id,selezionati);
    if(scartati.length)await rimuoviFerieDaGriglia(r.staff_id,scartati);
    renderFerie();
    alert(selezionati.length+' giorni approvati, '+scartati.length+' rifiutati.');
  }catch(e){alert('Errore: '+e.message);}
}

async function rifiutaFerie(id){
  const r=G.ferieRichieste.find(r=>r.id===id);if(!r)return;
  const nota=prompt('Motivo del rifiuto (opzionale):');
  if(nota===null)return;
  r.giorni_approvati=[];
  r.giorni_rifiutati=[...(r.giorni||[])];
  r.risposta_nota=nota||null;
  try{
    await salvaDecisioneFerie(r);
    await sb.from('ferie_richieste').update({risposta_nota:nota||null}).eq('id',id);
    await rimuoviFerieDaGriglia(r.staff_id,r.giorni||[]);
    renderFerie();
  }catch(e){alert('Errore: '+e.message);}
}

async function riapriFerie(id){
  const r=G.ferieRichieste.find(r=>r.id===id);if(!r)return;
  if(!confirm('Riportare questa richiesta in attesa?\nNota: i FERIE già scritti nella griglia non vengono rimossi automaticamente.'))return;
  try{
    await sb.from('ferie_richieste').update({stato:'in_attesa',risposta_nota:null,giorni_approvati:[],giorni_rifiutati:[],updated_at:new Date().toISOString()}).eq('id',id);
    await rimuoviFerieDaGriglia(r.staff_id,r.giorni||[]);
    r.stato='in_attesa';r.risposta_nota=null;r.giorni_approvati=[];r.giorni_rifiutati=[];
    renderFerie();
  }catch(e){alert('Errore: '+e.message);}
}

// ---------- VISTA STAFF ----------
function renderFerieStaff(el){
  const staffId=currentDipendente.id;
  const mie=G.ferieRichieste.filter(r=>r.staff_id===staffId);
  const today=new Date();
  if(window._ferieStaffMonth===undefined)window._ferieStaffMonth=today.getMonth();
  if(!window._ferieSelezione)window._ferieSelezione=[];

  const selMonth=window._ferieStaffMonth;
  const year=today.getFullYear();

  let html=`<p style="font-size:14px;font-weight:500;margin-bottom:0.5rem;">Le mie ferie</p>`;

  // Show open windows info
  const finestreAperte=G.ferieFinestre.filter(f=>f.reparto===REP&&f.tipo==='aperta');
  const bloccate=G.ferieFinestre.filter(f=>f.reparto===REP&&f.tipo==='bloccata');
  if(finestreAperte.length){
    html+=`<div style="background:var(--green-bg);border:0.5px solid var(--green-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:0.75rem;">
      <p style="font-size:11px;color:var(--green-text);font-weight:500;">Periodi richiedibili:</p>
      ${finestreAperte.map(f=>{
        const di=new Date(f.data_inizio+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
        const df=new Date(f.data_fine+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
        return `<p style="font-size:11px;color:var(--green-text);">${di} → ${df}${f.nota?' ('+f.nota+')':''}</p>`;
      }).join('')}
    </div>`;
  }
  if(bloccate.length){
    html+=`<div style="background:var(--red-bg);border:0.5px solid var(--red-border);border-radius:var(--radius);padding:10px 14px;margin-bottom:0.75rem;">
      <p style="font-size:11px;color:var(--red-text);font-weight:500;">Periodi bloccati:</p>
      ${bloccate.map(f=>{
        const di=new Date(f.data_inizio+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
        const df=new Date(f.data_fine+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});
        return `<p style="font-size:11px;color:var(--red-text);">${di} → ${df}${f.nota?' ('+f.nota+')':''}</p>`;
      }).join('')}
    </div>`;
  }

  html+=`<p style="font-size:11px;color:var(--text2);margin-bottom:1rem;">Clicca sui giorni per selezionarli, poi invia la richiesta.</p>`;

  // Month tabs
  html+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem;">';
  for(let m=0;m<12;m++){
    const active=m===selMonth;
    const isPastMonth=m<today.getMonth();
    html+=`<button onclick="window._ferieStaffMonth=${m};renderFerie()"
      style="padding:4px 10px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:11px;cursor:pointer;font-family:inherit;background:${active?'var(--blue-bg)':'#fff'};color:${active?'var(--blue-text)':isPastMonth?'var(--text3)':'var(--text2)'};font-weight:${active?'600':'400'};opacity:${isPastMonth?0.5:1};">
      ${MONTHS_IT[m]}</button>`;
  }
  html+='</div>';

  // Calendar
  const month=selMonth;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const offset=firstDay===0?6:firstDay-1;

  html+=`<p style="font-size:13px;font-weight:500;margin-bottom:0.75rem;">${MONTHS_IT[month]} ${year}</p>`;
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:1rem;">';
  ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].forEach(d=>{
    html+=`<div style="text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding:4px 0;">${d}</div>`;
  });
  for(let i=0;i<offset;i++)html+='<div></div>';
  for(let day=1;day<=daysInMonth;day++){
    const date=new Date(year,month,day);
    const dateStr=dateToStr(date);
    const isPast=date<new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const check=puoChiedereFerie(dateStr);
    const selected=window._ferieSelezione.includes(dateStr);
    // Already requested?
    const giaRichiesto=mie.find(r=>(r.giorni||[]).includes(dateStr));
    let bg='#fff';let border='var(--border)';let label='';
    if(isPast){bg='var(--bg3)';}
    else if(giaRichiesto){
      const sg=statoGiornoFerie(giaRichiesto,dateStr);
      if(sg==='approvato'){bg='var(--green-bg)';border='var(--green-border)';label='Approvata';}
      else if(sg==='rifiutato'){bg='var(--red-bg)';border='var(--red-border)';label='Rifiutata';}
      else {bg='var(--yellow-bg)';border='var(--yellow-border)';label='In attesa';}
    }
    else if(selected){bg='var(--blue-bg)';border='var(--blue-border)';}
    else if(!check.ok){bg='var(--bg3)';border='var(--border)';}
    const clickable=!isPast&&!giaRichiesto&&check.ok;
    html+=`<div onclick="${clickable?`toggleFerieDay('${dateStr}')`:''}"
      title="${!check.ok?check.motivo:''}"
      style="border:0.5px solid ${border};border-radius:6px;background:${bg};padding:5px;min-height:52px;cursor:${clickable?'pointer':'default'};opacity:${!clickable&&!giaRichiesto?0.5:1};">
      <div style="font-size:11px;font-weight:600;">${day}</div>
      ${selected?'<div style="font-size:9px;color:var(--blue-text);margin-top:2px;">✓</div>':''}
      ${label?`<div style="font-size:8px;margin-top:2px;">${label}</div>`:''}
    </div>`;
  }
  html+='</div>';

  // Selection summary + submit
  if(window._ferieSelezione.length){
    html+=`<div style="background:var(--blue-bg);border:0.5px solid var(--blue-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:1rem;">
      <p style="font-size:12px;color:var(--blue-text);font-weight:500;margin-bottom:8px;">${window._ferieSelezione.length} giorni selezionati</p>
      <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:10px;">
        ${window._ferieSelezione.sort().map(g=>{
          const d=new Date(g+'T12:00:00');
          return `<span style="font-size:10px;background:#fff;border:0.5px solid var(--blue-border);padding:2px 7px;border-radius:4px;">${d.getDate()}/${d.getMonth()+1}</span>`;
        }).join('')}
      </div>
      <textarea id="ferie-nota" placeholder="Nota (opzionale)" rows="2" style="width:100%;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:12px;resize:none;margin-bottom:8px;"></textarea>
      <div style="display:flex;gap:8px;">
        <button class="btn primary" onclick="inviaRichiestaFerie()">Invia richiesta</button>
        <button class="btn" onclick="window._ferieSelezione=[];renderFerie()">Annulla selezione</button>
      </div>
    </div>`;
  }

  // My requests history
  if(mie.length){
    html+=`<p style="font-size:12px;font-weight:500;margin:1rem 0 8px;">Le mie richieste</p>`;
    html+=mie.map(r=>{
      const giorni=r.giorni||[];
      const app=r.giorni_approvati||[];
      const statoStyle=r.stato==='in_attesa'?'background:var(--yellow-bg);color:var(--yellow-text);border-color:var(--yellow-border);'
        :r.stato==='approvata'?'background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);'
        :r.stato==='parziale'?'background:var(--orange-bg);color:var(--orange-text);border-color:var(--orange-border);'
        :'background:var(--red-bg);color:var(--red-text);border-color:var(--red-border);';
      const statoLabel=r.stato==='in_attesa'?'⏳ In attesa':r.stato==='approvata'?'✓ Approvata':r.stato==='parziale'?`◐ Parziale (${app.length}/${giorni.length})`:'✗ Rifiutata';
      return `<div style="background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
          <span style="flex:1;font-size:12px;font-weight:500;">${giorni.length} giorni richiesti</span>
          <span style="font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:0.5px solid;${statoStyle}">${statoLabel}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:3px;">
          ${giorni.map(g=>{
            const d=new Date(g+'T12:00:00');
            const ok=app.includes(g);
            return `<span style="font-size:10px;background:${ok?'var(--green-bg)':'var(--bg3)'};border:0.5px solid ${ok?'var(--green-border)':'var(--border)'};padding:2px 6px;border-radius:4px;">${d.getDate()}/${d.getMonth()+1}</span>`;
          }).join('')}
        </div>
        ${r.nota?`<p style="font-size:11px;color:var(--text3);margin-top:6px;">${r.nota}</p>`:''}
        ${r.risposta_nota?`<p style="font-size:11px;color:var(--text2);margin-top:6px;padding:6px 8px;background:var(--bg3);border-radius:4px;">Risposta: ${r.risposta_nota}</p>`:''}
        ${r.stato==='in_attesa'?`<div style="display:flex;gap:6px;margin-top:8px;">
          <button class="btn" style="font-size:11px;padding:4px 10px;" onclick="modificaFerie('${r.id}')">✎ Modifica</button>
          <button class="btn danger" style="font-size:11px;padding:4px 10px;" onclick="annullaFerie('${r.id}')">✗ Annulla</button>
        </div>`:''}
      </div>`;
    }).join('');
  }

  el.innerHTML=html;
}

function toggleFerieDay(dateStr){
  if(!window._ferieSelezione)window._ferieSelezione=[];
  const i=window._ferieSelezione.indexOf(dateStr);
  if(i>=0)window._ferieSelezione.splice(i,1);
  else window._ferieSelezione.push(dateStr);
  renderFerie();
}

async function inviaRichiestaFerie(){
  const giorni=[...window._ferieSelezione].sort();
  if(!giorni.length){alert('Seleziona almeno un giorno.');return;}
  const nota=document.getElementById('ferie-nota')?.value.trim()||'';
  const row={
    id:'fr'+Date.now()+Math.random().toString(36).slice(2,5),
    staff_id:currentDipendente.id,giorni,giorni_approvati:[],
    nota:nota||null,stato:'in_attesa',
    created_at:new Date().toISOString(),updated_at:new Date().toISOString()
  };
  try{
    const {error}=await sb.from('ferie_richieste').insert(row);
    if(error){alert('Errore: '+error.message);return;}
    G.ferieRichieste.unshift(row);
    window._ferieSelezione=[];
    renderFerie();
    alert('Richiesta ferie inviata!');
  }catch(e){alert('Errore: '+e.message);}
}

function modificaFerie(id){
  const r=G.ferieRichieste.find(r=>r.id===id);if(!r)return;
  if(r.stato!=='in_attesa'){alert('Non puoi modificare una richiesta già decisa.');return;}
  // Load the days back into selection and delete the old request
  if(!confirm('Modificare questa richiesta?\nI giorni torneranno selezionabili nel calendario.'))return;
  window._ferieSelezione=[...(r.giorni||[])];
  annullaFerie(id,true);
}

async function annullaFerie(id,silent){
  const r=G.ferieRichieste.find(r=>r.id===id);if(!r)return;
  if(r.stato!=='in_attesa'){alert('Non puoi annullare una richiesta già decisa.');return;}
  if(!silent&&!confirm('Annullare questa richiesta ferie?'))return;
  try{
    await sb.from('ferie_richieste').delete().eq('id',id);
    G.ferieRichieste=G.ferieRichieste.filter(x=>x.id!==id);
    renderFerie();
    if(!silent)alert('Richiesta annullata.');
  }catch(e){alert('Errore: '+e.message);}
}

// ===== RICHIESTE TURNO =====

function getRichiestePersona(staffId){
  return G.richieste.filter(r=>r.staff_id===staffId);
}

function getRichiestaMessoSolare(staffId){
  // Counts requests in current calendar month, excluding those reset by a manager
  const now=new Date();
  const y=now.getFullYear();const m=now.getMonth()+1;
  return G.richieste.filter(r=>{
    if(r.staff_id!==staffId)return false;
    if(r.esclusa_conteggio)return false;
    const d=new Date(r.created_at);
    return d.getFullYear()===y&&(d.getMonth()+1)===m;
  }).length;
}

function updateRichiesteBadge(){
  const badge=document.getElementById('richieste-badge');if(!badge)return;
  if(!currentDipendente){badge.style.display='none';return;}
  const pending=G.richieste.filter(r=>r.staff_id===currentDipendente.id&&r.stato!=='in_attesa');
  // Show badge for new responses not yet seen
  const newResp=pending.filter(r=>!r._seen);
  if(newResp.length>0){
    badge.style.display='inline-block';
    badge.innerHTML=`<span onclick="goTab('richieste')" style="background:var(--blue-bg);color:var(--blue-text);border:0.5px solid var(--blue-border);padding:2px 10px;border-radius:20px;font-size:10px;cursor:pointer;font-weight:500;">
      &#128276; ${newResp.length} risposta${newResp.length>1?'e':''} alle tue richieste</span>`;
  } else {
    badge.style.display='none';
  }
}

function renderRichieste(){
  const el=document.getElementById('richieste-content');if(!el)return;
  if(isManager()){
    renderRichiesteManager(el);
  } else if(currentDipendente&&!isExtra(currentDipendente)){
    renderRichiesteStaff(el);
  } else {
    el.innerHTML='<p style="color:var(--text3);font-size:12px;">Questa funzione è disponibile solo per lo staff fisso.</p>';
  }
}

function renderRichiesteManager(el){
  const pending=G.richieste.filter(r=>r.stato==='in_attesa');
  const done=G.richieste.filter(r=>r.stato!=='in_attesa');

  let html=`<p style="font-size:14px;font-weight:500;margin-bottom:0.75rem;">Richieste turno</p>`;

  // Reset counter panel
  const staffFisso=G.allStaff.filter(s=>!isExtra(s)&&repOf(s)===REP&&s.attivo!==false);
  const nowM=new Date();
  html+=`<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:1rem;">
    <p style="font-size:12px;font-weight:500;margin-bottom:8px;">Contatore richieste — ${MONTHS_IT[nowM.getMonth()]} ${nowM.getFullYear()}</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      ${staffFisso.map(s=>{
        const usate=getRichiestaMessoSolare(s.id);
        const col=usate>0?'var(--orange-text)':'var(--green-text)';
        const bg=usate>0?'var(--orange-bg)':'var(--green-bg)';
        const bd=usate>0?'var(--orange-border)':'var(--green-border)';
        return `<span style="font-size:11px;padding:3px 9px;border-radius:20px;background:${bg};color:${col};border:0.5px solid ${bd};">
          ${s.name}: ${usate}/1
          ${usate>0?`<span onclick="resetContatore('${s.id}','${s.name}')" style="cursor:pointer;font-weight:700;margin-left:4px;" title="Azzera contatore">↺</span>`:''}
        </span>`;
      }).join('')}
    </div>
    <p style="font-size:10px;color:var(--text3);margin-top:6px;">Clicca ↺ accanto a un nome per azzerare il suo contatore mensile.</p>
  </div>`;

  if(!G.richieste.length){
    html+='<p style="color:var(--text3);font-size:12px;">Nessuna richiesta.</p>';
    el.innerHTML=html;return;
  }

  // Pending requests
  if(pending.length){
    html+=`<p style="font-size:12px;font-weight:600;color:var(--orange-text);margin-bottom:8px;">&#9888; In attesa di risposta (${pending.length})</p>`;
    html+=pending.map(r=>{
      const staff=G.allStaff.find(s=>s.id===r.staff_id);
      const dateObj=new Date(r.data+'T12:00:00');
      const dateLabel=dateObj.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
      return `<div style="background:#fff;border:0.5px solid var(--orange-border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="flex:1;">
            <span style="font-weight:500;">${staff?staff.name:'?'}</span>
            <span style="font-size:11px;color:var(--text2);margin-left:8px;">${dateLabel}</span>
            <span style="font-size:11px;font-weight:600;margin-left:8px;padding:2px 8px;border-radius:4px;${r.turno_richiesto==='OFF'?'background:#111;color:#fff;':'background:var(--bg3);'}">${r.turno_richiesto}</span>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn success" style="font-size:11px;padding:4px 10px;" onclick="rispondiRichiesta('${r.id}','approvata')">✓ Approva</button>
            <button class="btn danger" style="font-size:11px;padding:4px 10px;" onclick="rispondiRichiesta('${r.id}','rifiutata')">✗ Rifiuta</button>
          </div>
        </div>
        ${r.nota?`<p style="font-size:11px;color:var(--text2);margin-top:6px;padding:6px 8px;background:var(--bg3);border-radius:4px;">&#128172; ${r.nota}</p>`:''}
      </div>`;
    }).join('');
  }

  // Done requests
  if(done.length){
    html+=`<p style="font-size:12px;font-weight:600;color:var(--text2);margin:1rem 0 8px;">Storico richieste</p>`;
    html+=done.slice(0,20).map(r=>{
      const staff=G.allStaff.find(s=>s.id===r.staff_id);
      const dateObj=new Date(r.data+'T12:00:00');
      const dateLabel=dateObj.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
      const statoColor=r.stato==='approvata'?'color:var(--green-text);':'color:var(--red-text);';
      return `<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <span style="font-weight:500;flex:1;">${staff?staff.name:'?'}</span>
        <span style="font-size:11px;color:var(--text2);">${dateLabel}</span>
        <span style="font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:#fff;border:0.5px solid var(--border);">${r.turno_richiesto}</span>
        <span style="font-size:11px;font-weight:600;${statoColor}">${r.stato==='approvata'?'✓ Approvata':'✗ Rifiutata'}</span>
        ${r.esclusa_conteggio?'<span style="font-size:10px;color:var(--blue-text);background:var(--blue-bg);padding:1px 7px;border-radius:20px;">non conteggiata</span>':''}
        <button class="btn" style="font-size:10px;padding:3px 8px;" onclick="riapriRichiesta('${r.id}')" title="Riporta in attesa">↺ Riapri</button>
        ${!r.esclusa_conteggio?`<button class="btn" style="font-size:10px;padding:3px 8px;" onclick="escludiConteggio('${r.id}')" title="Non conta per il limite mensile">⊘ Non contare</button>`:''}
      </div>`;
    }).join('');
  }
  el.innerHTML=html;
}

async function rispondiRichiesta(id,stato){
  const r=G.richieste.find(r=>r.id===id);if(!r)return;
  const nota=stato==='rifiutata'?prompt('Motivo del rifiuto (opzionale):'):'';
  try{
    await sb.from('richieste_turno').update({stato,risposta_nota:nota||null,updated_at:new Date().toISOString()}).eq('id',id);
    r.stato=stato;r.risposta_nota=nota||null;

    // If approved, write the shift into the week
    if(stato==='approvata'){
      const dataRich=new Date(r.data+'T12:00:00');
      // Find the week that contains this date
      const wk=G.weeks.find(w=>{
        if(!w.startDate)return false;
        const start=new Date(w.startDate+'T12:00:00');
        const end=new Date(start);end.setDate(end.getDate()+6);
        return dataRich>=start&&dataRich<=end;
      });
      if(wk){
        const di=Math.round((dataRich-new Date(wk.startDate+'T12:00:00'))/(1000*60*60*24));
        if(!wk.shift_assign[di])wk.shift_assign[di]={};
        wk.shift_assign[di][r.staff_id]=r.turno_richiesto;
        await dbSaveWeek(wk);
        alert('Richiesta approvata! Turno '+r.turno_richiesto+' inserito nella settimana.');
      } else {
        alert('Richiesta approvata! Nessuna settimana trovata per quella data — inserisci il turno manualmente.');
      }
    } else {
      alert('Richiesta rifiutata.');
    }
    renderRichiesteManager(document.getElementById('richieste-content'));
  }catch(e){alert('Errore: '+e.message);}
}

async function riapriRichiesta(id){
  const r=G.richieste.find(r=>r.id===id);if(!r)return;
  if(!confirm('Riportare questa richiesta in attesa di risposta?'))return;
  try{
    await sb.from('richieste_turno').update({stato:'in_attesa',risposta_nota:null,updated_at:new Date().toISOString()}).eq('id',id);
    r.stato='in_attesa';r.risposta_nota=null;r._seen=false;
    renderRichiesteManager(document.getElementById('richieste-content'));
    alert('Richiesta riaperta.');
  }catch(e){alert('Errore: '+e.message);}
}

async function escludiConteggio(id){
  const r=G.richieste.find(r=>r.id===id);if(!r)return;
  if(!confirm('Escludere questa richiesta dal conteggio mensile?\nLa persona potrà fare una nuova richiesta questo mese.'))return;
  try{
    await sb.from('richieste_turno').update({esclusa_conteggio:true}).eq('id',id);
    r.esclusa_conteggio=true;
    renderRichiesteManager(document.getElementById('richieste-content'));
    alert('Richiesta esclusa dal conteggio.');
  }catch(e){alert('Errore: '+e.message);}
}

async function resetContatore(staffId,nome){
  if(!confirm('Azzerare il contatore mensile di '+nome+'?\nPotrà fare una nuova richiesta questo mese.'))return;
  const now=new Date();
  const y=now.getFullYear();const m=now.getMonth()+1;
  // Find this month's requests for this person that still count
  const daEscludere=G.richieste.filter(r=>{
    if(r.staff_id!==staffId||r.esclusa_conteggio)return false;
    const d=new Date(r.created_at);
    return d.getFullYear()===y&&(d.getMonth()+1)===m;
  });
  if(!daEscludere.length){alert('Nessuna richiesta da azzerare questo mese.');return;}
  try{
    const ids=daEscludere.map(r=>r.id);
    await sb.from('richieste_turno').update({esclusa_conteggio:true}).in('id',ids);
    daEscludere.forEach(r=>{r.esclusa_conteggio=true;});
    renderRichiesteManager(document.getElementById('richieste-content'));
    alert('Contatore di '+nome+' azzerato.');
  }catch(e){alert('Errore: '+e.message);}
}

function modificaRichiesta(id){
  const r=G.richieste.find(r=>r.id===id);if(!r)return;
  if(r.stato!=='in_attesa'){alert('Non puoi modificare una richiesta già decisa.');return;}
  const popup=document.createElement('div');
  popup.id='rich-edit-popup';
  popup.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:600;display:flex;align-items:center;justify-content:center;';
  popup.innerHTML=`<div style="background:#fff;border-radius:var(--radius-lg);padding:1.5rem;width:380px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <h3 style="font-size:14px;font-weight:500;margin-bottom:1rem;">Modifica richiesta</h3>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div>
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;">Data</label>
        <input type="date" id="edit-rich-data" value="${r.data}" min="${dateToStr(new Date())}"
          style="width:100%;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:13px;">
      </div>
      <div>
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;">Turno richiesto</label>
        <select id="edit-rich-turno" style="width:100%;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:13px;background:#fff;">
          <option value="OFF"${r.turno_richiesto==='OFF'?' selected':''}>OFF (riposo)</option>
          ${G.shifts.filter(s=>!s.is_ferie).map(s=>`<option value="${s.code}"${s.code===r.turno_richiesto?' selected':''}>${s.code}${s.s1&&s.e1?' ('+s.s1+'–'+s.e1+')':s.s2&&s.e2?' ('+s.s2+'–'+s.e2+')':''}</option>`).join('')}
        </select>
      </div>
      <div>
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:4px;">Nota (opzionale)</label>
        <textarea id="edit-rich-nota" rows="2"
          style="width:100%;padding:7px 10px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:12px;resize:none;">${r.nota||''}</textarea>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:1rem;">
      <button class="btn primary" onclick="salvaModificaRichiesta('${r.id}')">Salva modifiche</button>
      <button class="btn" onclick="document.getElementById('rich-edit-popup').remove()">Annulla</button>
    </div>
  </div>`;
  document.body.appendChild(popup);
  popup.addEventListener('click',e=>{if(e.target===popup)popup.remove();});
}

async function salvaModificaRichiesta(id){
  const r=G.richieste.find(r=>r.id===id);if(!r)return;
  const data=document.getElementById('edit-rich-data').value;
  const turno=document.getElementById('edit-rich-turno').value;
  const nota=document.getElementById('edit-rich-nota').value.trim();
  if(!data){alert('Seleziona una data.');return;}
  if(!turno){alert('Seleziona un turno.');return;}
  try{
    await sb.from('richieste_turno').update({
      data,turno_richiesto:turno,nota:nota||null,updated_at:new Date().toISOString()
    }).eq('id',id);
    r.data=data;r.turno_richiesto=turno;r.nota=nota||null;
    document.getElementById('rich-edit-popup')?.remove();
    renderRichiesteStaff(document.getElementById('richieste-content'));
    alert('Richiesta aggiornata!');
  }catch(e){alert('Errore: '+e.message);}
}

async function annullaRichiesta(id){
  const r=G.richieste.find(r=>r.id===id);if(!r)return;
  if(r.stato!=='in_attesa'){alert('Non puoi annullare una richiesta già decisa.');return;}
  if(!confirm('Annullare questa richiesta?\nPotrai farne una nuova questo mese.'))return;
  try{
    await sb.from('richieste_turno').delete().eq('id',id);
    G.richieste=G.richieste.filter(x=>x.id!==id);
    renderRichiesteStaff(document.getElementById('richieste-content'));
    alert('Richiesta annullata.');
  }catch(e){alert('Errore: '+e.message);}
}

function renderRichiesteStaff(el){
  const staffId=currentDipendente.id;
  const mioRichieste=getRichiestePersona(staffId);
  const usateQuestoMese=getRichiestaMessoSolare(staffId);
  const possoChiedere=usateQuestoMese===0;
  const now=new Date();
  const meseCorrente=MONTHS_IT[now.getMonth()]+' '+now.getFullYear();

  // Mark responses as seen
  mioRichieste.filter(r=>r.stato!=='in_attesa'&&!r._seen).forEach(r=>r._seen=true);
  updateRichiesteBadge();

  let html=`<p style="font-size:14px;font-weight:500;margin-bottom:0.5rem;">Le mie richieste turno</p>`;
  html+=`<p style="font-size:11px;color:var(--text2);margin-bottom:1rem;">Puoi fare <b>1 richiesta al mese</b>. Questo mese (${meseCorrente}): <b>${usateQuestoMese}/1</b> richieste usate.</p>`;

  if(possoChiedere){
    html+=`<div style="background:var(--green-bg);border:0.5px solid var(--green-border);border-radius:var(--radius);padding:12px 16px;margin-bottom:1rem;">
      <p style="font-size:12px;color:var(--green-text);font-weight:500;margin-bottom:8px;">&#10003; Puoi fare una richiesta questo mese</p>
      <button class="btn primary" onclick="apriFormRichiesta()">+ Nuova richiesta</button>
    </div>`;
  } else {
    html+=`<div style="background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:1rem;">
      <p style="font-size:12px;color:var(--text2);">Hai già usato la tua richiesta mensile. Potrai fare una nuova richiesta il mese prossimo.</p>
    </div>`;
  }

  if(mioRichieste.length){
    html+=`<p style="font-size:12px;font-weight:500;margin-bottom:8px;">Storico richieste</p>`;
    html+=mioRichieste.map(r=>{
      const dateObj=new Date(r.data+'T12:00:00');
      const dateLabel=dateObj.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      const statoStyle=r.stato==='in_attesa'?'background:var(--yellow-bg);color:var(--yellow-text);border-color:var(--yellow-border);'
        :r.stato==='approvata'?'background:var(--green-bg);color:var(--green-text);border-color:var(--green-border);'
        :'background:var(--red-bg);color:var(--red-text);border-color:var(--red-border);';
      const statoLabel=r.stato==='in_attesa'?'⏳ In attesa':r.stato==='approvata'?'✓ Approvata':'✗ Rifiutata';
      const modificabile=r.stato==='in_attesa';
      return `<div style="background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div style="flex:1;">
            <div style="font-weight:500;font-size:13px;">${dateLabel}</div>
            <div style="font-size:12px;color:var(--text2);margin-top:2px;">Turno richiesto: <b>${r.turno_richiesto}</b></div>
            ${r.nota?`<div style="font-size:11px;color:var(--text3);margin-top:2px;">${r.nota}</div>`:''}
          </div>
          <span style="font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:0.5px solid;${statoStyle}">${statoLabel}</span>
        </div>
        ${modificabile?`<div style="display:flex;gap:6px;margin-top:8px;">
          <button class="btn" style="font-size:11px;padding:4px 10px;" onclick="modificaRichiesta('${r.id}')">✎ Modifica</button>
          <button class="btn danger" style="font-size:11px;padding:4px 10px;" onclick="annullaRichiesta('${r.id}')">✗ Annulla richiesta</button>
        </div>`:''}
        ${r.risposta_nota?`<p style="font-size:11px;color:var(--text2);margin-top:8px;padding:6px 8px;background:var(--bg3);border-radius:4px;">Risposta: ${r.risposta_nota}</p>`:''}
      </div>`;
    }).join('');
  } else {
    html+='<p style="color:var(--text3);font-size:12px;">Nessuna richiesta ancora.</p>';
  }
  el.innerHTML=html;
}

async function inviaRichiesta(staffId){
  const data=document.getElementById('rich-data').value;
  const turno=document.getElementById('rich-turno').value;
  const nota=document.getElementById('rich-nota').value.trim();
  if(!data){alert('Seleziona una data.');return;}
  if(!turno){alert('Seleziona un turno.');return;}
  const row={
    id:'r'+Date.now()+Math.random().toString(36).slice(2,5),
    staff_id:staffId,data,turno_richiesto:turno,
    nota:nota||null,stato:'in_attesa',
    created_at:new Date().toISOString(),updated_at:new Date().toISOString()
  };
  try{
    const {error}=await sb.from('richieste_turno').insert(row);
    if(error){alert('Errore: '+error.message);return;}
    G.richieste.unshift(row);
    document.querySelector('[onclick*="closest(\'div\').parentElement.remove"]')?.click();
    document.querySelector('div[style*="rgba"]')?.remove();
    renderRichiesteStaff(document.getElementById('richieste-content'));
    alert('Richiesta inviata! Il manager risponderà al più presto.');
  }catch(e){alert('Errore: '+e.message);}
}

// ===== DISPONIBILITA EXTRA =====

function dateToStr(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,'0');
  const d=String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}

function getDisp(staffId,dateStr){
  return G.disponibilita[staffId+'_'+dateStr]||null;
}

async function saveDisp(staffId,dateStr,fasce){
  const row={id:'d'+Date.now()+Math.random().toString(36).slice(2,5),
    staff_id:staffId,data:dateStr,fasce:fasce};
  const {error}=await sb.from('disponibilita').upsert(row,{onConflict:'staff_id,data'});
  if(!error){G.disponibilita[staffId+'_'+dateStr]=row;return true;}
  console.error('saveDisp error:',error);return false;
}

async function deleteDisp(staffId,dateStr){
  const {error}=await sb.from('disponibilita').delete().eq('staff_id',staffId).eq('data',dateStr);
  if(!error){delete G.disponibilita[staffId+'_'+dateStr];return true;}
  return false;
}

function renderDisponibilita(){
  const el=document.getElementById('disp-content');if(!el)return;
  if(isManager()){
    renderDispManager(el);
  } else {
    // Dipendente/extra
    const staffId=currentDipendente?currentDipendente.id:null;
    if(!staffId){
      el.innerHTML='<p style="color:var(--text3);font-size:12px;">Profilo non trovato. Riprova ad accedere.</p>';
      return;
    }
    renderDispCalendar(el,staffId,false);
  }
}

    html+=`<div style="border:0.5px solid var(--border);border-radius:6px;background:#fff;padding:5px;min-height:70px;">

        const d=getDisp(s.id,dateStr);

        return `<span onclick="showDispDetail('${s.id}','${dateStr}')"
          style="display:block;font-size:9px;background:#dcfce7;border:0.5px solid #86efac;border-radius:3px;padding:1px 4px;margin-bottom:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"

function showDispDetail(staffId,dateStr){

    <h3 style="font-size:14px;font-weight:500;margin-bottom:4px;">${s.name}</h3>

function renderDispCalendar(el,staffId,canEdit){
  const staff=G.allStaff.find(s=>s.id===staffId);
  const today=new Date();
  if(window._dispExtraMonth===undefined)window._dispExtraMonth=today.getMonth();
  const selMonth=window._dispExtraMonth;
  const year=today.getFullYear();

  let html=`<p style="font-size:14px;font-weight:500;margin-bottom:0.5rem;">La mia disponibilità${staff?' — '+staff.name:''}</p>`;
  html+=`<p style="font-size:11px;color:var(--text2);margin-bottom:1rem;">Clicca su un giorno per indicare quando sei disponibile. I giorni verdi sono già segnati.</p>`;

  // Month tabs
  html+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem;">';
  for(let m=0;m<12;m++){
    const active=m===selMonth;
    const isPastMonth=m<today.getMonth();
    html+=`<button onclick="window._dispExtraMonth=${m};renderDisponibilita()"
      style="padding:4px 10px;border-radius:var(--radius);border:0.5px solid var(--border);font-size:11px;cursor:pointer;font-family:inherit;
      background:${active?'var(--blue-bg)':'#fff'};color:${active?'var(--blue-text)':isPastMonth?'var(--text3)':'var(--text2)'};font-weight:${active?'600':'400'};opacity:${isPastMonth?0.5:1};">
      ${MONTHS_IT[m]}</button>`;
  }
  html+='</div>';

  // Single month calendar
  const month=selMonth;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const offset=firstDay===0?6:firstDay-1;

  html+=`<p style="font-size:13px;font-weight:500;margin-bottom:0.75rem;">${MONTHS_IT[month]} ${year}</p>`;
  html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;">';
  ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].forEach(d=>{
    html+=`<div style="text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding:4px 0;">${d}</div>`;
  });
  for(let i=0;i<offset;i++)html+='<div></div>';
  for(let day=1;day<=daysInMonth;day++){
    const date=new Date(year,month,day);
    const dateStr=dateToStr(date);
    const isPast=date<new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const disp=getDisp(staffId,dateStr);
    const hasFull=disp&&(!disp.fasce||!disp.fasce.length);
    const hasSome=disp&&disp.fasce&&disp.fasce.length>0;
    const labels=disp&&disp.fasce&&disp.fasce.length?disp.fasce.map(fid=>{const f=ALL_FASCE.find(f=>f.id==fid);return f?f.label.slice(0,3):'';}).join(', '):'';
    let bg=isPast?'var(--bg3)':hasFull||hasSome?'#dcfce7':'#fff';
    let border=hasFull||hasSome?'#86efac':'var(--border)';
    html+=`<div onclick="${!isPast?`openDispDay('${staffId}','${dateStr}')`:''}"
      style="border:0.5px solid ${border};border-radius:6px;background:${bg};padding:6px;min-height:64px;cursor:${!isPast?'pointer':'default'};">
      <div style="font-size:11px;font-weight:600;color:${isPast?'var(--text3)':'var(--text)'};">${day}</div>
      ${labels?`<div style="font-size:9px;color:#16a34a;margin-top:3px;line-height:1.4;">${labels}</div>`:''}
      ${hasFull?`<div style="font-size:9px;color:#16a34a;margin-top:3px;">Tutto il giorno</div>`:''}
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

function openDispDay(staffId,dateStr){
  const disp=getDisp(staffId,dateStr);
  const staff=G.allStaff.find(s=>s.id===staffId);
  const dateObj=new Date(dateStr+'T12:00:00');
  const dateLabel=dateObj.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  const fascHtml=ALL_FASCE.map(f=>{
    const checked=!disp||(disp&&(!disp.fasce||!disp.fasce.length||disp.fasce.includes(f.id)));
    const cls=f.tipo==='pranzo'?'background:#fff8dd;':'background:#ddeeff;';
    return `<label style="display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius);${cls}cursor:pointer;font-size:12px;margin-bottom:4px;">
      <input type="checkbox" id="disp-f-${f.id}" ${checked?'checked':''}>
      ${f.label} <span style="color:var(--text3);font-size:10px;">${f.orario}</span>
    </label>`;
  }).join('');
  const popup=document.createElement('div');
  popup.id='disp-popup';
  popup.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:600;display:flex;align-items:center;justify-content:center;';
  popup.innerHTML=`<div style="background:#fff;border-radius:var(--radius-lg);padding:1.5rem;width:340px;max-width:95vw;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
    <h3 style="font-size:14px;font-weight:500;margin-bottom:4px;">${staff?staff.name:''}</h3>
    <p style="font-size:12px;color:var(--text2);margin-bottom:1rem;">${dateLabel}</p>
    <p style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:8px;">Sono disponibile in queste fasce:</p>
    ${fascHtml}
    <div style="display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap;">
      <button class="btn primary" onclick="saveDispDay('${staffId}','${dateStr}')">Salva</button>
      ${disp?`<button class="btn danger" onclick="deleteDispDay('${staffId}','${dateStr}')">Rimuovi disponibilità</button>`:''}
      <button class="btn" onclick="document.getElementById('disp-popup').remove()">Annulla</button>
    </div>
  </div>`;
  document.body.appendChild(popup);
  popup.addEventListener('click',e=>{if(e.target===popup)popup.remove();});
}

async function saveDispDay(staffId,dateStr){
  const fasce=ALL_FASCE.filter(f=>{const cb=document.getElementById('disp-f-'+f.id);return cb&&cb.checked;}).map(f=>f.id);
  const ok=await saveDisp(staffId,dateStr,fasce);
  document.getElementById('disp-popup')?.remove();
  if(ok){
    // Refresh the view
    const el=document.getElementById('disp-content');
    if(el){if(isManager())renderDispManager(el);else renderDispCalendar(el,staffId,false);}
  } else {alert('Errore durante il salvataggio.');}
}

async function deleteDispDay(staffId,dateStr){
  if(!confirm('Rimuovere la disponibilità per questo giorno?'))return;
  const ok=await deleteDisp(staffId,dateStr);
  document.getElementById('disp-popup')?.remove();
  if(ok){
    const el=document.getElementById('disp-content');
    if(el){if(isManager())renderDispManager(el);else renderDispCalendar(el,staffId,false);}
  } else {alert('Errore durante la rimozione.');}
}

// ===== PRESENZA ONLINE =====
let presenceInterval=null;
async function setOnline(){
  if(!currentManager||!isManager())return;
  try{
    await sb.from('config').upsert({key:'online_'+currentManager.id, value:JSON.stringify({name:currentManager.name,at:new Date().toISOString()})});
  }catch(e){}
}
async function setOffline(){
  if(!currentManager||!isManager())return;
  try{await sb.from('config').delete().eq('key','online_'+currentManager.id);}catch(e){}
}
async function updateOnlineBadge(){
  if(!isManager())return;
  try{
    const {data}=await sb.from('config').select('key,value').like('key','online_%');
    if(!data||!data.length){document.getElementById('online-badge')&&(document.getElementById('online-badge').textContent='');return;}
    const now=Date.now();
    const online=data.map(r=>{
      try{const v=JSON.parse(r.value);return{name:v.name,at:new Date(v.at).getTime()};}catch(e){return null;}
    }).filter(v=>v&&now-v.at<120000);// active in last 2 minutes
    const el=document.getElementById('online-badge');
    if(el){
      if(online.length>1){
        const others=online.filter(v=>v.name!==currentManager?.name).map(v=>v.name);
        el.innerHTML=others.length?`<span style="background:var(--orange-bg);color:var(--orange-text);border:0.5px solid var(--orange-border);padding:2px 8px;border-radius:20px;font-size:10px;">&#128100; Online anche: ${others.join(', ')}</span>`:'';
      } else {el.textContent='';}
    }
  }catch(e){}
}
function startPresence(){
  if(presenceInterval)clearInterval(presenceInterval);
  setOnline();
  presenceInterval=setInterval(()=>{setOnline();updateOnlineBadge();},30000);
  updateOnlineBadge();
}
function stopPresence(){
  if(presenceInterval){clearInterval(presenceInterval);presenceInterval=null;}
  setOffline();
}

// ===== EXPORT PDF =====
function exportPDF(){
  const wk=curWeek();if(!wk)return;
  if(!confirm('Esportare i turni e il giornaliero di '+repLabel()+' per la settimana "'+wk.name+'" in PDF?'))return;
  const days=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  const weekDates=getWeekDates(wk);
  let cols=[];
  days.forEach(d=>{
    const dateStr=weekDates?weekDates[d.idx].getDate():'';
    const label=dateStr?d.name+' '+dateStr:d.name;
    if(d.tipo==='pranzo_cena'){cols.push({...d,label,servizio:'pranzo',colLabel:'P'});cols.push({...d,label,servizio:'cena',colLabel:'C'});}
    else cols.push({...d,label,servizio:null});
  });
  let html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Turni '+wk.name+'</title><style>body{font-family:Arial,sans-serif;font-size:10px;margin:16px;}h1{font-size:14px;margin-bottom:8px;}h2{font-size:11px;margin:14px 0 4px;page-break-before:avoid;}table{border-collapse:collapse;width:100%;margin-bottom:12px;}th,td{border:0.5px solid #ccc;padding:2px 4px;text-align:center;}th{background:#f0f0f0;font-weight:600;}.name{text-align:left;font-weight:500;}.off{background:#111;color:#fff;}.b{background:#1a56db;color:#fff;}.d{background:#e65100;color:#fff;}.m{background:#6b7280;color:#fff;}.a{background:#c026d3;color:#fff;}.e{background:#dc2626;color:#fff;}@media print{body{margin:8px;}}</style></head><body>';
  html+='<h1>Turni settimana: '+wk.name+'</h1>';
  html+='<table><thead><tr><th class="name">Operatore</th>';
  let lastDi=-1;
  cols.forEach(c=>{if(c.idx===lastDi)return;lastDi=c.idx;const sp=c.tipo==='pranzo_cena'?2:1;html+='<th colspan="'+sp+'">'+c.label+'</th>';});
  html+='</tr></thead><tbody>';
  G.staff.forEach(p=>{
    html+='<tr><td class="name">'+p.name+'</td>';
    cols.forEach(c=>{
      const val=getShiftCode(wk,c.idx,p.id,c.servizio)||'';
      const u=val.toUpperCase();
      let cls='';
      if(u==='OFF'||u==='FERIE'||u==='MALATTIA')cls='off';
      else if(u[0]==='B')cls='b';else if(u[0]==='D')cls='d';else if(u[0]==='M')cls='m';else if(u[0]==='A')cls='a';else if(u[0]==='E')cls='e';
      html+='<td class="'+cls+'">'+val+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table><h1>Giornaliero per fascia</h1>';
  days.forEach(d=>{
    const tipo=d.tipo;
    const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
    const fasce=fasciaIdxs.map(i=>fascia(i)).filter(Boolean);
    const dateStr=weekDates?' '+weekDates[d.idx].getDate():'';
    html+='<h2>'+d.name+dateStr+'</h2><table><thead><tr><th class="name">Staff</th>';
    fasce.forEach(f=>{html+='<th>'+f.label+'</th>';});
    html+='<th>Turno</th></tr></thead><tbody>';
    G.staff.forEach(p=>{
      const hasAny=fasce.some(f=>personInFascia(wk,d.idx,p.id,f,tipo));
      if(!hasAny)return;
      html+='<tr><td class="name">'+p.name+'</td>';
      fasce.forEach(f=>{
        const working=personInFascia(wk,d.idx,p.id,f,tipo);
        if(!working){html+='<td style="color:#ccc;">&mdash;</td>';}
        else{const key=d.idx+'_'+f.id+'_'+p.id;const role=wk.role_assign[key]||'';html+='<td>'+role+'</td>';}
      });
      const cp=tipo==='pranzo_cena'?getShiftCode(wk,d.idx,p.id,'pranzo'):'';
      const cc=tipo==='pranzo_cena'?getShiftCode(wk,d.idx,p.id,'cena'):getShiftCode(wk,d.idx,p.id,null);
      const turno=tipo==='pranzo_cena'?(cp&&cc?cp+'/'+cc:cp||cc):cc;
      html+='<td><b>'+(turno||'')+'</b></td></tr>';
    });
    html+='</tbody></table>';
  });
  html+='</body></html>';
  const win=window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(function(){win.print();},600);
}

    const {data}=await sb.from('staff').select('id,name,role,reparto,attivo,created_at,disabled_at').eq('attivo',false).order('name');
    if(!data||!data.length){
      el.innerHTML='<p style="font-size:12px;color:var(--text3);">Nessun operatore archiviato.</p>';
      return;
    }
    const fmtDate=d=>d?new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
    let html=`<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
      <label style="font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="seleziona-tutti-archiviati" onchange="selezionaTuttiArchiviati(this.checked)">

      </label>
      <button class="btn success" style="font-size:11px;padding:4px 12px;" onclick="riattivaSelezionati()">↩ Riattiva selezionati</button>

        <input type="checkbox" class="archiviato-cb" value="${p.id}" style="width:16px;height:16px;cursor:pointer;">

          <span style="font-size:10px;color:var(--text3);padding:2px 8px;background:var(--bg3);border-radius:20px;margin-left:6px;">${p.reparto||'sala'}</span>
        </div>
        <div style="font-size:10px;color:var(--text3);text-align:right;line-height:1.6;">

}
function selezionaTuttiArchiviati(checked){
  document.querySelectorAll('.archiviato-cb').forEach(cb=>cb.checked=checked);
}
async function riattivaSelezionati(){
  const ids=[...document.querySelectorAll('.archiviato-cb:checked')].map(cb=>cb.value);
  if(!ids.length){alert('Seleziona almeno una persona.');return;}
  if(!confirm('Riattivare '+ids.length+' persone?'))return;
  try{
    await sb.from('staff').update({attivo:true,disabled_at:null}).in('id',ids);
    ids.forEach(id=>{
      const inAll=G.allStaff.find(s=>s.id===id);
      if(inAll){inAll.attivo=true;inAll.disabled_at=null;}
    });
    applyReparto();
    renderStaffArchiviato();
    alert('Persone riattivate! Ricarica la pagina per vederle nei turni.');
  }catch(e){alert('Errore durante la riattivazione.');}
}
async function riattivaStaff(id,name){
  if(!confirm('Riattivare '+name+'? Tornerà visibile nella lista staff e nei turni.'))return;
  try{
    await sb.from('staff').update({attivo:true,disabled_at:null}).eq('id',id);
    // Also update in memory if present
    const inAll=G.allStaff.find(s=>s.id===id);
    if(inAll){inAll.attivo=true;applyReparto();}
    renderStaffArchiviato();
    alert(name+' riattivato! Ricarica la pagina per vederlo nei turni.');
  }catch(e){alert('Errore durante la riattivazione.');}
}
function openCompare(){
  const panel=document.getElementById('compare-panel');
  const overlay=document.getElementById('compare-overlay');
  const sel=document.getElementById('compare-week-sel');
  if(!panel)return;
  // Populate selector with all weeks except current
  const wk=curWeek();
  sel.innerHTML=G.weeks
    .filter(w=>w.id!==wk?.id)
    .map(w=>`<option value="${w.id}">${w.name}</option>`)
    .join('');
  panel.classList.add('open');
  overlay.classList.add('open');
  loadCompare();
}
function closeCompare(){
  document.getElementById('compare-panel')?.classList.remove('open');
  document.getElementById('compare-overlay')?.classList.remove('open');
}
function loadCompare(){
  const sel=document.getElementById('compare-week-sel');
  const body=document.getElementById('compare-body');
  if(!sel||!body)return;
  const wkId=sel.value;
  const wk=G.weeks.find(w=>w.id===wkId);
  if(!wk){body.innerHTML='<p style="color:var(--text3);font-size:12px;">Settimana non trovata.</p>';return;}
  const days=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  const weekDates=getWeekDates(wk);
  // Build read-only grid
  let cols=[];
  days.forEach(d=>{
    const dateStr=weekDates?weekDates[d.idx].getDate():'';
    const label=dateStr?`${d.name} ${dateStr}`:d.name;
    if(d.tipo==='pranzo_cena'){
      cols.push({...d,label,servizio:'pranzo',colLabel:'P'});
      cols.push({...d,label,servizio:'cena',colLabel:'C'});
    } else {
      cols.push({...d,label,servizio:null,colLabel:null});
    }
  });
  let h=`<p style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;">${wk.name}</p>`;
  h+='<div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:11px;width:100%;">';
  h+='<thead><tr><th style="text-align:left;padding:3px 6px;background:var(--bg3);border:0.5px solid var(--border);min-width:80px;position:sticky;left:0;">Staff</th>';
  // Day headers
  let lastDi=-1;
  cols.forEach(c=>{
    if(c.idx===lastDi)return;lastDi=c.idx;
    const span=c.tipo==='pranzo_cena'?2:1;
    const bg=c.tipo==='pranzo_cena'?'#fff8dd':'var(--bg3)';
    const col=c.tipo==='pranzo_cena'?'#7a5c00':'var(--text)';
    h+=`<th colspan="${span}" style="background:${bg};color:${col};padding:3px 5px;border:0.5px solid var(--border);white-space:nowrap;font-size:10px;">${c.label}</th>`;
  });
  h+='</tr>';
  if(cols.some(c=>c.colLabel)){
    h+='<tr><th style="background:var(--bg3);border:0.5px solid var(--border);"></th>';
    cols.forEach(c=>{
      if(c.tipo==='pranzo_cena'){
        const bg=c.servizio==='pranzo'?'#fff8dd':'#ddeeff';
        const col=c.servizio==='pranzo'?'#7a5c00':'#0a3d6e';
        h+=`<th style="background:${bg};color:${col};font-size:9px;padding:2px 4px;border:0.5px solid var(--border);">${c.colLabel}</th>`;
      } else {
        h+='<th style="background:var(--bg3);border:0.5px solid var(--border);"></th>';
      }
    });
    h+='</tr>';
  }
  h+='</thead><tbody>';
  G.staff.forEach(p=>{
    h+=`<tr><td style="text-align:left;padding:3px 6px;border:0.5px solid var(--border);background:#fff;position:sticky;left:0;font-size:11px;white-space:nowrap;">${p.name}</td>`;
    cols.forEach(c=>{
      const val=getShiftCode(wk,c.idx,p.id,c.servizio);
      const cs=val?shiftColorStyle(val):'';
      h+=`<td style="padding:3px 5px;border:0.5px solid var(--border);text-align:center;font-size:10px;font-weight:${val?'600':'400'};${cs}">${val||''}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  body.innerHTML=h;
}

function renderAll(){
  renderWeekSelector();renderDepWeekSelector();renderLegSidebar();renderTurni();renderDayNav();
  if(isManager()){renderStaff();renderLegenda();renderConfig();renderFabbisogno();renderEquivalenze();renderRegole();renderRoleRules();renderPosRules();renderManagers();}
  showDraftPanel();
}

function renderLoginManagers(){
  const sel=document.getElementById('manager-select');if(!sel)return;
  if(G.managers&&G.managers.length){
    sel.innerHTML='<option value="">— Seleziona manager —</option>'+
      G.managers.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  }
}

async function init(){
  const ok=await dbLoad();
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app').style.display='block';
  if(!ok){document.getElementById('app').innerHTML='<div style="padding:2rem;text-align:center;"><p style="font-size:16px;font-weight:500;color:var(--red-text);">Errore di connessione.</p></div>';return;}
  renderLogin();
  renderLoginManagers();
}
init();
</script>
