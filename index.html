async function dbLoad(){
  try{
    const {data:cfg}=await sb.from('config').select('*');
    if(cfg){cfg.forEach(r=>{
      if(r.key==='managerPwd')G.managerPwd=r.value;
      if(r.key==='currentWeekId')G.currentWeekId=r.value;
      if(r.key==='fabbisogno')try{G.fabbisogno=JSON.parse(r.value);}catch(e){}
      if(r.key==='equivalenze')try{G.equivalenze=JSON.parse(r.value);}catch(e){}
      if(r.key==='regole')try{G.regole=JSON.parse(r.value);}catch(e){}
      if(r.key==='roleRules')try{G.roleRules=JSON.parse(r.value);}catch(e){}
      if(r.key==='posRules')try{G.posRules=JSON.parse(r.value);}catch(e){}
    });}
    const {data:staff}=await sb.from('staff').select('*');
    G.staff=(staff||[]).map(s=>({...s,canDo:s.canDo||[],offRequests:s.offRequests||[],workDaysPerWeek:s.workDaysPerWeek||5,accessCode:s.accessCode||'',preferredRoles:s.preferredRoles||{},secondaryRoles:s.secondaryRoles||{},sort_order:s.sort_order??999})).sort((a,b)=>a.sort_order-b.sort_order);
    const {data:shifts}=await sb.from('shifts').select('*');
    if(shifts&&shifts.length>0){G.shifts=shifts.map(s=>({...s,fasce:s.fasce||[],compatibleRoles:s.compatibleRoles||[],sort_order:s.sort_order??999})).sort((a,b)=>a.sort_order-b.sort_order);}
    else{G.shifts=JSON.parse(JSON.stringify(DEF_SHIFTS));await dbSaveShifts();}
    const {data:weeks}=await sb.from('weeks').select('*');
    G.weeks=(weeks||[]).map(w=>({...w,day_config:w.day_config||['cena','cena','cena','cena','cena','cena','cena'],shift_assign:w.shift_assign||{},role_assign:w.role_assign||{},selected_day:w.selected_day||0,startDate:w.startDate||'',draft_assign:w.draft_assign||null,draft_role_assign:w.draft_role_assign||null,last_saved:w.last_saved||null}));
    console.log('Loaded weeks from Supabase:', G.weeks.map(w=>({name:w.name,last_saved:w.last_saved,days:Object.keys(w.shift_assign).length})));
    if(!G.weeks.length){const w=emptyWeek('Prima settimana');G.weeks=[w];await sb.from('weeks').insert(weekToDb(w));}
    if(!G.currentWeekId||!G.weeks.find(w=>w.id===G.currentWeekId)){G.currentWeekId=G.weeks[0].id;await sb.from('config').upsert({key:'currentWeekId',value:G.currentWeekId});}
    const {data:managers}=await sb.from('managers').select('*');
    G.managers=managers||[];
    migrateFabbisogno();
    setSyncStatus('ok');return true;
  }catch(e){console.error(e);setSyncStatus('err');return false;}
}
function migrateFabbisogno(){
  // Ensure all fabbisogno keys are strings (old code used numeric keys)
  const newFab={};
  Object.keys(G.fabbisogno).forEach(k=>{newFab[String(k)]=G.fabbisogno[k];});
  G.fabbisogno=newFab;
}
function weekToDb(w){
  const obj={
    id:w.id,
    name:w.name,
    published:w.published||false,
    day_config:w.day_config||['cena','cena','cena','cena','cena','cena','cena'],
    shift_assign:w.shift_assign||{},
    role_assign:w.role_assign||{},
    selected_day:w.selected_day||0,
    startDate:w.startDate||'',
    last_saved:new Date().toISOString(),
    last_saved_by:currentManager?currentManager.name:''
  };
  if(w.draft_assign)obj.draft_assign=w.draft_assign;
  if(w.draft_role_assign)obj.draft_role_assign=w.draft_role_assign;
  return obj;
}
async function dbSaveWeek(w){
  try{
    // Check for conflicts: if server has a newer version, warn before overwriting
    const {data:serverData}=await sb.from('weeks').select('last_saved').eq('id',w.id).single();
    if(serverData&&serverData.last_saved&&w.last_saved){
      const serverTime=new Date(serverData.last_saved).getTime();
      const localTime=new Date(w.last_saved).getTime();
      if(serverTime>localTime+5000){// server is more than 5 seconds newer
        const serverTimeStr=new Date(serverData.last_saved).toLocaleString('it-IT');
        const ok=confirm(`⚠️ Attenzione: qualcun altro ha salvato questa settimana alle ${serverTimeStr}.\n\nSe continui sovrascriverai le loro modifiche.\n\nVuoi sovrascrivere?`);
        if(!ok){setSyncStatus('err');return;}
      }
    }
    const data=weekToDb(w);
    const ts=data.last_saved;
    const roleCount=Object.keys(data.role_assign||{}).filter(k=>data.role_assign[k]).length;
    const shiftDays=Object.keys(data.shift_assign||{}).length;
    console.log('Saving week:', w.id, '| giorni turni:', shiftDays, '| ruoli:', roleCount, '| by:', data.last_saved_by);
    const {error}=await sb.from('weeks').upsert(data);
    if(error){
      console.error('dbSaveWeek error:',error);
      setSyncStatus('err');
    } else {
      console.log('Week saved OK — turni:', shiftDays, 'ruoli:', roleCount);
      w.last_saved=ts;
      setSyncStatus('ok');
    }
  }catch(e){console.error('dbSaveWeek exception:',e);setSyncStatus('err');}
}
async function dbSaveShifts(){
  try{
    if(G.shifts.length){
      const shiftsWithOrder=G.shifts.map((s,i)=>({...s,sort_order:i}));
      await sb.from('shifts').upsert(shiftsWithOrder,{onConflict:'code'});
      const codes=G.shifts.map(s=>s.code);
      await sb.from('shifts').delete().not('code','in',`(${codes.map(c=>`"${c}"`).join(',')})`);
    } else {
      await sb.from('shifts').delete().neq('code','__none__');
    }
    setSyncStatus('ok');
  }catch(e){console.error('dbSaveShifts error:',e);setSyncStatus('err');}
}
async function dbSaveStaff(){
  try{
    if(G.staff.length){
      const rows=G.staff.map((s,i)=>({id:s.id,name:s.name,role:s.role,canDo:s.canDo||[],offRequests:s.offRequests||[],workDaysPerWeek:s.workDaysPerWeek||5,accessCode:s.accessCode||'',preferredRoles:s.preferredRoles||{},secondaryRoles:s.secondaryRoles||{},sort_order:i}));
      // Upsert: update if exists, insert if not — never deletes
      await sb.from('staff').upsert(rows,{onConflict:'id'});
      // Remove staff that no longer exist
      const ids=G.staff.map(s=>s.id);
      await sb.from('staff').delete().not('id','in',`(${ids.map(id=>`"${id}"`).join(',')})`);
    } else {
      await sb.from('staff').delete().neq('id','__none__');
    }
    setSyncStatus('ok');
  }catch(e){console.error('dbSaveStaff error:',e);setSyncStatus('err');}
}

function setSyncStatus(s){syncStatus=s;const el=document.getElementById('sync-status');if(el){el.textContent=s==='ok'?'● Sincronizzato':'● Errore';el.className='sync-status '+(s==='ok'?'ok':'err');}}
function emptyWeek(name){return{id:'w'+Date.now()+Math.random().toString(36).slice(2,6),name:name||'Nuova settimana',published:false,day_config:['cena','cena','cena','cena','cena','cena','cena'],shift_assign:{},role_assign:{},selected_day:0};}
function curWeek(){return G.weeks.find(w=>w.id===G.currentWeekId)||G.weeks[0];}
function getShift(code){return G.shifts.find(s=>s.code===code)||null;}
function isFuoriServizio(code){if(!code)return true;const u=code.toUpperCase();if(u==='MALATTIA')return true;const s=getShift(code);return !s||s.is_off||s.is_ferie;}
function shiftInFascia(code,fid){if(isFuoriServizio(code))return false;const s=getShift(code);if(!s)return false;return s.fasce&&s.fasce.includes(fid);}
const isManager=()=>role==='manager';
function getVisibleWeeks(){return isManager()?G.weeks:G.weeks.filter(w=>w.published);}
function getDepWeek(){const vw=getVisibleWeeks();return vw.find(w=>w.id===G.currentWeekId)||vw[0]||null;}

// ===== DATE HELPERS =====
const MONTHS_IT=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function mondayOfWeek(dateStr){
  // Parse date parts directly to avoid timezone shifting
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);// local time, no timezone shift
  const day=dt.getDay();
  const diff=(day===0)?-6:1-day;
  dt.setDate(dt.getDate()+diff);
  return dt;
}
function weekNameFromMonday(mon){
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const d1=mon.getDate();const d2=sun.getDate();
  const m1=MONTHS_IT[mon.getMonth()];const m2=MONTHS_IT[sun.getMonth()];
  const y=sun.getFullYear();
  if(mon.getMonth()===sun.getMonth())return`${d1}–${d2} ${m1} ${y}`;
  return`${d1} ${m1} – ${d2} ${m2} ${y}`;
}
function updateWeekNameFromDate(){
  const dateEl=document.getElementById('new-week-date');
  const nameEl=document.getElementById('new-week-name');
  if(!dateEl||!dateEl.value)return;
  const mon=mondayOfWeek(dateEl.value);
  nameEl.value=weekNameFromMonday(mon);
}
// Returns array of 7 date strings (Mon-Sun) for a week given its name/startDate stored in week
function getWeekDates(w){
  if(!w.startDate)return null;
  try{
    const parts=w.startDate.split('-');
    const y=parseInt(parts[0]),m=parseInt(parts[1])-1,d=parseInt(parts[2]);
    return Array.from({length:7},(_,i)=>new Date(y,m,d+i));
  }catch(e){return null;}
}

async function createWeek(dup){
  const dateEl=document.getElementById('new-week-date');
  const nameEl=document.getElementById('new-week-name');
  let startDate='';
  let name='';
  if(dateEl&&dateEl.value){
    const mon=mondayOfWeek(dateEl.value);
    // Format as YYYY-MM-DD in local time (avoid UTC shift)
    const y=mon.getFullYear();
    const m=String(mon.getMonth()+1).padStart(2,'0');
    const d=String(mon.getDate()).padStart(2,'0');
    startDate=`${y}-${m}-${d}`;
    name=nameEl&&nameEl.value.trim()?nameEl.value.trim():weekNameFromMonday(mon);
  } else {
    name=(nameEl&&nameEl.value.trim())||'Nuova settimana';
  }
  // Auto-version if name already exists
  const baseName=name;
  let ver=0;
  while(G.weeks.find(w=>w.name===name)){ver++;name=`${baseName} (${ver})`;}
  let w=emptyWeek(name);
  w.startDate=startDate;
  if(dup){const c=curWeek();w.day_config=JSON.parse(JSON.stringify(c.day_config));w.shift_assign=JSON.parse(JSON.stringify(c.shift_assign));w.role_assign=JSON.parse(JSON.stringify(c.role_assign));}
  G.weeks.push(w);G.currentWeekId=w.id;
  if(dateEl)dateEl.value='';
  if(nameEl)nameEl.value='';
  await sb.from('weeks').insert(weekToDb(w));await dbSaveConfig('currentWeekId',w.id);
  renderWeekSelector();renderWeekList();renderTurni();
}

let weekListOrder=null;// manual order (array of ids), null = auto chronological
function getWeeksSorted(){
  if(weekListOrder&&weekListOrder.length){
    // Manual order: sort by weekListOrder, append any new weeks at end
    const ordered=[];
    weekListOrder.forEach(id=>{const w=G.weeks.find(w=>w.id===id);if(w)ordered.push(w);});
    G.weeks.forEach(w=>{if(!ordered.find(o=>o.id===w.id))ordered.push(w);});
    return ordered;
  }
  // Default: chronological descending by startDate, then by creation order
  return [...G.weeks].sort((a,b)=>{
    if(a.startDate&&b.startDate)return b.startDate.localeCompare(a.startDate);
    if(a.startDate)return -1;if(b.startDate)return 1;
    return 0;
  });
}
let weekDragSrc=null;
function weekDragStart(e,id){weekDragSrc=id;}
function weekDragOver(e){e.preventDefault();}
function weekDrop(e,id){
  e.preventDefault();if(!weekDragSrc||weekDragSrc===id)return;
  const sorted=getWeeksSorted();
  const fromIdx=sorted.findIndex(w=>w.id===weekDragSrc);
  const toIdx=sorted.findIndex(w=>w.id===id);
  if(fromIdx<0||toIdx<0)return;
  const moved=sorted.splice(fromIdx,1)[0];
  sorted.splice(toIdx,0,moved);
  weekListOrder=sorted.map(w=>w.id);
  weekDragSrc=null;
  renderWeekList();
}
function renderWeekList(){

  document.getElementById('week-list').innerHTML=sorted.map((w,i)=>`
    <div class="week-item ${w.id===G.currentWeekId?'current':''}" draggable="true"
      ondragstart="weekDragStart(event,'${w.id}')" ondragover="weekDragOver(event)" ondrop="weekDrop(event,'${w.id}')">

        <button class="btn warn" onclick="dupWeekFrom('${w.id}')">Duplica</button>

let undoStack=[];
function pushUndo(wk){
  undoStack.push({wkId:wk.id,shift_assign:JSON.parse(JSON.stringify(wk.shift_assign)),role_assign:JSON.parse(JSON.stringify(wk.role_assign))});
  if(undoStack.length>20)undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){alert('Nessuna modifica da annullare.');return;}
  const wk=curWeek();
  const snap=undoStack[undoStack.length-1];
  if(snap.wkId!==wk.id){alert('Nessuna modifica disponibile per questa settimana.');undoStack=[];return;}
  undoStack.pop();
  wk.shift_assign=snap.shift_assign;
  wk.role_assign=snap.role_assign;
  markDirty();renderTurni();renderDayContent();
}

// Helper: get shift code considering P+C split
// servizio: 'pranzo'|'cena'|null
function getShiftCode(wk,di,pid,servizio){
  const d=wk.shift_assign[di]||{};
  if(servizio==='pranzo') return d[pid+'_P']||'';
  if(servizio==='cena') return d[pid+'_C']||'';
  return d[pid]||'';
}

// Returns true if person is working in a given fascia
function personInFascia(wk,di,pid,fasciaObj,tipo){
  if(tipo==='pranzo_cena'){
    const cp=getShiftCode(wk,di,pid,'pranzo');
    const cc=getShiftCode(wk,di,pid,'cena');
    if(fasciaObj.tipo==='pranzo') return shiftInFascia(cp,fasciaObj.id)||shiftInFascia(cc,fasciaObj.id);
    if(fasciaObj.tipo==='cena') return shiftInFascia(cc,fasciaObj.id)||shiftInFascia(cp,fasciaObj.id);
    return false;
  } else {
    return shiftInFascia(getShiftCode(wk,di,pid,null),fasciaObj.id);
  }
}

  const weekDates=getWeekDates(wk);
  // Build columns

  days.forEach(d=>{
    const dateStr=weekDates?weekDates[d.idx].getDate():'';

    if(d.tipo==='pranzo_cena'){

  });
  h+='</tr>';
  // Row 2: Pranzo/Cena sub-headers
  h+='<tr><th class="scol"></th>';

    } else {
      h+='<th style="background:var(--bg3);padding:3px 6px;"></th>';
    }
  });
  h+='</tr></thead><tbody>';
  G.staff.forEach(p=>{
    const extra=isExtra(p);
    h+=`<tr><td class="scol">${p.name}${isManager()&&p.role?`<br><span style="font-size:10px;font-weight:400;color:var(--text2);">${p.role}</span>`:''}${isManager()&&!extra?` <br><span style="font-size:10px;color:var(--text3);">${p.workDaysPerWeek||5}gg/sett</span>`:''}</td>`;
    cols.forEach(c=>{
      const val=getShiftCode(wk,c.idx,p.id,c.servizio);
      const cs=val?shiftColorStyle(val):'';
      const hasOffReq=!extra&&c.servizio!=='cena'&&(p.offRequests||[]).includes(c.idx);
      const sKey=c.servizio==='pranzo'?`${c.idx},'${p.id}','pranzo'`:c.servizio==='cena'?`${c.idx},'${p.id}','cena'`:`${c.idx},'${p.id}',null`;
      if(isManager()){
        h+=`<td class="shift-cell" style="${cs}${!val&&hasOffReq?'background:#fff8dd;':''}" title="${hasOffReq?'Richiesta giorno libero':''}">
          <select onchange="setShift(${sKey},this.value)" style="width:66px;font-size:11px;padding:2px 3px;border:none;background:transparent;color:${val?'#fff':'var(--text)'};font-family:inherit;font-weight:${val?'600':'400'};">
            <option value="" style="background:#fff;color:#1a1a1a;"></option>
            ${G.shifts.map(sh=>`<option value="${sh.code}" style="background:#fff;color:#1a1a1a;"${sh.code===val?' selected':''}>${sh.code}</option>`).join('')}
          </select></td>`;
      } else {
        h+=`<td class="shift-cell-ro" style="${cs}">${val}</td>`;
      }
    });
    h+='</tr>';
  });
  if(isManager()){
    h+='<tr class="count-row"><td class="scol" style="background:var(--bg3);">N. operatori</td>';
    cols.forEach(c=>{
      const n=G.staff.filter(p=>{const code=getShiftCode(wk,c.idx,p.id,c.servizio);return code&&!isFuoriServizio(code);}).length;
      h+=`<td>${n||''}</td>`;
    });
    h+='</tr>';
  }
  h+='</tbody></table>';
  wrap.innerHTML=h;
}
let shiftTimer=null;
function setShift(di,pid,servizio,val){
  const wk=curWeek();pushUndo(wk);
  if(!wk.shift_assign[di])wk.shift_assign[di]={};
  const key=servizio==='pranzo'?pid+'_P':servizio==='cena'?pid+'_C':pid;
  wk.shift_assign[di][key]=val;
  if(wk.role_assign){
    Object.keys(wk.role_assign).forEach(k=>{
      const parts=k.split('_');
      if(parts.length===3&&parts[0]==String(di)&&parts[2]===pid) delete wk.role_assign[k];
    });
  }
  markDirty();
  renderTurni();
}

// ===== GIORNALIERO =====
function renderDayNav(){
  const wk=isManager()?curWeek():getDepWeek();
  if(!wk){document.getElementById('day-nav').innerHTML='';document.getElementById('day-content').innerHTML='<p style="color:var(--text2);padding:1rem;">Nessuna settimana disponibile.</p>';return;}
  const days=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  if(!days.find(d=>d.idx===wk.selected_day))wk.selected_day=days[0]?.idx||0;
  document.getElementById('day-nav').innerHTML=days.map(d=>`
    <button class="day-btn ${d.tipo==='pranzo_cena'?'pc':''} ${d.idx===wk.selected_day?'active':''}" onclick="selDay(${d.idx})">${d.name}</button>`).join('');
  renderDayContent();
}
async function selDay(i){const wk=isManager()?curWeek():getDepWeek();if(!wk)return;wk.selected_day=i;renderDayNav();}

function renderDayContent(){
  const wk=isManager()?curWeek():getDepWeek();if(!wk)return;
  const di=wk.selected_day;const tipo=wk.day_config[di];
  const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
  const fasce=fasciaIdxs.map(i=>ALL_FASCE[i]);
  function fHead(f){const cls=f.tipo==='pranzo'?'fp':'fc';return`<th class="${cls}">${f.label}<br><span style="font-size:10px;font-weight:400;">${f.orario}</span></th>`;}
  let h=`<p style="font-size:14px;font-weight:500;margin-bottom:.75rem;">${DAY_NAMES[di]}</p>`;
  h+='<div class="wrap"><table><thead><tr><th class="scol"></th>';
  fasce.forEach(f=>{h+=fHead(f);});
  if(tipo==='pranzo_cena'){
    h+='<th style="background:#fff8dd;color:#7a5c00;font-size:11px;padding:5px 8px;min-width:60px;">PRANZO</th>';
    h+='<th style="background:#ddeeff;color:#0a3d6e;font-size:11px;padding:5px 8px;min-width:60px;">CENA</th>';
  } else {
    h+='<th style="background:var(--bg3);font-size:11px;padding:5px 8px;min-width:60px;">TURNO</th>';
  }
  h+='<th style="background:var(--bg3);font-size:11px;padding:5px 8px;min-width:110px;">ORARI</th>';
  h+='</tr></thead><tbody>';
  G.staff.forEach(p=>{
    const cp=tipo==='pranzo_cena'?getShiftCode(wk,di,p.id,'pranzo'):'';
    const cc=tipo==='pranzo_cena'?getShiftCode(wk,di,p.id,'cena'):getShiftCode(wk,di,p.id,null);
    h+=`<tr><td class="scol" style="font-size:12px;">${p.name}${isManager()&&isExtra(p)?'<span class="extra-badge">Extra</span>':''}</td>`;
    fasce.forEach(f=>{
      const working=personInFascia(wk,di,p.id,f,tipo);
      if(!working){h+=`<td class="xc">X</td>`;}
      else{
        const key=`${di}_${f.id}_${p.id}`;const val=(wk.role_assign[key])||'';
        if(isManager()){h+=`<td class="rc"><select onchange="setRole('${key}',this.value)"><option value=""></option>${ROLES.map(r=>`<option value="${r}"${r===val?' selected':''}>${r}</option>`).join('')}</select></td>`;}
        else{h+=`<td class="rc-ro">${val}</td>`;}
      }
    });
    if(tipo==='pranzo_cena'){
      h+=`<td style="padding:4px 8px;font-size:11px;font-weight:600;${cp?shiftColorStyle(cp):''}">${cp}</td>`;
      h+=`<td style="padding:4px 8px;font-size:11px;font-weight:600;${cc?shiftColorStyle(cc):''}">${cc}</td>`;
      const pts=[];
      const sp=getShift(cp);const sc=getShift(cc);
      if(sp&&!sp.is_off&&!sp.is_ferie){if(sp.s1&&sp.e1)pts.push(`${sp.s1}-${sp.e1}`);}
      if(sc&&!sc.is_off&&!sc.is_ferie){if(sc.s2&&sc.e2)pts.push(`${sc.s2}-${sc.e2}`);}
      h+=`<td style="padding:4px 8px;font-size:11px;color:var(--text2);">${pts.join(' / ')}</td>`;
    } else {
      const s=getShift(cc);
      let oLabel='';if(s&&!s.is_off&&!s.is_ferie){const pts=[];if(s.s1&&s.e1)pts.push(`${s.s1}-${s.e1}`);if(s.s2&&s.e2)pts.push(`${s.s2}-${s.e2}`);oLabel=pts.join(' / ');}
      h+=`<td style="padding:4px 8px;font-size:11px;font-weight:600;${cc?shiftColorStyle(cc):''}">${cc}</td>`;
      h+=`<td style="padding:4px 8px;font-size:11px;color:var(--text2);">${oLabel}</td>`;
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  h+='<p class="sec-label" style="margin-top:1.25rem;">Riepilogo ruoli per fascia</p>';
  h+='<div class="wrap"><table><thead><tr><th class="scol" style="min-width:130px;background:var(--bg3);"></th>';
  fasce.forEach(f=>{h+=fHead(f);});
  h+='</tr></thead><tbody>';
  ROLES.forEach(r=>{
    h+=`<tr><td class="role-name-td">${r}</td>`;
    fasce.forEach(f=>{
      const names=G.staff.filter(p=>{
        const key=`${di}_${f.id}_${p.id}`;
        if((wk.role_assign[key])!==r)return false;
        return personInFascia(wk,di,p.id,f,tipo);
      }).map(p=>p.name);
      h+=`<td class="auto-td">${names.join(', ')}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('day-content').innerHTML=h;
  if(isManager())updateIncompleteAlert();
}
function setRole(key,val){
  const wk=curWeek();pushUndo(wk);
  wk.role_assign[key]=val;
  markDirty();
  renderDayContent();
}

// ===== STAFF =====
async function addStaff(){
  const n=document.getElementById('sname').value.trim();if(!n)return;
  G.staff.push({id:'s'+Date.now(),name:n,role:document.getElementById('srole').value.trim(),canDo:[],offRequests:[],workDaysPerWeek:5,accessCode:''});
  document.getElementById('sname').value='';document.getElementById('srole').value='';
  await dbSaveStaff();renderStaff();
}
async function removeStaff(id){
  if(!confirm('Rimuovere questo dipendente?'))return;
  G.staff=G.staff.filter(s=>s.id!==id);
  if(selectedStaffId===id)selectedStaffId=null;
  await dbSaveStaff();renderStaff();
}
function renderStaff(){
  const el=document.getElementById('staff-list');if(!el)return;
  if(!G.staff.length){el.innerHTML='<p style="color:var(--text2);font-size:12px;">Nessun dipendente.</p>';return;}
  let html='';
  G.staff.forEach((p,i)=>{
    const extra=isExtra(p);
    html+=`<div class="staff-row ${selectedStaffId===p.id?'drag-over':''}" draggable="true" data-idx="${i}"
      ondragstart="dragStart(event,${i})" ondragover="dragOver(event,${i})" ondrop="dragDrop(event,${i})" ondragend="dragEnd()"
      onclick="selectStaff('${p.id}')">
      <span class="drag-handle">⠿</span>
      <span style="font-weight:500;flex:1;">${p.name}</span>
      ${p.role?`<span style="color:var(--text2);font-size:11px;">${p.role}</span>`:''}
      ${extra?'<span class="extra-badge">Extra</span>':`<span style="font-size:10px;color:var(--text3);">${p.workDaysPerWeek||5}gg/sett</span>`}
      <button class="btn danger" style="font-size:11px;padding:3px 8px;" onclick="event.stopPropagation();removeStaff('${p.id}')">Rimuovi</button>
    </div>`;
    if(selectedStaffId===p.id){
      html+='<div id="staff-detail-inline" style="margin:0 0 8px 0;"></div>';
    }
  });
  el.innerHTML=html;
  const old=document.getElementById('staff-detail-panel');if(old)old.innerHTML='';
  renderStaffDetail();
}
function selectStaff(id){selectedStaffId=selectedStaffId===id?null:id;renderStaff();}

    <div class="staff-detail">

          <label style="font-size:11px;color:var(--text2);">Nome</label>

        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <label style="font-size:11px;color:var(--text2);">Ruolo (scrivi EXTRA per gli extra)</label>
          <input type="text" value="${p.role||''}" id="edit-role-${p.id}" style="padding:6px 9px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:13px;width:200px;">
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <label style="font-size:11px;color:var(--text2);">Codice accesso dipendente</label>
          <input type="text" value="${p.accessCode||''}" id="edit-code-${p.id}" placeholder="es. 1234 o vuoto = bloccato" style="padding:6px 9px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:13px;width:180px;">
        </div>
        <button class="btn primary" onclick="saveStaffInfo('${p.id}')">Salva nome/ruolo</button>
      </div>
      ${extra?`<p style="font-size:12px;color:var(--text2);padding:8px 12px;background:var(--yellow-bg);border-radius:var(--radius);border:0.5px solid var(--yellow-border);">Ruolo EXTRA — ignorato dalla bozza automatica.</p>`:`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem;margin-top:0.5rem;">
        <label style="font-size:12px;font-weight:500;color:var(--text2);">Giorni lavorativi a settimana:</label>
        <input type="number" min="1" max="7" value="${p.workDaysPerWeek||5}" onchange="setWorkDays('${p.id}',this.value)" style="width:60px;padding:5px 8px;border-radius:var(--radius);border:0.5px solid var(--border2);font-family:inherit;font-size:13px;">
      </div>
      <p style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;">Turni che può fare</p>
      <div class="cb-grid">
        ${workShifts.map(s=>{const checked=(p.canDo||[]).includes(s.code);return`<label class="cb-pill ${checked?'checked':''}" style="${checked?shiftColorStyle(s.code):''}"><input type="checkbox" style="display:none;" ${checked?'checked':''} onchange="toggleCanDo('${p.id}','${s.code}',this.checked)">${s.code}</label>`;}).join('')}
      </div>
      <p style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;margin-top:12px;">Giorni liberi preferiti (non tassativi)</p>
      <div class="day-check-grid">
        ${DAY_NAMES.map((n,i)=>{const checked=(p.offRequests||[]).includes(i);return`<label class="cb-pill ${checked?'checked':''}"><input type="checkbox" ${checked?'checked':''} onchange="toggleOffReq('${p.id}',${i},this.checked)">${n}</label>`;}).join('')}
      </div>
      <p style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;margin-top:12px;">Ruolo preferito per fascia</p>
      <div class="pref-roles-grid">
        ${ALL_FASCE.map(f=>{const pref=(p.preferredRoles||{})[String(f.id)]||'';return`<div class="pref-role-item"><label>${f.label}</label><select onchange="setPrefRole('${p.id}',${f.id},'pref',this.value)"><option value="">— nessuno —</option>${ROLES.map(r=>'<option value="'+r+'"'+(r===pref?' selected':'')+'>'+r+'</option>').join('')}</select></div>`;}).join('')}
      </div>
      <p style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;margin-top:8px;">Ruolo secondario per fascia (se il preferito è già coperto)</p>
      <div class="pref-roles-grid">
        ${ALL_FASCE.map(f=>{const sec=(p.secondaryRoles||{})[String(f.id)]||'';return`<div class="pref-role-item"><label>${f.label}</label><select onchange="setPrefRole('${p.id}',${f.id},'sec',this.value)"><option value="">— nessuno —</option>${ROLES.map(r=>'<option value="'+r+'"'+(r===sec?' selected':'')+'>'+r+'</option>').join('')}</select></div>`;}).join('')}

}
async function saveStaffInfo(pid){
  const p=G.staff.find(s=>s.id===pid);if(!p)return;
  const nameEl=document.getElementById('edit-name-'+pid);
  const roleEl=document.getElementById('edit-role-'+pid);
  const codeEl=document.getElementById('edit-code-'+pid);
  if(nameEl&&nameEl.value.trim())p.name=nameEl.value.trim();
  if(roleEl)p.role=roleEl.value.trim();
  if(codeEl)p.accessCode=codeEl.value.trim();
  await dbSaveStaff();renderStaff();
}
async function setWorkDays(pid,val){const p=G.staff.find(s=>s.id===pid);if(!p)return;p.workDaysPerWeek=Math.max(1,Math.min(7,parseInt(val)||5));await dbSaveStaff();renderStaff();}
async function toggleCanDo(pid,code,on){const p=G.staff.find(s=>s.id===pid);if(!p)return;if(!p.canDo)p.canDo=[];if(on){if(!p.canDo.includes(code))p.canDo.push(code);}else{p.canDo=p.canDo.filter(c=>c!==code);}await dbSaveStaff();renderStaffDetail();}
async function toggleOffReq(pid,dayIdx,on){const p=G.staff.find(s=>s.id===pid);if(!p)return;if(!p.offRequests)p.offRequests=[];if(on){if(!p.offRequests.includes(dayIdx))p.offRequests.push(dayIdx);}else{p.offRequests=p.offRequests.filter(d=>d!==dayIdx);}await dbSaveStaff();renderStaffDetail();}
function dragStart(e,i){dragSrcIdx=i;setTimeout(()=>document.querySelectorAll('.staff-row')[i]&&document.querySelectorAll('.staff-row')[i].classList.add('dragging'),0);}
function dragOver(e,i){e.preventDefault();document.querySelectorAll('.staff-row').forEach((r,ri)=>r.classList.toggle('drag-over',ri===i&&i!==dragSrcIdx));}
async function dragDrop(e,i){e.preventDefault();if(dragSrcIdx===null||dragSrcIdx===i)return;const moved=G.staff.splice(dragSrcIdx,1)[0];G.staff.splice(i,0,moved);await dbSaveStaff();renderStaff();}
function dragEnd(){dragSrcIdx=null;document.querySelectorAll('.staff-row').forEach(r=>r.classList.remove('dragging','drag-over'));}

// ===== EQUIVALENZE =====
function renderEquivalenze(){
  const el=document.getElementById('eq-list');if(!el)return;
  const workShifts=G.shifts.filter(s=>!s.is_off&&!s.is_ferie);
  if(!G.equivalenze.length){el.innerHTML='<p style="font-size:12px;color:var(--text3);">Nessun gruppo definito.</p>';return;}
  el.innerHTML=G.equivalenze.map((grp,gi)=>`
    <div class="eq-row">
      <span style="font-size:11px;color:var(--text2);min-width:65px;">Gruppo ${gi+1}:</span>
      <div class="eq-tags">
        ${workShifts.map(s=>{const checked=grp.includes(s.code);return`<label class="cb-pill ${checked?'checked':''}" style="${checked?shiftColorStyle(s.code):''}"><input type="checkbox" style="display:none;" ${checked?'checked':''} onchange="toggleEquiv(${gi},'${s.code}',this.checked)">${s.code}</label>`;}).join('')}
      </div>
      <button class="btn danger" style="font-size:11px;padding:3px 8px;" onclick="removeEquivGroup(${gi})">Rimuovi</button>
    </div>`).join('');
}
function toggleEquiv(gi,code,on){if(!G.equivalenze[gi])return;if(on){if(!G.equivalenze[gi].includes(code))G.equivalenze[gi].push(code);}else{G.equivalenze[gi]=G.equivalenze[gi].filter(c=>c!==code);}renderEquivalenze();}
function addEquivGroup(){G.equivalenze.push([]);renderEquivalenze();}
function removeEquivGroup(gi){G.equivalenze.splice(gi,1);renderEquivalenze();}
async function saveEquivalenze(){await dbSaveConfig('equivalenze',G.equivalenze);alert('Equivalenze salvate!');}

// ===== FABBISOGNO =====
function getFab(fabKey){if(!G.fabbisogno[fabKey])G.fabbisogno[fabKey]={slots:[],maxRiposi:0};return G.fabbisogno[fabKey];}
function renderFabbisogno(){
  const el=document.getElementById('fab-grid');if(!el)return;
  const wk=curWeek();
  const workShifts=G.shifts.filter(s=>!s.is_off&&!s.is_ferie);
  function renderCard(name,fabKey,servizio,dayIdx){
    const fab=G.fabbisogno[fabKey]||{slots:[],maxRiposi:0,roleReqs:{}};
    if(!fab.roleReqs)fab.roleReqs={};
    const slotsHtml=(fab.slots||[]).map((slot,si)=>{
      const tags=slot.codes.map(c=>`<span class="fab-shift-tag" style="${shiftColorStyle(c)}">${c}</span>`).join('<span style="font-size:10px;color:var(--text3);padding:0 2px;">o</span>');
      return`<div class="fab-slot"><div class="fab-slot-codes">${tags}</div><button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;margin-left:auto;" onclick="removeFabSlot('${fabKey}',${si})">×</button></div>`;
    }).join('');
    const border=servizio==='pranzo'?'border-top:2px solid #f5d76e;':servizio==='cena'?'border-top:2px solid #93b4f7;':'';
    const sub=servizio==='pranzo'?' <span style="font-size:10px;font-weight:400;color:#7a5c00;">Pranzo</span>':servizio==='cena'?' <span style="font-size:10px;font-weight:400;color:#0a3d6e;">Cena</span>':'';
    // Fasce to show role reqs for
    const tipo2=wk?wk.day_config[dayIdx]||'cena':'cena';
    const allFasceForCard=tipo2==='pranzo_cena'?IDX_PC.map(i=>ALL_FASCE[i]):IDX_CENA.map(i=>ALL_FASCE[i]);
    const fasceForCard=allFasceForCard.filter(f=>{
      if(!servizio)return true;
      if(servizio==='pranzo')return f.tipo==='pranzo';
      return f.tipo==='cena';
    });
    // Role reqs section
    let roleReqsHtml='<div style="margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border);">';
    roleReqsHtml+=`<p style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px;">Ruoli richiesti per fascia</p>`;
    fasceForCard.forEach(f=>{
      const reqs=(fab.roleReqs[f.id])||{};
      roleReqsHtml+=`<div style="margin-bottom:8px;"><span style="font-size:10px;font-weight:600;color:var(--text2);display:block;margin-bottom:3px;">${f.label}</span>`;
      roleReqsHtml+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:3px;">`;
      ROLES.forEach(r=>{
        const val=reqs[r]||0;
        roleReqsHtml+=`<div style="display:flex;align-items:center;gap:3px;font-size:11px;">
          <input type="number" min="0" max="20" value="${val}" onchange="setRoleReq('${fabKey}',${f.id},'${r}',this.value)"
            style="width:34px;padding:2px 3px;border-radius:4px;border:0.5px solid var(--border2);font-family:inherit;font-size:11px;text-align:center;">
          <span style="color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;" title="${r}">${r}</span>
        </div>`;
      });
      roleReqsHtml+=`</div></div>`;
    });
    roleReqsHtml+='</div>';
    // Dup button
    const dupHtml=`<div style="margin-top:6px;">
      <button class="btn" style="font-size:11px;padding:3px 10px;" onclick="dupFabbisogno('${fabKey}')">📋 Duplica su...</button>
    </div>`;
    return`<div class="fab-card" style="${border}">
      <h4>${name}${sub}</h4>
      <div class="fab-slots">${slotsHtml||'<span style="font-size:11px;color:var(--text3);">Nessuno slot</span>'}</div>
      <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:6px;">
        <select id="fab-sel-${fabKey}" style="font-size:11px;padding:3px 6px;border-radius:var(--radius);border:0.5px solid var(--border2);background:#fff;font-family:inherit;">

  else delete fab.roleReqs[fasciaId][roleName];

function dupFabbisogno(srcKey){

// ===== GENERA BOZZA =====
function generaBozza(){
  const wk=curWeek();
  const errors=[];const warnings=[];
  const eligibleStaff=G.staff.filter(p=>!isExtra(p));

  // Count past shift usage
  const shiftCount={};
  eligibleStaff.forEach(p=>{shiftCount[p.id]={};});
  G.weeks.filter(w=>w.id!==wk.id).forEach(w=>{
    DAY_NAMES.forEach((_,di)=>{
      const assigns=w.shift_assign[di]||{};
      eligibleStaff.forEach(p=>{
        ['_P','_C',''].forEach(suffix=>{
          const code=assigns[p.id+suffix]||'';
          if(code&&code!=='OFF'&&code!=='FERIE'){shiftCount[p.id][code]=(shiftCount[p.id][code]||0)+1;}
        });
      });
    });
  });

  const weekWorkDays={};const weekOffDays={};
  eligibleStaff.forEach(p=>{weekWorkDays[p.id]=0;weekOffDays[p.id]=0;});

  const openDays=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  const newAssign={};
  DAY_NAMES.forEach((_,di)=>{newAssign[di]={};});

  // Build list of "sessions" to process: each session has a fabKey, dayIdx, servizio
  const sessions=[];
  openDays.forEach(d=>{
    if(d.tipo==='pranzo_cena'){
      sessions.push({di:d.idx,fabKey:`${d.idx}_pranzo`,servizio:'pranzo',dayName:DAY_NAMES[d.idx]});
      sessions.push({di:d.idx,fabKey:`${d.idx}_cena`,servizio:'cena',dayName:DAY_NAMES[d.idx]});
    } else {
      sessions.push({di:d.idx,fabKey:String(d.idx),servizio:null,dayName:DAY_NAMES[d.idx]});
    }
  });

  // Sort sessions by difficulty
  function countAvail(fabKey,slots){
    if(!slots||!slots.length)return 999;
    return eligibleStaff.filter(p=>slots.some(slot=>slot.codes.some(c=>(p.canDo||[]).includes(c)))).length-slots.length;
  }
  sessions.sort((a,b)=>{
    const fa=G.fabbisogno[a.fabKey];const fb=G.fabbisogno[b.fabKey];
    return countAvail(a.fabKey,fa?fa.slots:[]) - countAvail(b.fabKey,fb?fb.slots:[]);
  });

  // Track per-day assignments
  const serviceAssigned={};openDays.forEach(d=>{serviceAssigned[d.idx]={};});
  const newRoleAssign={};// pre-assigned roles from roleReqs

  // Helper: get compatible shifts for a role
  function compatShiftsForRole(role){
    return G.shifts.filter(s=>!isFuoriServizio(s.code)&&(s.compatibleRoles||[]).includes(role)).map(s=>s.code);
  }

  // PASS 1: assign staff based on roleReqs (primary) + old slots (fallback)
  sessions.forEach(sess=>{
    const{di,fabKey,servizio,dayName}=sess;
    const fab=G.fabbisogno[fabKey];
    if(!fab)return;
    const assignedInSession=new Set();

    // Build role demand: max count per role across fasce for this servizio
    const roleMax={};
    Object.entries(fab.roleReqs||{}).forEach(([fid,reqs])=>{
      const f=ALL_FASCE.find(f=>f.id==fid);if(!f)return;
      if(servizio==='pranzo'&&f.tipo!=='pranzo')return;
      if(servizio==='cena'&&f.tipo!=='cena')return;
      Object.entries(reqs).forEach(([role,count])=>{
        roleMax[role]=Math.max(roleMax[role]||0,count);
      });
    });

    // Assign people for each needed role
    Object.entries(roleMax).forEach(([neededRole,count])=>{
      if(count<=0)return;
      const compatShifts=compatShiftsForRole(neededRole);
      let assigned=0;
      while(assigned<count){
        function findBestForRole(ignoreOffReq){
          const cands=[];
          eligibleStaff.forEach(p=>{
            if(assignedInSession.has(p.id))return;
            const svc=serviceAssigned[di][p.id];
            if(svc===servizio)return;
            if(svc&&svc!==servizio)return;
            if(weekWorkDays[p.id]>=(p.workDaysPerWeek||5))return;
            if(!ignoreOffReq&&(p.offRequests||[]).includes(di))return;
            const doable=compatShifts.length>0
              ?compatShifts.filter(c=>(p.canDo||[]).includes(c))
              :(p.canDo||[]).filter(c=>!isFuoriServizio(c));
            if(!doable.length)return;
            doable.sort((a,b)=>(shiftCount[p.id][a]||0)-(shiftCount[p.id][b]||0));
            const pref=(p.preferredRoles||{})[String(servizio==='pranzo'?1:4)]||'';
            const bonus=pref===neededRole?-0.5:0;
            cands.push({p,bestCode:doable[0],score:(shiftCount[p.id][doable[0]]||0)+(weekWorkDays[p.id]*0.4)+bonus});
          });
          cands.sort((a,b)=>a.score-b.score);return cands[0]||null;
        }
        let best=findBestForRole(false);let usedFallback=false;
        if(!best){best=findBestForRole(true);usedFallback=!!best;}
        if(!best){errors.push(`${dayName}${servizio?' ('+servizio+')':''}: nessuno per ruolo ${neededRole}`);break;}
        const storeKey=servizio==='pranzo'?best.p.id+'_P':servizio==='cena'?best.p.id+'_C':best.p.id;
        newAssign[di][storeKey]=best.bestCode;
        assignedInSession.add(best.p.id);
        if(!serviceAssigned[di][best.p.id]){serviceAssigned[di][best.p.id]=servizio||'any';weekWorkDays[best.p.id]++;}
        shiftCount[best.p.id][best.bestCode]=(shiftCount[best.p.id][best.bestCode]||0)+1;
        // Pre-assign role
        ALL_FASCE.forEach(f=>{
          if(servizio==='pranzo'&&f.tipo!=='pranzo')return;
          if(servizio==='cena'&&f.tipo!=='cena')return;
          if(!shiftInFascia(best.bestCode,f.id))return;
          const rk=`${di}_${f.id}_${best.p.id}`;
          if(!newRoleAssign[rk])newRoleAssign[rk]=neededRole;
        });
        if(usedFallback)warnings.push(`${dayName}: ${best.p.name} → ${neededRole} nonostante giorno libero`);
        assigned++;
      }
    });

    // Fallback: old-style slots for remaining needed people
    (fab.slots||[]).forEach(slot=>{
      const acceptableCodes=slot.codes;
      function findBestSlot(ignoreOffReq){
        const cands=[];
        eligibleStaff.forEach(p=>{
          if(assignedInSession.has(p.id))return;
          const svc=serviceAssigned[di][p.id];
          if(svc===servizio)return;
          if(svc&&svc!==servizio)return;
          if(weekWorkDays[p.id]>=(p.workDaysPerWeek||5))return;
          if(!ignoreOffReq&&(p.offRequests||[]).includes(di))return;
          const doable=acceptableCodes.filter(c=>(p.canDo||[]).includes(c));
          if(!doable.length)return;
          doable.sort((a,b)=>(shiftCount[p.id][a]||0)-(shiftCount[p.id][b]||0));
          cands.push({p,bestCode:doable[0],score:(shiftCount[p.id][doable[0]]||0)+(weekWorkDays[p.id]*0.4)});
        });
        cands.sort((a,b)=>a.score-b.score);return cands[0]||null;
      }
      let best=findBestSlot(false);let usedFallback=false;
      if(!best){best=findBestSlot(true);usedFallback=!!best;}
      if(best){
        const storeKey=servizio==='pranzo'?best.p.id+'_P':servizio==='cena'?best.p.id+'_C':best.p.id;
        newAssign[di][storeKey]=best.bestCode;
        assignedInSession.add(best.p.id);
        if(!serviceAssigned[di][best.p.id]){serviceAssigned[di][best.p.id]=servizio||'any';weekWorkDays[best.p.id]++;}
        shiftCount[best.p.id][best.bestCode]=(shiftCount[best.p.id][best.bestCode]||0)+1;
        if(usedFallback)warnings.push(`${dayName}: ${best.p.name} assegnato nonostante giorno libero`);
      } else {
        errors.push(`${dayName}${servizio?' ('+servizio+')':''}: nessuno per slot [${acceptableCodes.join('/')}]`);
      }
    });
  });

  // PASS 2: assign OFF — use first fab of each day for maxRiposi
  openDays.forEach(d=>{
    const di=d.idx;
    const fabKey=d.tipo==='pranzo_cena'?`${di}_cena`:String(di);
    const fab=G.fabbisogno[fabKey];
    const riposiMax=fab?fab.maxRiposi||0:0;
    if(riposiMax<=0)return;
    // Person already assigned = any of their keys for this day
    const alreadyHasShift=p=>{
      return !!(newAssign[di][p.id]||newAssign[di][p.id+'_P']||newAssign[di][p.id+'_C']);
    };
    let riposiCount=0;
    eligibleStaff
      .filter(p=>!alreadyHasShift(p)&&weekOffDays[p.id]===0)
      .sort((a,b)=>weekWorkDays[a.id]-weekWorkDays[b.id])
      .forEach(p=>{
        if(riposiCount>=riposiMax)return;
        newAssign[di][p.id]='OFF';weekOffDays[p.id]++;riposiCount++;
      });
  });

  // PASS 3: apply regole
  G.regole.forEach(regola=>{
    if(!regola.absentId||!regola.requiredId)return;
    openDays.forEach(d=>{
      const di=d.idx;
      const absentWorking=isWorking(newAssign[di],regola.absentId);
      if(absentWorking)return;
      const requiredWorking=isWorking(newAssign[di],regola.requiredId);
      if(requiredWorking)return;
      const reqP=eligibleStaff.find(s=>s.id===regola.requiredId);
      if(!reqP){return;}
      if(newAssign[di][regola.requiredId])return;
      const doable=(reqP.canDo||[]).filter(c=>c!=='OFF'&&c!=='FERIE');
      if(!doable.length){warnings.push(`${DAY_NAMES[di]}: regola non rispettata — ${reqP.name} non ha turni abilitati`);return;}
      doable.sort((a,b)=>(shiftCount[reqP.id]?.[a]||0)-(shiftCount[reqP.id]?.[b]||0));
      if(weekWorkDays[reqP.id]>=(reqP.workDaysPerWeek||5)){
        warnings.push(`${DAY_NAMES[di]}: regola applicata — ${reqP.name} supera i giorni settimanali previsti`);
      }
      newAssign[di][reqP.id]=doable[0];
      weekWorkDays[reqP.id]++;
    });
  });

  wk.shift_assign=newAssign;
  // Merge pre-assigned roles (from roleReqs) into role_assign
  Object.assign(wk.role_assign,newRoleAssign);
  dbSaveWeek(wk);
  renderTurni();

  const alertEl=document.getElementById('draft-alerts');
  let html='';
  if(errors.length)html+=`<div class="alert-box"><h4>⚠ Slot non coperti</h4><ul>${errors.map(e=>`<li>${e}</li>`).join('')}</ul></div>`;
  if(warnings.length)html+=`<div class="warn-box"><h4>Avvisi</h4><ul>${warnings.map(w=>`<li>${w}</li>`).join('')}</ul></div>`;
  if(!errors.length&&!warnings.length){
    html=`<div style="background:var(--green-bg);border:0.5px solid var(--green-border);border-radius:var(--radius);padding:10px 16px;margin-bottom:1rem;font-size:12px;color:var(--green-text);">✓ Bozza generata con successo!</div>`;
    setTimeout(()=>{const el=document.getElementById('draft-alerts');if(el)el.innerHTML='';},4000);
  }
  if(alertEl)alertEl.innerHTML=html;
}

      <td><input type="text" value="${s.s1||''}" placeholder="inizio" onchange="G.shifts[${i}].s1=this.value" style="width:46px;font-family:inherit;"> <input type="text" value="${s.e1||''}" placeholder="fine" onchange="G.shifts[${i}].e1=this.value" style="width:46px;font-family:inherit;"></td>
      <td><input type="text" value="${s.s2||''}" placeholder="inizio" onchange="G.shifts[${i}].s2=this.value" style="width:46px;font-family:inherit;"> <input type="text" value="${s.e2||''}" placeholder="fine" onchange="G.shifts[${i}].e2=this.value" style="width:46px;font-family:inherit;"></td>`;
    ALL_FASCE.forEach(f=>{h+=`<td><input type="checkbox" ${s.fasce&&s.fasce.includes(f.id)?'checked':''} onchange="toggleFascia(${i},${f.id},this.checked)"></td>`;});
    const compatRoles=s.compatibleRoles||[];

}
function toggleFascia(i,fid,on){const s=G.shifts[i];if(!s.fasce)s.fasce=[];if(on){if(!s.fasce.includes(fid))s.fasce.push(fid);}else{s.fasce=s.fasce.filter(x=>x!==fid);}renderLegSidebar();}
function toggleCompatRole(i,role,on){const s=G.shifts[i];if(!s.compatibleRoles)s.compatibleRoles=[];if(on){if(!s.compatibleRoles.includes(role))s.compatibleRoles.push(role);}else{s.compatibleRoles=s.compatibleRoles.filter(r=>r!==role);}renderLegenda();}
async function saveShifts(){await dbSaveShifts();renderAll();alert('Legenda salvata!');}
function remShift(i){G.shifts.splice(i,1);renderLegenda();}
function addShift(){
  const newShift={code:'NEW',s1:'',e1:'',s2:'',e2:'',is_off:false,is_ferie:false,fasce:[],compatibleRoles:[]};
  // Insert alphabetically by code — find insertion point
  const idx=G.shifts.findIndex(s=>!s.is_off&&!s.is_ferie&&s.code!=='MALATTIA'&&s.code>'NEW');

}

// ===== AUTO FILL ROLES =====
function autoFillRoles(){
  const wk=curWeek();if(!wk)return;
  const di=wk.selected_day;const tipo=wk.day_config[di];
  const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
  const fasce=fasciaIdxs.map(i=>ALL_FASCE[i]);
  pushUndo(wk);
  fasce.forEach(f=>{
    const fabKey=tipo==='pranzo_cena'?(f.tipo==='pranzo'?`${di}_pranzo`:`${di}_cena`):String(di);
    const fab=G.fabbisogno[fabKey];
    const roleReqs=(fab&&fab.roleReqs&&fab.roleReqs[f.id])||{};
    const roleCount={};
    G.staff.forEach(p=>{
      if(!personInFascia(wk,di,p.id,f,tipo))return;
      const key=`${di}_${f.id}_${p.id}`;
      if(wk.role_assign[key])return;// skip if already set
      // Check role rules first
      let assignedRole=null;
      for(const rr of (G.roleRules||[])){
        if(!rr.targetPersonId||rr.targetPersonId!==p.id)continue;
        if(rr.excludeDays&&rr.excludeDays.includes(di))continue;
        const condCode=getShiftCode(wk,di,rr.condPersonId,null)||getShiftCode(wk,di,rr.condPersonId,'cena')||getShiftCode(wk,di,rr.condPersonId,'pranzo');
        const condWorking=condCode&&!isFuoriServizio(condCode);
        if(rr.condType==='present'&&condWorking){assignedRole=rr.targetRole;break;}
        if(rr.condType==='absent'&&!condWorking){assignedRole=rr.targetRole;break;}
      }
      if(!assignedRole){
        const pref=(p.preferredRoles||{})[String(f.id)];
        const sec=(p.secondaryRoles||{})[String(f.id)];
        if(pref){
          const req=roleReqs[pref]||0;
          const cur=roleCount[pref]||0;
          assignedRole=(req>0&&cur>=req)?(sec||pref):pref;
        } else if(sec){assignedRole=sec;}
      }
      if(assignedRole){
        wk.role_assign[key]=assignedRole;
        roleCount[assignedRole]=(roleCount[assignedRole]||0)+1;
      }
    });
  });
  applyPosRules(wk,di,tipo,wk.role_assign);
  markDirty();renderDayContent();
}

// ===== INCOMPLETEZZA =====
function checkIncompleteness(wk){
  const issues=[];
  const openDays=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  openDays.forEach(d=>{
    const di=d.idx;const tipo=d.tipo;
    const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
    fasciaIdxs.forEach(fi=>{
      const f=ALL_FASCE[fi];
      const fabKey=tipo==='pranzo_cena'?(f.tipo==='pranzo'?`${di}_pranzo`:`${di}_cena`):String(di);
      const fab=G.fabbisogno[fabKey];
      if(!fab||!fab.roleReqs||!fab.roleReqs[f.id])return;
      Object.entries(fab.roleReqs[f.id]).forEach(([roleName,required])=>{
        if(!required||required<=0)return;
        const actual=G.staff.filter(p=>{
          const key=`${di}_${f.id}_${p.id}`;
          return(wk.role_assign[key])===roleName&&personInFascia(wk,di,p.id,f,tipo);
        }).length;
        if(actual<required)issues.push(`${d.name} ${f.label}: ${roleName} ${actual}/${required}`);
      });
    });
  });
  return issues;
}
function updateIncompleteAlert(){
  const el=document.getElementById('incomplete-alert');if(!el)return;
  const wk=curWeek();if(!wk){el.style.display='none';return;}
  const issues=checkIncompleteness(wk);
  if(issues.length>0){el.style.display='block';el.textContent=`⚠ ${issues.length} ruoli non coperti`;el.title=issues.join('\n');}
  else el.style.display='none';
}

// Apply posRules when compiling roles auto
function applyPosRules(wk,di,tipo,roleAssign){
  if(!G.posRules||!G.posRules.length)return;
  // For each pos rule, check if one person has a role and adjust the other
  G.posRules.forEach(rule=>{
    if(!rule.personA||!rule.personB)return;
    if((rule.excludeDays||[]).includes(di))return;
    const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
    fasciaIdxs.forEach(fi=>{
      const f=ALL_FASCE[fi];
      const keyA=`${di}_${f.id}_${rule.personA}`;
      const keyB=`${di}_${f.id}_${rule.personB}`;
      const roleA=roleAssign[keyA];
      const roleB=roleAssign[keyB];
      if(!roleA||!roleB)return;// can't check if one is missing
      const zoneA=getRoleZone(roleA);
      const zoneB=getRoleZone(roleB);
      if(rule.type==='different'&&zoneA===zoneB){
        // Violation: try to move person B to their secondary role
        const pB=G.staff.find(s=>s.id===rule.personB);
        if(!pB)return;
        const sec=(pB.secondaryRoles||{})[String(f.id)];
        if(sec&&getRoleZone(sec)!==zoneA){
          roleAssign[keyB]=sec;
        }
      }
    });
  });
}

  if(!v)return;
  const wk=G.weeks.find(w=>w.id===v.week_id);
  if(!wk){alert('Settimana non trovata.');return;}
  // Save current as version before restoring
  await saveVersionSnapshot(wk,'Prima del ripristino');
  wk.shift_assign=v.shift_assign||{};
  wk.role_assign=v.role_assign||{};
  await dbSaveWeek(wk);
  if(wk.id===G.currentWeekId)renderTurni();
  alert('Versione ripristinata!');
  loadArchive();
}

// ===== GESTIONE MANAGER =====
function renderManagers(){
  const el=document.getElementById('managers-list');if(!el)return;
  if(!G.managers.length){el.innerHTML='<p style="font-size:12px;color:var(--text3);">Nessun manager.</p>';return;}
  el.innerHTML=G.managers.map(m=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:6px;flex-wrap:wrap;">
      <span style="font-weight:500;flex:1;">${m.name}</span>
      <input type="password" placeholder="Nuova password" id="pwd-${m.id}"
        style="width:160px;padding:5px 9px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:12px;font-family:inherit;">
      <button class="btn primary" style="font-size:11px;padding:4px 10px;" onclick="changeManagerPwd('${m.id}')">Cambia password</button>
      ${m.id!==currentManager?.id?`<button class="btn danger" style="font-size:11px;padding:4px 10px;" onclick="deleteManager('${m.id}','${m.name}')">Rimuovi</button>`:'<span style="font-size:11px;color:var(--blue-text);">(tu)</span>'}
    </div>`).join('');
}
async function changeManagerPwd(mid){
  const inp=document.getElementById('pwd-'+mid);
  if(!inp||!inp.value.trim()){alert('Inserisci una password.');return;}
  const newPwd=inp.value.trim();
  await sb.from('managers').update({password:newPwd}).eq('id',mid);
  const m=G.managers.find(m=>m.id===mid);if(m)m.password=newPwd;
  inp.value='';
  alert('Password aggiornata!');
}
async function addManager(){
  const nameEl=document.getElementById('new-mgr-name');
  const pwdEl=document.getElementById('new-mgr-pwd');
  if(!nameEl.value.trim()||!pwdEl.value.trim()){alert('Inserisci nome e password.');return;}
  const newMgr={id:'m'+Date.now(),name:nameEl.value.trim(),password:pwdEl.value.trim()};
  await sb.from('managers').insert(newMgr);
  G.managers.push(newMgr);
  nameEl.value='';pwdEl.value='';
  renderManagers();
  alert('Manager aggiunto!');
}
async function deleteManager(mid,name){
  if(!confirm(`Rimuovere il manager "${name}"?`))return;
  await sb.from('managers').delete().eq('id',mid);
  G.managers=G.managers.filter(m=>m.id!==mid);
  renderManagers();
}

let presenceInterval=null;
async function setOnline(){
  if(!currentManager||!isManager())return;
  try{
    await sb.from('config').upsert({key:'online_'+currentManager.id, value:JSON.stringify({name:currentManager.name,at:new Date().toISOString()})});
  }catch(e){}
}
async function setOffline(){
  if(!currentManager||!isManager())return;
  try{await sb.from('config').delete().eq('key','online_'+currentManager.id);}catch(e){}
}
async function updateOnlineBadge(){
  if(!isManager())return;
  try{
    const {data}=await sb.from('config').select('key,value').like('key','online_%');
    if(!data||!data.length){document.getElementById('online-badge')&&(document.getElementById('online-badge').textContent='');return;}
    const now=Date.now();
    const online=data.map(r=>{
      try{const v=JSON.parse(r.value);return{name:v.name,at:new Date(v.at).getTime()};}catch(e){return null;}
    }).filter(v=>v&&now-v.at<120000);// active in last 2 minutes
    const el=document.getElementById('online-badge');
    if(el){
      if(online.length>1){
        const others=online.filter(v=>v.name!==currentManager?.name).map(v=>v.name);
        el.innerHTML=others.length?`<span style="background:var(--orange-bg);color:var(--orange-text);border:0.5px solid var(--orange-border);padding:2px 8px;border-radius:20px;font-size:10px;">&#128100; Online anche: ${others.join(', ')}</span>`:'';
      } else {el.textContent='';}
    }
  }catch(e){}
}
function startPresence(){

}

// ===== EXPORT PDF =====
function exportPDF(){
  const wk=curWeek();if(!wk)return;
  if(!confirm('Esportare i turni e il giornaliero della settimana "'+wk.name+'" in PDF?'))return;
  const days=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  const weekDates=getWeekDates(wk);
  let cols=[];
  days.forEach(d=>{
    const dateStr=weekDates?weekDates[d.idx].getDate():'';
    const label=dateStr?d.name+' '+dateStr:d.name;
    if(d.tipo==='pranzo_cena'){cols.push({...d,label,servizio:'pranzo',colLabel:'P'});cols.push({...d,label,servizio:'cena',colLabel:'C'});}
    else cols.push({...d,label,servizio:null});
  });
  let html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Turni '+wk.name+'</title><style>body{font-family:Arial,sans-serif;font-size:10px;margin:16px;}h1{font-size:14px;margin-bottom:8px;}h2{font-size:11px;margin:14px 0 4px;page-break-before:avoid;}table{border-collapse:collapse;width:100%;margin-bottom:12px;}th,td{border:0.5px solid #ccc;padding:2px 4px;text-align:center;}th{background:#f0f0f0;font-weight:600;}.name{text-align:left;font-weight:500;}.off{background:#111;color:#fff;}.b{background:#1a56db;color:#fff;}.d{background:#e65100;color:#fff;}.m{background:#6b7280;color:#fff;}.a{background:#c026d3;color:#fff;}.e{background:#dc2626;color:#fff;}@media print{body{margin:8px;}}</style></head><body>';
  html+='<h1>Turni settimana: '+wk.name+'</h1>';
  html+='<table><thead><tr><th class="name">Dipendente</th>';
  let lastDi=-1;
  cols.forEach(c=>{if(c.idx===lastDi)return;lastDi=c.idx;const sp=c.tipo==='pranzo_cena'?2:1;html+='<th colspan="'+sp+'">'+c.label+'</th>';});
  html+='</tr></thead><tbody>';
  G.staff.forEach(p=>{
    html+='<tr><td class="name">'+p.name+'</td>';
    cols.forEach(c=>{
      const val=getShiftCode(wk,c.idx,p.id,c.servizio)||'';
      const u=val.toUpperCase();
      let cls='';
      if(u==='OFF'||u==='FERIE'||u==='MALATTIA')cls='off';
      else if(u[0]==='B')cls='b';else if(u[0]==='D')cls='d';else if(u[0]==='M')cls='m';else if(u[0]==='A')cls='a';else if(u[0]==='E')cls='e';
      html+='<td class="'+cls+'">'+val+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table><h1>Giornaliero per fascia</h1>';
  days.forEach(d=>{
    const tipo=d.tipo;
    const fasciaIdxs=tipo==='pranzo_cena'?IDX_PC:IDX_CENA;
    const fasce=fasciaIdxs.map(i=>ALL_FASCE[i]);
    const dateStr=weekDates?' '+weekDates[d.idx].getDate():'';
    html+='<h2>'+d.name+dateStr+'</h2><table><thead><tr><th class="name">Staff</th>';
    fasce.forEach(f=>{html+='<th>'+f.label+'</th>';});
    html+='<th>Turno</th></tr></thead><tbody>';
    G.staff.forEach(p=>{
      const hasAny=fasce.some(f=>personInFascia(wk,d.idx,p.id,f,tipo));
      if(!hasAny)return;
      html+='<tr><td class="name">'+p.name+'</td>';
      fasce.forEach(f=>{
        const working=personInFascia(wk,d.idx,p.id,f,tipo);
        if(!working){html+='<td style="color:#ccc;">&mdash;</td>';}
        else{const key=d.idx+'_'+f.id+'_'+p.id;const role=wk.role_assign[key]||'';html+='<td>'+role+'</td>';}
      });
      const cp=tipo==='pranzo_cena'?getShiftCode(wk,d.idx,p.id,'pranzo'):'';
      const cc=tipo==='pranzo_cena'?getShiftCode(wk,d.idx,p.id,'cena'):getShiftCode(wk,d.idx,p.id,null);
      const turno=tipo==='pranzo_cena'?(cp&&cc?cp+'/'+cc:cp||cc):cc;
      html+='<td><b>'+(turno||'')+'</b></td></tr>';
    });
    html+='</tbody></table>';
  });
  html+='</body></html>';
  const win=window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(function(){win.print();},600);
}

// ===== CONFRONTO SETTIMANA =====
function openCompare(){
  const panel=document.getElementById('compare-panel');
  const overlay=document.getElementById('compare-overlay');
  const sel=document.getElementById('compare-week-sel');
  if(!panel)return;
  // Populate selector with all weeks except current
  const wk=curWeek();
  sel.innerHTML=G.weeks
    .filter(w=>w.id!==wk?.id)
    .map(w=>`<option value="${w.id}">${w.name}</option>`)
    .join('');
  panel.classList.add('open');
  overlay.classList.add('open');
  loadCompare();
}
function closeCompare(){
  document.getElementById('compare-panel')?.classList.remove('open');
  document.getElementById('compare-overlay')?.classList.remove('open');
}
function loadCompare(){
  const sel=document.getElementById('compare-week-sel');
  const body=document.getElementById('compare-body');
  if(!sel||!body)return;
  const wkId=sel.value;
  const wk=G.weeks.find(w=>w.id===wkId);
  if(!wk){body.innerHTML='<p style="color:var(--text3);font-size:12px;">Settimana non trovata.</p>';return;}
  const days=DAY_NAMES.map((n,i)=>({name:n,idx:i,tipo:wk.day_config[i]})).filter(d=>d.tipo!=='chiuso');
  const weekDates=getWeekDates(wk);
  // Build read-only grid
  let cols=[];
  days.forEach(d=>{
    const dateStr=weekDates?weekDates[d.idx].getDate():'';
    const label=dateStr?`${d.name} ${dateStr}`:d.name;
    if(d.tipo==='pranzo_cena'){
      cols.push({...d,label,servizio:'pranzo',colLabel:'P'});
      cols.push({...d,label,servizio:'cena',colLabel:'C'});
    } else {
      cols.push({...d,label,servizio:null,colLabel:null});
    }
  });
  let h=`<p style="font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;">${wk.name}</p>`;
  h+='<div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:11px;width:100%;">';
  h+='<thead><tr><th style="text-align:left;padding:3px 6px;background:var(--bg3);border:0.5px solid var(--border);min-width:80px;position:sticky;left:0;">Staff</th>';
  // Day headers
  let lastDi=-1;
  cols.forEach(c=>{
    if(c.idx===lastDi)return;lastDi=c.idx;
    const span=c.tipo==='pranzo_cena'?2:1;
    const bg=c.tipo==='pranzo_cena'?'#fff8dd':'var(--bg3)';
    const col=c.tipo==='pranzo_cena'?'#7a5c00':'var(--text)';
    h+=`<th colspan="${span}" style="background:${bg};color:${col};padding:3px 5px;border:0.5px solid var(--border);white-space:nowrap;font-size:10px;">${c.label}</th>`;
  });
  h+='</tr>';
  if(cols.some(c=>c.colLabel)){
    h+='<tr><th style="background:var(--bg3);border:0.5px solid var(--border);"></th>';
    cols.forEach(c=>{
      if(c.tipo==='pranzo_cena'){
        const bg=c.servizio==='pranzo'?'#fff8dd':'#ddeeff';
        const col=c.servizio==='pranzo'?'#7a5c00':'#0a3d6e';
        h+=`<th style="background:${bg};color:${col};font-size:9px;padding:2px 4px;border:0.5px solid var(--border);">${c.colLabel}</th>`;
      } else {
        h+='<th style="background:var(--bg3);border:0.5px solid var(--border);"></th>';
      }
    });
    h+='</tr>';
  }
  h+='</thead><tbody>';
  G.staff.forEach(p=>{
    h+=`<tr><td style="text-align:left;padding:3px 6px;border:0.5px solid var(--border);background:#fff;position:sticky;left:0;font-size:11px;white-space:nowrap;">${p.name}</td>`;
    cols.forEach(c=>{
      const val=getShiftCode(wk,c.idx,p.id,c.servizio);
      const cs=val?shiftColorStyle(val):'';
      h+=`<td style="padding:3px 5px;border:0.5px solid var(--border);text-align:center;font-size:10px;font-weight:${val?'600':'400'};${cs}">${val||''}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  body.innerHTML=h;
}
